[package]
name = "views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
serde_yaml.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
word.workspace = true
forms.workspace = true
# `kind_catalog` projects `rules::kind::Kind` (the same enum `S103`
# validates a declared `kind:` against) into the `/notations` kind catalog,
# so the docs page and the template gallery's kind/category facet cannot
# drift from the gate (LAW-53). `views` is never compiled to `wasm32` —
# only `webapp --features web` is — so this carries no wasm32 cost.
rules.workspace = true

# `record_citation` parses drafted record citations out of a draft body; its
# patterns are static, so this is a normal dependency (the accessibility gate's
# dev-dependency regex use is separate).
regex.workspace = true

[dev-dependencies]
# Layer-1 accessibility gate (`tests/accessibility.rs`) uses these
# assertion helpers for structural invariants.
tempfile.workspace = true

[dependencies.tokio]
workspace = true
features = ["rt"]

[lints]
workspace = true

# A synthetic ORDINARY deployment — not the automation home, and declining
# DocuSign. See ../../README.md; nothing here names a resource that exists.
#
# Its job is the common path: every requirement that applies to every row, and
# a `SecretProviderClass` plan that skips the two blocks a row may legitimately
# omit. `example-automation-home` covers the other side of both forks.

kms_key = "projects/example-project/locations/example-region/keyRings/navigator-secrets/cryptoKeys/deployment-config"

# The line that arms every gate. An unprovisioned row is skipped by all of
# them, which is why both real rows left this suite asserting nothing.
provisioned = true

[env]
NAVIGATOR_ENVIRONMENT = "production"
NAVIGATOR_CREDENTIAL_ENVIRONMENT = "production"
NAVIGATOR_SIMULATED_MATTERS = "false"

# --- Google Cloud ----------------------------------------------------------
NAVIGATOR_GCP_PROJECT_ID = "example-project"
NAVIGATOR_GCP_LOCATION = "example-region"
NAVIGATOR_GKE_CLUSTER_NAME = "example-cluster"
NAVIGATOR_GKE_CONTEXT = "gke_example-project_example-region_example-cluster"
NAVIGATOR_K8S_NAMESPACE = "example-deployment"
NAVIGATOR_VPC_NAME = "example-vpc"
NAVIGATOR_SUBNETWORK_NAME = "example-subnet"
NAVIGATOR_GATEWAY_IP_NAME = "example-gateway"
NAVIGATOR_GATEWAY_IP = "192.0.2.1"
NAVIGATOR_GCP_SERVICE_ACCOUNT_ID = "example-navigator"
NAVIGATOR_DRIVE_GCP_SERVICE_ACCOUNT_ID = "example-navigator-drive"
NAVIGATOR_WEB_SECRET_NAME = "example-deployment-web-secrets"

# --- Sign-in client --------------------------------------------------------
NAVIGATOR_OAUTH_CLIENT_ID_BROWSER = "000000000000-examplebrowser.apps.googleusercontent.com"
NAVIGATOR_BOOTSTRAP_OWNER_EMAIL = "owner@example.invalid"
NAVIGATOR_FORGEJO_ROOT_URL = "https://forgejo.example.invalid/"
NAVIGATOR_FORGEJO_OIDC_CLIENT_ID = "synthetic-forgejo-client"
NAVIGATOR_FORGEJO_OIDC_NAME = "synthetic-oidc"
NAVIGATOR_FORGEJO_OIDC_DISCOVERY_URL = "https://forgejo.example.invalid/.well-known/openid-configuration"
NAVIGATOR_FORGEJO_ADMISSION_DOMAINS = "example.invalid"

# --- Storage ---------------------------------------------------------------
NAVIGATOR_ASSETS_BUCKET = "example-assets"
NAVIGATOR_DOCUMENTS_BUCKET = "example-documents"
NAVIGATOR_EXPORTS_BUCKET = "example-exports"
NAVIGATOR_SURREAL_ARCHIVES_BUCKET = "example-surreal-archives"
NAVIGATOR_LOGS_BUCKET = "example-deployment-logs"
NAVIGATOR_APPLICATIONS_BUCKET = "example-applications"
NAVIGATOR_ARCHIVES_BUCKET = "example-archives"
NAVIGATOR_TELEMETRY_BUCKET = "example-deployment-telemetry"

# --- Images ----------------------------------------------------------------
NAVIGATOR_IMAGE_REGISTRY = "ghcr.io/example/navigator"
NAVIGATOR_WEB_IMAGE = "neon-server"

# --- Public surface --------------------------------------------------------
# A reserved synthetic domain, per the no-client-data rule. A real hostname
# here would make this fixture indistinguishable from a deployment.
NAVIGATOR_PUBLIC_HOST = "navigator.example.invalid"
NAVIGATOR_PRIMARY_DOMAIN = "example.invalid"
CANONICAL_HOST = "navigator.example.invalid"
NAV_BASE_URL = "https://navigator.example.invalid/"
NAVIGATOR_ASSET_BASE_URL = "https://navigator.example.invalid/assets"
NAVIGATOR_WORKFLOWS_HOST = "workflows.example.invalid"
NAVIGATOR_WORKFLOWS_URL = "https://workflows.example.invalid/"
# Public Restate Cloud request-signing key; synthetic fixture value.
RESTATE_IDENTITY_KEY = "publickeyv1_test-identity-key"
SLACK_GENERAL_CHANNEL_ID = "C0000000002"
SLACK_FINANCE_CHANNEL_ID = "C0000000001"
SLACK_MESSAGES_CHANNEL_ID = "C0000000003"
SLACK_STAGING_MESSAGES_CHANNEL_ID = "C0000000004"

# --- Sign-in ---------------------------------------------------------------
GOOGLE_OAUTH_REQUIRED_HD = "example.com"

# --- Forge -----------------------------------------------------------------
# NOT the automation home, so the webhook five-tuple must be absent:
# `store::deployment` scopes that requirement to one project, and
# `NAVIGATOR_GITHUB_CANONICAL_REPOSITORY` is part of it.
NAVIGATOR_FORGE_BACKEND = "github"
NAVIGATOR_GITHUB_ORG = "neon-law-source-code"
NAVIGATOR_GIT_HOST = "git.example.invalid"
NAVIGATOR_GITHUB_APP_ID = "100000"

# --- Brand social accounts --------------------------------------------------
# Synthetic public app ids. Each declares its provider, so this production-like
# row must also carry the matching secret, the Meta webhook pair, and the
# runtime KMS key in secrets.enc.yaml. The automation-home row declares none.
NAVIGATOR_META_APP_ID = "1000000000000001"
NAVIGATOR_THREADS_APP_ID = "2000000000000002"

# --- SurrealDB -------------------------------------------------------------
# Coordinates, deliberately plaintext; the root credentials are key material.
# `wss://` because the three-topology contract in `store/src/surreal/mod.rs`
# expects it of a cloud deployment.
NAVIGATOR_SURREAL_ENDPOINT = "wss://example-deployment.surreal.example/rpc"
NAVIGATOR_SURREAL_NAMESPACE = "navigator"
NAVIGATOR_SURREAL_DATABASE = "navigator"

NAVIGATOR_LINKEDIN_CLIENT_ID = "synthetic-linkedin-client"

NAVIGATOR_YOUTUBE_CLIENT_ID = "synthetic-youtube-app"
NAVIGATOR_X_CLIENT_ID = "synthetic-x-app"
NAVIGATOR_TIKTOK_BUSINESS_APP_ID = "synthetic-tiktok-for-business-app"
NAVIGATOR_TIKTOK_BUSINESS_AUTHORIZATION_URL = "https://www.tiktok.com/v2/auth/authorize?client_key=synthetic"
NAVIGATOR_GITHUB_AUTOMATION_HOME = "false"
NAVIGATOR_SMS_TEST_RECIPIENTS_DEPLOYMENT = "false"

# Synthetic key material — see ../../README.md. Every value is the literal
# `ENC[FIXTURE]`, and no test here decrypts.
#
# `deployments::encrypted_key_names` asserts three things about this shape, and
# each catches a different accident: the `sops` block proves the file was
# encrypted at all, the `ENC[` prefix proves per-value encryption rather than a
# whole-file envelope, and the key names prove nobody dropped a `data` blob in.
# A fixture that skipped the shape would leave all three unguarded.
#
# No DocuSign keys: this row declines the integration by supplying no
# DOCUSIGN_BASE_URL, so every DocuSign object is expected to be SKIPPED by the
# projection plan rather than demanded of it.
#
# Runtime KMS without a Notion database: this row seals Brand social account
# tokens and declines the Firm Notion lane. The social secrets are the
# production-only keys of deployments/sops-inventory.yaml.

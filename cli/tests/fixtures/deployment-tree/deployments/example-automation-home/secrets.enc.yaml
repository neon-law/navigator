# Synthetic key material for the automation-home row — see ../../README.md.
# Every value is the literal `ENC[FIXTURE]`, and no test here decrypts.
#
# Three blocks the ordinary row does not carry, and each is here for a reason
# a single-row fixture could not reach:
#
#   * the webhook secret and the Restate ingress pair, scoped by
#     `store::deployment::GITHUB_AUTOMATION_HOME_PROJECT` to this row alone;
#   * the DocuSign keys, demanded because this row's config.toml declares
#     DOCUSIGN_BASE_URL. `example-deployment` declines the integration and so
#     exercises the skip.
#   * OAUTH_MICROSOFT_CLIENT_SECRET, demanded because this row's config.toml
#     declares OAUTH_MICROSOFT_CLIENT_ID. `example-deployment` declines it too.
#   * the three Apple signing values, demanded because this row's config.toml
#     declares its synthetic Services ID. `example-deployment` declines Apple
#     and exercises the trigger-based skip instead.
#   * NAVIGATOR_IDENTITY_PLATFORM_API_KEY, the email/password door's browser
#     key. It is its own declaration; `example-deployment` declines the door.
#   * PLAUSIBLE_STATS_API_KEY, the social dashboard's read-only Stats key.
#     It is its own declaration; `example-deployment` declines it.
#   * NAVIGATOR_FORGEJO_PROVISIONER_TOKEN, the Forgejo provisioning account's
#     token. It is its own declaration; `example-deployment` declines it.
#   * the two Firm integration coordinates. The values here are the fixture
#     ciphertext `ENC[FIXTURE]`, not a key resource name or a database id.
#     `example-deployment` carries neither and skips both.

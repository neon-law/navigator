[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "navigator"
path = "src/main.rs"

[dependencies]
model.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
comfy-table.workspace = true
dotenvy.workspace = true
# `navigator-deploy lsp` unpacks the `.tar.gz` release archives it downloads for
# Linux/macOS, paired with `tar` below.
flate2.workspace = true
futures.workspace = true
image.workspace = true
include_dir.workspace = true
# `project efiling` and `project docket ingest` read saved `.eml` notices.
mail-parser.workspace = true
owo-colors.workspace = true
lopdf.workspace = true
pdf-extract.workspace = true
project-scaffold.workspace = true
rand.workspace = true
reqwest.workspace = true
regex.workspace = true
rules.workspace = true
# `ops release check` and `ops release version` decide what a release version is
# and whether it is newer than the last one, and `devx::registry` picks the
# newest published image tag. All three are semver questions, so all three ask
# the semver crate rather than a grammar written here.
semver.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
views.workspace = true
word.workspace = true
walkdir.workspace = true
# `ops notices` parses `Cargo.lock` to enumerate the third-party crates whose
# licence texts must ship with the downloadable binary. Already a workspace
# dependency and already linked into this crate's tests; this promotes it to a
# runtime dependency of the binary itself.
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
cloud.workspace = true
pdf.workspace = true
assert_cmd.workspace = true
# The gate and docket tests drive a real portal router in-process.
axum.workspace = true
forms.workspace = true
portal.workspace = true
neon.workspace = true
nix = { workspace = true, features = ["term"] }
predicates.workspace = true
# `start_paused` lets a test fire the gate's 30 s request timeouts against a
# slow mock without waiting for them in real time.
tokio = { workspace = true, features = ["test-util"] }
# `tower::ServiceExt::oneshot` drives the preview router in-process, with no
# bind and no port.
tower.workspace = true
regorus.workspace = true
store = { workspace = true, features = ["test-support"] }
telemetry.workspace = true
zip.workspace = true
# The disposable PostgreSQL databases the runtime-letterhead render tests
# seed the canonical schema into.
sqlx.workspace = true
wiremock.workspace = true

[lints]
workspace = true

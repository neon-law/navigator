apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navigator
resources:
  - restore-drill-job.yaml
configMapGenerator:
  - name: navigator-postgres-restore-drill
    files:
      - scripts/fetch-backup.sh
      - scripts/restore.sh
      - verify.sql
      - native-origin-contract.json
    options:
      disableNameSuffixHash: true
images:
  - name: navigator/postgres
    newName: ghcr.io/neon-law/navigator/postgres
    digest: sha256:a64805a84a2a7f77c87b6915c2394ca63860d63915554c9504f4df9ea4e408ef
  - name: google-cloud-cli
    newName: gcr.io/google.com/cloudsdktool/google-cloud-cli
    digest: sha256:3c896827b5c09da0f9e4adfd0211f4493e53c622ac04bdf37fd38fbb583f5fc1

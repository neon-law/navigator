apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navigator
resources:
  - restore-drill-job.yaml
configMapGenerator:
  - name: navigator-postgres-restore-drill
    files:
      - scripts/fetch-backup.sh
      - scripts/restore.sh
      - verify.sql
      - native-origin-contract.json
    options:
      disableNameSuffixHash: true
images:

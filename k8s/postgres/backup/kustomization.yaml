apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navigator
resources:
  - service-account.yaml
  - wal-archive.yaml
  - base-backup.yaml
configMapGenerator:
  - name: navigator-postgres-backup-scripts
    files:
      - scripts/receive-wal.sh
      - scripts/upload-wal.sh
      - scripts/base-backup.sh
      - scripts/upload-base-backup.sh
    options:
      disableNameSuffixHash: true
images:
  - name: navigator/postgres
    newName: ghcr.io/neon-law/navigator/postgres
    digest: sha256:a3f6db0888d3d68c0ccadf936784768ecda4131b58fba30d631d69ff58337a8e
  - name: google-cloud-cli
    newName: gcr.io/google.com/cloudsdktool/google-cloud-cli
    digest: sha256:3c896827b5c09da0f9e4adfd0211f4493e53c622ac04bdf37fd38fbb583f5fc1

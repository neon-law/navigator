apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navigator
resources:
  - ../../postgres
patches:
  - target:
      kind: StatefulSet
      name: navigator-postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi

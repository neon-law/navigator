# Retained suspended billing job; its image exits without submitting work.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-canary-trigger
  namespace: navigator
  labels:
    app: billing-canary-trigger
spec:
  suspend: true
  # Weekly, Sunday 14:00 UTC (06:00 PST / 07:00 PDT). `0` = Sunday.
  schedule: "0 14 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: billing-canary-trigger
        spec:
          restartPolicy: OnFailure
          containers:
            - name: billing-canary-trigger
              image: navigator-billing-canary-trigger:dev
              imagePullPolicy: IfNotPresent
              env:
                # In-cluster Restate ingress (see
                # k8s/staging/restate.yaml).
                - name: RESTATE_INGRESS_URL
                  value: http://restate.restate.svc.cluster.local:8080
                - name: RUST_LOG
                  value: info

# SeaweedFS is the disposable, single-node S3-compatible store for KIND.
# Production deployments provide the same S3 contract through an endpoint,
# buckets, and credentials at their deployment boundary; this StatefulSet is
# intentionally not a production HA topology.
apiVersion: v1
kind: ConfigMap
metadata:
  name: navigator-seaweedfs
  namespace: navigator
data:
  s3_endpoint: http://navigator-seaweedfs.navigator.svc.cluster.local:8333
  documents_bucket: navigator-documents
  exports_bucket: navigator-exports
  surreal_archives_bucket: navigator-exports
  assets_bucket: navigator-assets
  applications_bucket: navigator-applications
  archives_bucket: navigator-archives
  telemetry_bucket: navigator-telemetry
  lfs_bucket: navigator-lfs
  archived_projects_bucket: navigator-archived-projects
---
apiVersion: v1
kind: Service
metadata:
  name: navigator-seaweedfs
  namespace: navigator
spec:
  clusterIP: None
  selector:
    app: navigator-seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: navigator
spec:
  serviceName: navigator-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: navigator-seaweedfs
  template:
    metadata:
      labels:
        app: navigator-seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -s3
            - -s3.ip.bind=0.0.0.0
            - -s3.port=8333
            - -s3.config=/run/secrets/seaweedfs/s3.json
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
            - -master.volumeSizeLimitMB=64
            - -volume.max=64
          ports:
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets/seaweedfs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
      volumes:
        - name: secrets
          secret:
            secretName: navigator-seaweedfs-s3
            items:
              - key: s3.json
                path: s3.json
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

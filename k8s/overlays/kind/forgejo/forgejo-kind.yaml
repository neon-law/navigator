# KIND sizing for the Forgejo server. The base mounts the signing key pair
# that `navigator dev forgejo up` generates once for this tier.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: navigator-forgejo
spec:
  template:
    spec:
      containers:
        - name: forgejo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

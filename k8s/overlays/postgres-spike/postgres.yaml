apiVersion: v1
kind: Service
metadata:
  name: postgres-spike
spec:
  selector:
    app: postgres-spike
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-spike
spec:
  serviceName: postgres-spike
  replicas: 1
  selector:
    matchLabels:
      app: postgres-spike
  template:
    metadata:
      labels:
        app: postgres-spike
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: neon-law-postgres:16.15-age1.6.0-vector0.8.2
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: smoke
            - name: POSTGRES_USER
              value: postgres
            # Disposable local/CI fixture only; this overlay is never a production dependency.
            - name: POSTGRES_PASSWORD
              value: synthetic
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, smoke]
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, smoke]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: socket
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

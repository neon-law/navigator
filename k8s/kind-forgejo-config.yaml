# A task-owned KIND cluster for `hudson dev forgejo up` and `smoke` without
# the rest of the dependency tier (the CI Forgejo job). Rauthy's NodePort is
# mapped so the browser-facing issuer, http://localhost:30080/auth/v1/, is the
# one the Forgejo pod reaches through its loopback bridge. Forgejo itself is
# reached through a port-forward and needs no mapping.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 31532
        hostPort: 15432
        listenAddress: "127.0.0.1"
        protocol: TCP
  # Route PostgreSQL from the published control-plane port to a worker, as in
  # the full worktree tier. The ingress policy admits the control-plane address.
  - role: worker

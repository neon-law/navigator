# Shared billing cores and explicit recovery adapters. Retained trigger names are inert.
[package]
name = "billing-workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "billing_workflows"
path = "src/lib.rs"

[[bin]]
name = "billing-canary-trigger"
path = "src/bin/billing_canary_trigger.rs"

[[bin]]
name = "reconcile-trigger"
path = "src/bin/reconcile_trigger.rs"

[[bin]]
name = "billing-digest-trigger"
path = "src/bin/billing_digest_trigger.rs"

[[bin]]
name = "sandbox-credit-reset-trigger"
path = "src/bin/sandbox_reset_trigger.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
billing.workspace = true
chrono.workspace = true
cloud.workspace = true
serde.workspace = true
serde_json.workspace = true
store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v5", "v7", "serde"] }
workflows = { workspace = true, features = ["dbos"] }

[dev-dependencies]
sqlx.workspace = true
# Only the sandbox reset workflow's tests touch the database directly (open
# purchases, grant/debit a closed month); the worker itself reaches the DB
# through `store`.
store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

nda_administration@1:
  kind: agreement
  body: |-
    This agreement is the entire agreement on its subject. Changes and waivers must be in writing signed by both parties.
    Delay in enforcement is not a waiver. An unenforceable provision is severed only to the extent necessary. Neither party
    may assign without consent, except to a successor in a merger or sale of substantially all relevant assets that assumes
    these obligations. Electronic signatures and counterparts are effective.
advisor_administration@1:
  kind: agreement
  body: |-
    This agreement and signed equity documents state the entire arrangement. Amendments
    must be signed by both parties. Neither party may assign without the other’s consent, except Company to a successor
    assuming its obligations. Invalid provisions are severed to the necessary extent. Counterparts and electronic signatures
    are effective.
msa_administration@1:
  kind: agreement
  body: |-
    Neither party is liable for delay beyond reasonable control, except payment
    obligations, if it promptly notifies and mitigates. Neither may assign without consent, except to a successor assuming
    its obligations in a merger or sale. The signed documents are the entire agreement; amendments and waivers require
    writing. Invalid provisions are severed to the minimum extent. Counterparts and electronic signatures are effective.
baa_administration@1:
  kind: agreement
  body: |-
    The parties will amend this addendum as necessary to comply with applicable HIPAA requirements. No provision creates
    third-party contractual rights. Governing law, notices, and other service terms remain in the underlying agreement,
    subject to this addendum and mandatory law. Liability terms cannot excuse either party’s regulatory duties. Counterparts
    and electronic signatures are effective.
dpa_administration@1:
  kind: agreement
  body: |-
    This addendum controls conflicts about personal data. Mandatory transfer instruments control inconsistent contract
    terms. Service-agreement liability provisions apply only to the extent compatible with mandatory data-protection rights
    and obligations. Changes require writing. Electronic signatures and counterparts are effective.

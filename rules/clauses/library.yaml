engagement_arbitration@1:
  kind: onboarding
  inputs:
    seat:
      types:
      - jurisdiction
      - custom_single_choice
      prompt: Where is the arbitration seated?
    law:
      types:
      - jurisdiction
      - custom_single_choice
      prompt: Which jurisdiction’s law governs this letter?
  body: |-
    The law of {{law}} governs this letter.

    Except for a fee dispute you elect to arbitrate under a statutory fee-arbitration right that cannot be waived, any
    controversy or claim arising out of or relating to this engagement or its breach, including any claim of professional
    negligence, malpractice, or breach of fiduciary duty, shall be settled by final and binding arbitration administered by
    the American Arbitration Association under its Commercial Arbitration Rules, before a single arbitrator, seated in
    {{seat}}, and conducted confidentially. The AAA's rules and fee schedule govern
    administrative fees and arbitrator compensation, and judgment on the award may be entered in any court of competent
    jurisdiction.

    The arbitrator applies the same law and may award the same remedies a court would. This clause picks the forum for a
    dispute; it does not limit, cap, or waive our responsibility for our own work, and it does not override a right the law
    makes non-waivable.

    By signing, you and we each give up the right to a jury trial and to have a covered dispute decided in court, including
    a claim that we did our work negligently. Because this section governs how a future dispute between you and your lawyers
    is handled, you may consult independent counsel before agreeing to it.
nevada_engagement_arbitration@1:
  retired_at: 2026-10-27T00:00:00Z
  kind: letter
  inputs:
    law:
      types:
      - custom_single_choice
      - jurisdiction
      prompt: Which jurisdiction’s law governs this engagement?
  body: |-
    This letter is governed by the law of {{law}}. If a dispute arises out of or relates to
    this engagement or this letter, you and the Firm agree to resolve it by final and binding arbitration before a single
    arbitrator administered by JAMS under its Comprehensive Arbitration Rules and Procedures, conducted confidentially and
    decided under the law of {{law}}. The arbitrator applies the same law and may award the
    same remedies a court could; this paragraph selects the forum for a dispute and does __not__ limit, cap, or waive the
    Firm's responsibility for its own work.

    __Your fee-arbitration rights are preserved.__ Nothing above waives or overrides any non-waivable statutory right you
    have to arbitration of a fee dispute, including the fee-dispute program of the State Bar of Nevada.

    Because this is an agreement about how future disputes are handled, you have the right to consult independent counsel of
    your own choosing before you agree to it.

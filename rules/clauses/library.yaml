dispute_resolution@1:
  kind: agreement
  inputs:
    law:
      types:
      - jurisdiction
      prompt: Which jurisdiction’s law governs this agreement?
    seat:
      types:
      - jurisdiction
      prompt: Where is the arbitration seated?
  body: |-
    The law of {{law}} governs this agreement, without regard to its conflict-of-laws rules.

    Except for a claim within a small-claims court's jurisdiction and a claim that law does not permit to be arbitrated,
    any dispute arising out of or relating to this agreement, including its formation, interpretation, breach, or
    termination, will be resolved by final and binding arbitration administered by the American Arbitration Association
    under its Commercial Arbitration Rules, before a single arbitrator, seated in {{seat}}, and conducted confidentially.
    The arbitrator applies the same law and may award the same remedies a court could. Either party may ask a court of
    competent jurisdiction for temporary or provisional relief in aid of arbitration, and judgment on the award may be
    entered in any court of competent jurisdiction. Nothing in this paragraph waives a right that applicable law makes
    nonwaivable.
employment_arbitration@1:
  kind: letter
  inputs:
    seat:
      types:
      - jurisdiction
      prompt: Where is the arbitration seated?
  body: |-
    ## Resolving disputes

    Except as stated below, any dispute arising out of or relating to your employment or this letter will be resolved by
    final and binding arbitration administered by the American Arbitration Association under its Employment Arbitration
    Rules, before a single arbitrator, seated in {{seat}}. The Company pays the arbitrator's compensation and the
    administrator's fees beyond the amount you would pay to file a court action. The arbitrator applies the same law and
    may award the same remedies a court could.

    This paragraph does not apply to a claim that law prohibits from being subject to predispute arbitration, including a
    sexual harassment or sexual assault dispute you choose to bring in court, a workers' compensation or unemployment
    claim, or a charge before a government agency, and it does not prevent you from filing one. Either side may ask a court
    for provisional relief in aid of arbitration. Judgment on the award may be entered in any court of competent
    jurisdiction. You may consult independent counsel of your choosing before you agree to this paragraph.
privacy_us_states@1:
  kind: agreement
  inputs:
    applies:
      types:
      - custom_yes_no
      prompt: Do U.S. state privacy laws apply to these practices?
    disclosures:
      types:
      - custom_text
      prompt: >-
        Complete applicable state disclosures, including California collection, sale, and sharing information for the
        required period and financial incentives, if any.
  body: |-
    {{#if applies}}
    ## Supplement: U.S. state disclosures

    {{disclosures}}

    The state schedule must describe applicable rights and request methods, the relevant collection and disclosure
    periods, categories sold or shared, sensitive-information uses, financial incentives if any, and the company’s actual
    practices. Mandatory rights apply even where this notice does not enumerate them.
    {{/if}}
privacy_gdpr@1:
  kind: agreement
  inputs:
    applies:
      types:
      - custom_yes_no
      prompt: Does the GDPR, UK GDPR, or Swiss data-protection law apply to these practices?
    bases:
      types:
      - custom_text
      prompt: >-
        Map each processing purpose to its lawful basis, identifying legitimate interests and consent withdrawal
        methods.
    transfers:
      types:
      - custom_text
      prompt: >-
        Identify actual destinations, adequacy decisions or executed safeguards, and how people can obtain a copy.
    representatives:
      types:
      - custom_text
      prompt: >-
        Give applicable DPO, EU/UK representative, and competent supervisory-authority details; explain any role that
        does not apply.
  body: |-
    {{#if applies}}
    ## Supplement: European, UK, and Swiss information

    Our lawful basis for each purpose, including any specific legitimate interest, is {{bases}}. Where we rely on consent,
    you may withdraw it at any time without affecting prior lawful processing. Where applicable, you may object to
    legitimate-interest processing and direct marketing, ask us to restrict processing, and request portability. Any
    solely automated decisions with legal or similarly significant effects, their logic and consequences, and available
    safeguards are described in the purposes schedule; do not infer consent from use of the service.

    International destinations, transfer mechanisms, and how to obtain safeguard information are {{transfers}}. Our
    applicable data-protection officer, EU or UK representative, and relevant supervisory-authority contact details are
    {{representatives}}. You may complain to the competent supervisory authority, including where you live, work, or
    believe an infringement occurred. Our request process does not limit that right.
    {{/if}}
california_employment@1:
  kind: letter
  body: |-
    ## California supplement

    This section applies because California is the work state. It supplements, and does not limit, the rest of this
    letter.

    Your exempt classification is confirmed against the current California and applicable local salary threshold and
    the duties tests, including any occupation-specific rules, as well as your actual duties. A title or this letter
    does not establish exempt status, and this letter does not waive wages, overtime, meal and rest breaks, or other
    protections to which you are entitled.

    Company will follow the California fair-chance requirements for any criminal-history review, including the timing
    and sequence of any inquiry, individualized assessment, and notices. Company will provide each separate notice
    California law requires, including notices about pay and any background screening, as separate documents.

    Any confidentiality and invention-assignment agreement will preserve California employee-invention exclusions,
    protected disclosures, wage discussions, and other nonwaivable rights. No term of this letter limits a right that
    California law does not allow to be waived.

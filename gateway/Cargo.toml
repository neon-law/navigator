# The vendor-neutral model-provider seam for the Legal Sandbox
# (`ModelProvider` trait + `VertexProvider` + `StubModelProvider` + Vertex
# bearer-token minting). The same shape as `billing`: a small lib with no
# axum, no Dioxus, and no Restate, so the sandbox page, the usage meter,
# and the `billing-workflows` credit-reset job can all reach one contract.
# No Vertex SDK — one reqwest call to the `:rawPredict` endpoint.
[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gateway"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# ADC token minting for the Vertex REST API, mirroring `billing`'s
# `gcp_cost` BigQuery client. Isolated to the Vertex module — the stub
# needs neither.
google-cloud-auth.workspace = true
google-cloud-token.workspace = true
reqwest.workspace = true
# The Legal Sandbox session's skill catalog: the gateway renders each
# requested skill's vendored instructions into the system context through
# `sandbox_skills::render_system_context` — one `SkillId` type, one
# renderer (glossary-first: the catalog owns the "Sandbox Skill" term).
sandbox-skills.workspace = true
# The Sandbox Usage ledger the metered session gates completions on:
# `StoreLedger` delegates its reads and conditional debits to
# `store::sandbox_usage`, keeping one money path (integer cents) for the
# whole workspace.
serde.workspace = true
serde_json.workspace = true
store.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The in-memory SurrealDB engine the store's own ledger tests run on —
# the integration tests drive `StoreLedger` against the real
# conditional-debit semantics with it.
store = { workspace = true, features = ["test-support"] }
wiremock.workspace = true

[lints]
workspace = true

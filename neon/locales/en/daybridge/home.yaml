head_title: "{site_name} | A brighter way through divorce"
meta_description: >-
  Daybridge Divorce Law helps couples who agree move forward together.
  Joint representation where permitted, after conflict review and informed
  written consent. A one-time $5,000 fee for a mutual split.
  Attorney advertisement.
heading: A brighter way through divorce.
lead: >-
  You agree it is time for a new chapter. We help you take that step together.
  Daybridge represents the couple in an agreed divorce where joint
  representation is permitted, after conflict review and informed written consent.
contact_label: Book Consultation
practices_heading: ""
practices: []
daybridge:
  eyebrow: Daybridge Divorce Law
  fee_label: Your mutual split
  fee_price: "$5,000"
  fee_unit: one-time fee
  fee_body: >-
    One fee for a mutual split.
  fee_note: >-
    Your written retainer defines the work.
  response_heading: Both of you, moving forward
  response_body: >-
    Bring the decisions you have made together. We help you understand the
    remaining steps, put your agreement into words, and prepare for life ahead.
  motions_heading: An agreement you both understand
  motions_body: >-
    We explain the documents and decisions to both of you. Before work begins,
    we confirm that we can represent you jointly and explain how shared
    information, conflicts, and independent advice will be handled.
  costs_heading: A shared path forward
  costs_body: >-
    If a disagreement prevents joint representation, we stop the joint work
    and explain the need for separate counsel. Contested proceedings are
    outside this joint engagement.
  process_label: The way forward
  process_heading: A shared plan for separate futures.
  steps:
    - - Start with what you agree on
      - >-
        Tell us about your decisions, any remaining questions, and whether a
        case has been filed. We check conflicts and whether joint representation
        is permitted for your situation.
    - - Put the plan in writing
      - >-
        We define the work, fees, and joint-representation terms in writing.
        Each of you gives informed written consent before we begin.
    - - Take the next step together
      - >-
        We prepare the agreed documents, explain them to both of you, and guide
        you through the filing steps in your engagement. The court decides
        whether and when to grant the divorce.
  closing_heading: There is life on the other side.
  closing_body: >-
    You have already found common ground. Tell us where you are, what you have
    agreed on, and what you need help finishing.

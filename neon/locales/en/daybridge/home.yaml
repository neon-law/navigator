head_title: "{site_name} | A brighter way to move on"
meta_description: >-
  Daybridge Divorce Law helps couples who agree move on.
  Joint representation where permitted, after conflict review and informed
  written consent. A one-time $333 fee for a mutual split. The court sets its
  own schedule. Attorney advertisement.
heading: A brighter way to move on.
lead: >-
  You both agree it is time. We keep our part moving, so each of you can move
  on to what comes next.
  Daybridge represents the couple in an agreed divorce where joint
  representation is permitted, after conflict review and informed written consent.
contact_label: Book Consultation
lead_heading: Prefer to write first?
lead_intro: >-
  Leave your email so we can reply about your agreed divorce. A phone number
  is optional. To talk sooner, call us or book a consultation.
practices_heading: ""
practices: []
daybridge:
  eyebrow: Daybridge Divorce Law
  fee_label: Your mutual split
  fee_price: "$333"
  fee_unit: one-time fee
  fee_body: >-
    One fee for a mutual split.
  fee_note: >-
    Your written retainer defines the work.
  response_heading: We keep our part moving
  response_body: >-
    Bring the decisions you have made together. We tell you what is left, put
    your agreement into words, and tell you what comes next at each step.
  motions_heading: Care before speed
  motions_body: >-
    We explain the documents and decisions to both of you. Before work begins,
    we confirm that we can represent you jointly and explain how shared
    information, conflicts, and independent advice will be handled.
  costs_heading: Honest about what we do not control
  costs_body: >-
    The court sets its own schedule. If a disagreement prevents joint
    representation, we stop the joint work and explain the need for separate
    counsel. Contested proceedings are outside this joint engagement.
  process_label: The way across
  process_heading: Three steps, and you know what is next.
  steps:
    - - Tell us what you agree on
      - >-
        Tell us about your decisions, any remaining questions, and whether a
        case has been filed. We check conflicts and whether joint representation
        is permitted for your situation.
    - - Confirm it in writing
      - >-
        We define the work, fees, and joint-representation terms in writing.
        Each of you gives informed written consent before we begin.
    - - File with the court
      - >-
        We prepare the agreed documents, explain them to both of you, and guide
        you through the filing steps in your engagement. The court decides
        whether and when to grant the divorce.
  closing_heading: There is life on the other side.
  closing_body: >-
    You have already found common ground. Call us or book a consultation, tell
    us what you have agreed on, and we will tell you what we need to begin.
  sibling_practices:
    - brand: vesta
      eyebrow: After the divorce is final
      heading: Review your will and beneficiaries.
      body: >-
        A final divorce is a good time to review your estate plan. Vesta Estate
        Planning can help with that under a separate engagement.
      cta_label: Visit Vesta Estate Planning

# The shared public marketing catalog.
#
# Every sentence here is published by more than one page or brand. Page
# catalogs reference a key with `{shared:<key>}` rather than repeating the
# words.
#
# Rules, enforced by `views::locales::shared` through `navigator project gate`
# (`Y002`): the version is explicit, every key in `REQUIRED_KEYS` must be
# present, a value is one line with no double quote, and the only placeholders
# are `{site_name}` and `{firm_email}`.
#
# Copy that differs between the two renderers today is deliberately *not*
# here. This catalog removes duplication; it does not decide wording.
catalog_version: 1


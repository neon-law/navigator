head_title: "{site_name} | Employment visas"
meta_description: >-
  Abhaya Immigration, a Shook Law PC practice, advises on employment-based
  visas and employer sponsorship: the categories, eligibility in plain
  language, the labor certification, the petitions, the documents, and the
  questions clients actually ask. Government filing fees are separate, and
  no approval or timeline is promised.
title: Employment visas
tagline: Employment sponsorship, explained before it is filed.
skin: practice
bands:
  - kind: statement
    heading: Who this is for
    lead: Workers and the employers who sponsor them.
    body:
      - - text: >-
            Employment-based cases run through several different doors. A
            company can sponsor a worker for a green card, usually through
            a test of the labor market and a petition by the employer.
            People with extraordinary ability, outstanding researchers, and
            multinational managers may qualify in categories that do not
            require an employer petition in the same way. Temporary work
            visas are their own family, each with its own rules.
      - - text: >-
            Which door fits depends on the job offer, the person's
            background, and the employer's willingness to sponsor. The
            choice made at the start shapes everything after it, so it is
            worth making carefully. That is what a first conversation with
            Abhaya Immigration is for: placing a case in the right door
            before anything is filed.
  - kind: cards
    anchor: employment-eligibility
    overline: Eligibility
    heading: The doors, and who fits through them.
    description: >-
      General eligibility, stated plainly. A specific case can complicate
      any of these — a narrow job definition, a degree that does not match
      the position, an immigration history that raises questions — and none
      of this is advice about your particular case.
    items:
      - title: Sponsored green cards (EB-1, EB-2, EB-3)
        body:
          - - text: >-
                    The employer sponsors the worker for a permanent job offer.
                    Most professional positions first pass a Department of Labor
                    test that no able and available United States worker applied
                    for the job. Advanced degrees, exceptional records, and
                    skilled-work offers sort cases into the different categories,
                    and the category usually shapes how the case is filed.
      - title: National interest waiver (EB-2 NIW)
        body:
          - - text: >-
                    A worker whose proposed work has substantial merit and
                    national importance can ask the agency to waive the
                    job-offer and labor-certification requirements. The person
                    petitions for themselves, and the showing is demanding: the
                    record has to carry the case without an employer behind it.
      - title: Extraordinary ability (EB-1A)
        body:
          - - text: >-
                    A person at the top of a field — the sciences, arts,
                    education, business, or athletics — can petition for
                    themselves with sustained national or international acclaim,
                    shown through the defined evidence list: awards, published
                    material about the work, judged contributions, and similar.
      - title: Temporary work visas (H-1B, L-1, O-1, TN)
        body:
          - - text: >-
                    These visas let an employer hire a worker for a defined job
                    for a defined period: specialty occupations, intracompany
                    transfers, extraordinary ability, and North American
                    professionals. Some are capped by annual limits and
                    lotteries. None of them is itself a green card, though some
                    can be built into one over time.
  - kind: steps
    anchor: employment-process
    overline: How the process works
    heading: From labor certification to the visa.
    description: >-
      The Department of Labor and USCIS split most of the work. The general
      order for the common sponsored path is below.
    items:
      - title: Labor certification
        body:
          - - text: >-
                    For most professional positions, the employer first seeks a
                    certification from the Department of Labor that no able and
                    available United States worker applied for the job. The
                    recruitment must follow the regulations exactly, and the
                    record of it becomes the foundation of the case.
      - title: The immigrant petition
        body:
          - - text: >-
                    The employer files Form I-140 with United States Citizenship
                    and Immigration Services for the approved category. In the
                    self-petition categories — the national interest waiver and
                    extraordinary ability — the worker files the petition
                    instead.
      - title: The priority date
        body:
          - - text: >-
                    The date the labor certification or petition is filed
                    usually becomes the case's place in line. The State
                    Department's monthly visa bulletin says which categories and
                    countries can move forward that month. We cannot promise how
                    long any case takes; the agencies decide.
      - title: The application
        body:
          - - text: >-
                    When the category is current, the worker applies to adjust
                    status inside the United States or applies at a consulate
                    abroad. The consular path has its own page:
                    /immigration/consular-processing.
  - kind: cards
    anchor: employment-documents
    overline: Documents
    heading: What to gather.
    description: >-
      Every case is different, and the agency can ask for more. These are
      the categories almost every employment case draws on.
    items:
      - title: The job and the employer
        body:
          - - text: >-
                    The offer letter, the job description, and the employer's
                    business records showing it operates and can pay the offered
                    wage. The employer's tax returns and annual reports often
                    belong in the file too.
      - title: The worker's qualifications
        body:
          - - text: >-
                    Degrees and transcripts, license records, and letters from
                    past employers that describe the work in detail — what you
                    did, with what skills, for how long. Titles alone rarely
                    carry the weight; the substance does.
      - title: Immigration history
        body:
          - - text: >-
                    Copies of every prior visa, status document, approval
                    notice, and — yes — every denial or prior petition. The
                    agencies already have these records; a complete file that
                    faces them reads as honest.
      - title: Identity and family
        body:
          - - text: >-
                    Passports, birth and marriage certificates for the worker
                    and any dependents applying along with the case, and
                    certified translations for anything not in English.
  - kind: statement
    heading: What it costs
    lead: Fees, stated plainly and published.
    body:
      - - text: >-
            Government filing fees are separate from any attorney fee, and
            they change. The Department of Labor charges nothing for the
            labor certification; USCIS and the State Department publish
            their current fees on their own sites. The Department of Labor
            also bars passing certain recruitment and legal costs to the
            worker in the sponsored path.
      - - text: >-
            Attorney fees for the filings in this practice are flat fees per
            filing, published in
      - - text: Abhaya Immigration's fee catalog
          href: "https://www.abhayaimmigration.com/services"
      - - text: >-
            , so the cost is known before anything starts. We cannot promise
            approval or a timeline; the relevant agencies decide.
  - kind: cards
    anchor: employment-faq
    overline: Common questions
    heading: Questions people ask before hiring anyone.
    items:
      - title: How long will my case take?
        body:
          - - text: >-
                    It depends on the category, the country of birth, and the
                    agencies' current workload. USCIS publishes its processing
                    times and the State Department publishes the visa bulletin
                    monthly — both are linked from our free-support hub. What we
                    can promise is an honest reading of those numbers for your
                    category at the start; what we cannot promise is a date.
      - title: Can I change employers during the process?
        body:
          - - text: >-
                    Sometimes, and the rules are technical. The law has
                    provisions that let an approved petition be honored for a
                    new job in the same field after defined stages are reached,
                    but the details decide the case. Ask before you sign
                    anything with a new employer.
      - title: Who pays — the employer or the worker?
        body:
          - - text: >-
                    It depends on which fee and which stage. In the sponsored
                    path, the Department of Labor requires the employer to carry
                    the labor-certification costs; other government fees are
                    sometimes negotiated. The rules exist to protect the worker,
                    and the allocation should be settled in writing early.
      - title: I have no employer. Can I still qualify?
        body:
          - - text: >-
                    Possibly. The national interest waiver and the extraordinary
                    ability category let a person petition for themselves,
                    without a sponsoring employer. Both demand a strong record,
                    and both are all-or-nothing in a way an employer-sponsored
                    case is not — the evidence list decides.
      - title: What is the visa bulletin, and why does it matter?
        body:
          - - text: >-
                    The State Department publishes it monthly. It lists which
                    green-card categories and which countries of birth can move
                    forward that month. When your category is listed as current,
                    the application stage can begin; when it is not, the case
                    waits. Our free-support hub links to it with a short guide
                    on how to read it.
      - title: Can a temporary visa become a green card?
        body:
          - - text: >-
                    Often, yes — many employment green cards start while the
                    worker holds a temporary visa, and some temporary categories
                    are designed with that path in mind. But the temporary
                    status carries its own rules about intent and maintenance,
                    and a misstep there can complicate the green-card case. The
                    two stages should be planned together.
  - kind: cta
    heading: Talk through sponsorship with Abhaya Immigration
    body: >-
      A first conversation covers which category fits, who files what, and
      what the employer and the worker each carry. Abhaya Immigration, a
      Shook Law PC practice, advises on employment-based visas and employer
      sponsorship.
    email: "{firm_email}"
    action:
      href: "https://www.abhayaimmigration.com/"
      label: Talk to Abhaya Immigration

head_title: "{site_name} | Navigator for pro bono"
meta_description: >-
  Hosted Navigator for pro bono organizations: $5 a month plus model tokens,
  with your own branding and Forgejo instance included.
title: Navigator for pro bono
tagline: We run Navigator so your organization can run its cases.
bands:
  - kind: cards
    anchor: pricing
    overline: Hosted Navigator
    heading: One price for pro bono organizations.
    description: >-
      Model tokens are billed at the provider's cost, with no markup. Hosted
      Navigator is available only to pro bono organizations.
    pricing_style: true
    items:
      - title: Pro bono organizations
        chips: ["$5"]
        cadence: / month, plus model tokens
        body:
          - - text: Hosted Navigator for your whole organization.
        features:
          - Your organization's name, colors, and websites
          - Your own Forgejo instance for Project repositories
          - Hosting, upgrades, backups, and sign-in
        href: /contact
        href_label: Ask about hosting
  - kind: statement
    heading: What we run for you
    lead: You do the legal work. We keep Navigator running.
    body:
      - - text: >-
            We put your organization's branding on Navigator and stand up a
            Forgejo instance that holds each Project's repository. We run the
            database, the releases, and the sign-in, and we help you write
            token-efficient prompts for your practice.
  - kind: statement
    heading: Learn Navigator
    lead: Two open workshops.
    body:
      - - text: Using Navigator
          href: /workshops/use-the-navigator
        - text: " works one litigation matter end to end, from the retainer Template to its Matter Pages."
      - - text: Operating Navigator
          href: /workshops/deploy-the-navigator
        - text: " stands up and runs your own Navigator instance on Google Cloud."
  - kind: statement
    heading: Self-hosting
    lead: Run Navigator yourself.
    body:
      - - text: >-
            Navigator's first-party software is free to self-host under
            MIT OR Apache-2.0. You manage your deployment and pay your own
            infrastructure and operating costs.
      - - text: >-
            Third-party software and assets retain their own terms. The
            software licenses do not grant use of the Neon Law marks.
      - - text: Read the installation guide
          href: https://github.com/neon-law/navigator/blob/main/docs/oss-install.md
        - text: " for the setup requirements and instructions."
  - kind: cta
    heading: Tell us about your organization
    body: >-
      Tell us which cases you take and how many people will use Navigator.
    email: "{firm_email}"

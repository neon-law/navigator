head_title: "{site_name} | Do I need a lawyer?"
meta_description: >-
  Decide when to start with a legal template and when to ask a lawyer for
  advice, document review, or representation.
title: Do I need a lawyer?
hero_lead: >-
  Start with what you need to do, what's at stake, and any deadline.
  You can prepare some paperwork yourself and ask a lawyer for help with a specific part.
skin: marketing
bands:
  - kind: cards
    overline: ""
    heading: Choose your next step
    items:
      - title: When you can start on your own
        body:
          - - text: >-
                A template can help with routine paperwork when you know which form applies, understand
                the instructions, and can check the filing rules. Gather your facts and review what you sign or file.
        href: /notations
        href_label: Browse templates
      - title: When to talk to a lawyer
        body:
          - - text: >-
                Talk to a lawyer promptly if you've been served with court papers, a deadline is close,
                the facts are disputed, or your housing, custody, or immigration status is at stake.
                A lawyer can explain your options, review a document, or represent you.
        href: https://guiebshook.com/contact
        href_label: Contact Guieb Shook
      - title: Check whether representation is required
        body:
          - - text: >-
                Rules vary by court and case. If you're appearing for a business or another person,
                check the court's rules before you file. If you face criminal charges and can't afford
                a lawyer, ask the court about appointed counsel.
  - kind: statement
    heading: More guidance on representing yourself
    body:
      - - text: California Courts' guide to representing yourself
          href: https://selfhelp.courts.ca.gov/court-basics/representing-yourself
        - text: " explains common reasons to seek legal help."
      - - text: >-
            Navigator provides general information. Guieb Shook gives legal advice under a valid retainer.

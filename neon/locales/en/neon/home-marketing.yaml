head_title: "{site_name} | Legal software"
meta_description: >-
  Navigator is open source legal software for lawyer-led work with AI agents.
  Organize each matter as a Project, prepare reviewable documents, and keep
  decisions with the lawyer.
title: Navigator
hero_mark: helm
tagline: Legal work, with the lawyer in control.
hero_lead: >-
  Neon Law builds Navigator, open source software that gives lawyers and AI
  agents one place to work a matter: its facts, documents, deadlines, and
  review.
hero_cta:
  href: /navigator
  label: Explore Navigator
skin: marketing
bands:
  - kind: steps
    anchor: what-it-does
    overline: What Navigator does
    heading: The agent drafts. The lawyer decides.
    items:
      - title: One Project per matter
        body:
          - - text: "Each matter is a Project with its own Git repository. The agent reads the Project's "
            - text: navigator.yaml
              code: true
            - text: " and its Project Skills before it does any work."
      - title: Documents as Notations
        body:
          - - text: >-
                A Template plus a questionnaire becomes a Notation for one
                Person in one Project, with its answers and history kept
                together.
      - title: A lawyer reviews every step
        body:
          - - text: >-
                Agents prepare drafts. Email stays a draft until a lawyer sends
                it, and nothing reaches a client before Lawyer Review.
      - title: Use the tools you already have
        body:
          - - text: >-
                The CLI and MCP server give Claude Code, Codex, and Cursor the
                same commands a lawyer runs.
  - kind: cards
    anchor: notation
    overline: Notation
    heading: Documents built for agents and lawyers.
    description: >-
      Notation is Markdown with Frontmatter. One file holds the document, the
      questions that fill it, and the review it needs.
    items:
      - title: Plain text
        body:
          - - text: >-
                Drafts live in Git, so each revision is a reviewable change
                instead of a new file.
      - title: Questionnaires
        body:
          - - text: >-
                Typed questions gather the answers a Template needs, from a
                client or from the agent.
      - title: Many outputs
        body:
          - - text: >-
                Render to PDF, return edits to Word with tracked changes, or
                fill a government form.
        href: /notations/about
        href_label: Read about Notation
      - title: A public library
        body:
          - - text: >-
                Browse letters, agreements, and government forms written in
                Notation.
        href: /notations
        href_label: Browse the Notations
  - kind: statement
    heading: Open source software, with a hosted option
    lead: Run Navigator yourself, or use our hosted service for legal aid.
    body:
      - - text: >-
            Navigator is open source under MIT OR Apache-2.0. See releases and
            installation instructions.
      - - text: See setup and downloads
          href: /navigator#download
      - - text: >-
            We also host Navigator for legal aid organizations under their own
            brand name, with a Forgejo instance included.
      - - text: See the Legal Aid offer
          href: /legal-aid
  - kind: cta
    heading: Explore Navigator
    body: >-
      Read how the platform works, or visit the public repository to inspect
      the code and releases.
    email: "{firm_email}"
    action:
      href: /navigator
      label: How Navigator works

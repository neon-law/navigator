head_title: "{site_name} | Agentic Lawyering for Everyone"
meta_description: >-
  Public legal templates and chat-based guidance for individuals and business
  owners, with optional lawyer review when you want it.
og_description: >-
  Start legal paperwork with a public template, then decide whether to ask a
  lawyer for review.
title: Navigator
hero_mark: helm
tagline: Exacting Agentic Lawyering
hero_lead: >-
  Prepare legal paperwork with Navigator. Work through a template, review each
  answer, and choose whether to ask a lawyer for help.
hero_cta:
  label: Find a template
  href: /notations
skin: marketing
bands:
  - kind: cards
    anchor: anyone
    overline: For anyone
    heading: Agentic lawyering is for anyone.
    description: >-
      Prepare papers in chat, fill a public template, or ask a lawyer to review.
      Using the public catalog does not create an attorney-client relationship.
    items:
      - title: Represent yourself
        body:
          - - text: Find a public template and enter your details. You review what you file or send.
        href: /notations
        href_label: Browse templates
      - title: Talk to a lawyer
        body:
          - - text: Ask about representation or a separate document review. A written engagement sets the scope.
        href: /contact
        href_label: Contact the firm
      - title: For lawyers
        body:
          - - text: See how firms connect matter work, documents, and tools around a Project.
        href: /lawyers
        href_label: Navigator for lawyers
  - kind: steps
    anchor: connect-mcp
    overline: Navigator MCP
    heading: Connect Navigator to ChatGPT
    description: >-
      Connect the public catalog once, then ask for a template when a legal question comes up.
    items:
      - title: Add Navigator to ChatGPT
        body:
          - - text: "Sign in to "
            - text: ChatGPT Plugins
              href: https://chatgpt.com/plugins
            - text: >-
                , select +, then Add custom MCP server. Name it Navigator and
                describe it as a public legal template catalog. If the option is
                missing, ask your workspace administrator to enable custom
                plugins.
      - title: Connect to the public catalog
        body:
          - - text: "Enter "
            - text: https://www.neonlaw.com/app/mcp
              code: true
            - text: >-
                . Choose no authentication and, if prompted for a transport, Streamable HTTP.
                Review the connection, select Create as a plugin, then select Connect Navigator and Try in chat.
      - title: Find the Nevada LLC Formation template
        body:
          - - text: "In a new chat, type @, select Navigator, and ask "
            - text: Help me form a Nevada LLC. Which template should I start?
              code: true
          - - text: "Look for "
            - text: Nevada LLC Formation
              href: /notations/nevada-llc-formation
            - text: ". For an operating agreement, ask which template fits your ownership and management structure."
      - title: Start your LLC paperwork
        body:
          - - text: Open the Nevada LLC questionnaire
              href: /notations/nevada-llc-formation/start
            - text: >-
                , sign in, and enter your company name, registered agent, and management details.
                Return to this link to resume a business or start another LLC. You file with Nevada.
          - - text: "To return to an existing matter, open "
            - text: My Projects
              href: /app/projects
            - text: "."
  - kind: downloads
    anchor: download
    overline: Download
    heading: Run Navigator yourself
    description: >-
      Navigator is open source under MIT OR Apache-2.0. It is built for Macs and for
      containers in the cloud: download it for Apple silicon macOS or x86_64 Linux.
      Each release is attached to the public GitHub repository.
    archive_label: every release
    package:
      heading: Install with Homebrew
      body:
        - - text: "The formula lives in our own tap, "
          - text: neon-law/homebrew-navigator
            href: https://github.com/neon-law/homebrew-navigator
          - text: ", which is updated by every release."
        - - text: "Install with the command below, then run "
          - text: navigator quickstart
            code: true
          - text: >-
              . With Docker running, it brings up the full stack in KIND with a
              seeded sample firm and three sample matters.
  - kind: cta
    heading: Considering Legal Aid?
    body: >-
      Check eligibility and see which services the firm offers through its Legal Aid program.
    email: "{firm_email}"
    action:
      href: /legal-aid
      label: Legal Aid

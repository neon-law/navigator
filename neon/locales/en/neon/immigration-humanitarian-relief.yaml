head_title: "{site_name} | Humanitarian relief"
meta_description: >-
  Abhaya Immigration, a Shook Law PC practice, handles asylum, T and U visas,
  and VAWA petitions: who may qualify, the filing rules, the deadlines, and
  the documents a case needs. Government filing fees are separate, and no
  approval or timeline is promised.
title: Humanitarian relief
tagline: Protection exists in the law. The rules are strict, and they matter.
skin: practice
bands:
  - kind: statement
    heading: What the law offers, in plain words
    lead: Four doors, each with its own rules.
    body:
      - - text: >-
            Asylum is for people who cannot return to their home country because
            of persecution, or a well-founded fear of it, on account of race,
            religion, nationality, political opinion, or membership in a
            particular social group. An application made after one year in the
            United States can be barred by the one-year filing deadline, with
            limited exceptions. The date matters, which is why it deserves
            attention before anything else.
      - - text: >-
            T visas exist for victims of trafficking who would face unusual
            hardship if they left the United States, and U visas exist for
            victims of certain crimes who have been, or are likely to be,
            helpful to law enforcement in investigating or prosecuting that
            crime. The Violence Against Women Act (VAWA) lets a spouse, child,
            or parent of a United States citizen or lawful permanent resident
            petition for status without the abuser's knowledge or
            participation.
      - - text: >-
            Each door has its own definition, evidence, and waiting rules. None
            of them requires asking the person who harmed you for anything, and
            none of them is automatic: the government decides every application
            on its own record.
  - kind: statement
    heading: Who each protection is for
    lead: A general map, not a verdict on any case.
    body:
      - - text: >-
            Asylum is for people already in the United States or arriving at its
            border who fear returning home. The fear must connect to one of the
            five protected grounds, and the person must show that the harm is
            serious, that the government of their country cannot or will not
            protect them, and that the fear is honest and supported by
            evidence. Past persecution alone can sometimes carry a claim.
      - - text: >-
            T and U visas serve victims of specific harms: trafficking for a T
            visa, and a list of qualifying crimes, including domestic violence
            and sexual assault, for a U visa. Both ask whether the person
            helped, or is likely to help, law enforcement, with a hardship
            exception for a T visa. Both lead toward potential permanent status
            after several years, under rules the statutes set.
      - - text: >-
            VAWA is for people whose immigration status was tied to a citizen or
            resident relative who abused them. A spouse, child, or parent files
            on their own, in confidence. The abuser is never notified, never
            participates, and cannot report the filing.
  - kind: statement
    heading: Common disqualifiers, stated plainly
    lead: The rules that end cases before they begin.
    body:
      - - text: >-
            The one-year filing deadline is the most common bar in asylum cases.
            Applications filed more than a year after arrival can be rejected,
            unless an exception applies, such as changed conditions in the home
            country or extraordinary circumstances for the delay. A previous
            asylum denial, or an application found frivolous, can also bar a
            new one.
      - - text: >-
            Certain criminal convictions can bar any of these applications, and
            the definitions reach further than most people expect. So can
            persecuting others, or firmly resettling in a third country on the
            way to the United States. None of these bars is a reason to hide a
            fact; every one of them is a reason to hear an honest read of a
            case before filing anything.
      - - text: >-
            These are general rules, not advice about a case. Which bars apply,
            and whether an exception fits, depends on facts only a full
            conversation can surface.
  - kind: steps
    anchor: relief-process
    overline: How an application moves
    heading: Filing rules come before anything else.
    description: >-
      United States Citizenship and Immigration Services (USCIS) decides most
      of these applications; an immigration court decides them when a case is
      already in proceedings. The general order is below.
    items:
      - title: Check the deadline first
        body:
          - - text: >-
                For asylum, the one-year filing deadline and its exceptions are
                checked before anything else. For T and U visas and VAWA, the
                qualifying crime, relationship, or hardship rules define the
                case. Filing the wrong application, or the right one too late,
                closes doors that evidence cannot reopen.
      - title: Build the record
        body:
          - - text: >-
                Applications of this kind rest on your own statement, evidence
                of the harm or the abuse, country-conditions material about
                what returning would mean, and identity and civil records.
                Filing in your own words, in your own language, translated, is
                normal and protected. For VAWA and the U visa, records are
                handled with confidentiality rules that limit who inside the
                government may read them.
      - title: File with the right agency
        body:
          - - text: >-
                Asylum, T, U, and VAWA petitions are filed with USCIS on their
                own forms. If removal proceedings are already pending in
                immigration court, an asylum application is instead made to the
                court, and some other relief changes form too. Filing in the
                wrong place is a common and costly mistake.
      - title: Biometrics, interviews, and the wait
        body:
          - - text: >-
                After filing, the agency takes fingerprints, may schedule an
                interview, and may ask for more evidence. U visas have a yearly
                cap, so a petitioner often waits for a place on the waitlist
                before the application is fully considered. Address changes
                must be reported in writing and on time, or notices, and the
                case with them, can be missed.
      - title: The decision
        body:
          - - text: >-
                The agency or the court decides on the record. We cannot promise
                approval, and we cannot promise a timeline; the government
                decides. What a filing can promise is completeness: every
                requirement met, every fact explained, nothing the agency
                needed left out.
  - kind: statement
    heading: What to gather
    lead: Categories, not a form-specific list.
    body:
      - - text: >-
            Nearly every case needs identity records, such as a passport and
            birth certificate, a full immigration history, including prior
            filings, entries, and any notices from the government, and your own
            written account of what happened, in your own words.
      - - text: >-
            Asylum cases add country-conditions evidence and, where they exist,
            police reports, medical records, or threatening messages. T and U
            cases add the law-enforcement certification or evidence of the
            qualifying crime. VAWA cases add proof of the qualifying
            relationship and of the abuse, which can include a counselor's or
            doctor's records, police reports, or statements from people who
            knew. Originals stay with you; copies are filed.
  - kind: statement
    heading: Common questions
    lead: Asked in almost every first conversation.
    body:
      - - text: >-
            I have been here more than a year. Is asylum still possible? It can
            be, when an exception to the deadline applies or when the claim
            rests on past persecution with changed circumstances. The date of
            arrival and the reasons for the delay are the first facts to lay
            out.
      - - text: >-
            Will my abuser find out I filed? A VAWA petition is filed
            confidentially, and the abuser is not notified. U visa
            certifications also carry confidentiality protections. Nothing in
            the filing requires the abuser's signature, consent, or
            cooperation.
      - - text: >-
            Do I have to have gone to the police? For a U visa, being helpful
            to law enforcement is part of the rule, and a certification from
            the agency that investigated is part of the file. For asylum, VAWA,
            and T visas in hardship cases, reporting to the police is not the
            measure of the case. The facts decide, not a checklist.
      - - text: >-
            Can I work while the application is pending? Many of these
            applications allow a work authorization application after a set
            period of pendency, under rules that change. The honest answer for
            a specific case comes from the current rules, not from a website.
  - kind: statement
    heading: Costs and honesty about outcomes
    lead: Fees and outcomes, stated plainly.
    body:
      - - text: >-
            There is no government filing fee for asylum. The other
            applications may carry fees or qualify for fee waivers. Any
            government fee is separate from any attorney fee; the firm's own
            fees are published in the fee catalog at abhayaimmigration.com.
      - - text: >-
            We cannot promise that relief will be granted, and we cannot
            promise when any decision will come; the agency or the court
            decides. We can promise a careful, honest read of what the rules
            require in your situation, and a record built to withstand the
            strictest reading of them.
  - kind: cta
    heading: Talk with Abhaya Immigration
    body: >-
      A first conversation is private and covers what the law's rules ask for
      in your situation, and nothing about it goes to anyone else without your
      say. Abhaya Immigration, a Shook Law PC practice, handles asylum, T and
      U visas, and VAWA petitions.
    email: "{firm_email}"
    action:
      href: "https://www.abhayaimmigration.com/"
      label: Talk to Abhaya Immigration

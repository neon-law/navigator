  record_label: Request records on Solana
  record_heading: A record you can verify.
  record_body: >-
    Record your removal requests on Solana to help document what you requested.
    If a data leak or misuse has caused harm, Cyber Injury Law can review
    whether a separate legal claim may be appropriate. Data removal does not
    guarantee that a company will comply or prevent a future leak.
  sibling_practices:
    - brand: vesta
      eyebrow: With a Vesta estate plan
      heading: An optional death check.
      body: >-
        When you make your estate plan with Vesta Estate Planning, we set its
        triggers together: who to tell, which claims to file, and which accounts
        to close. While your DeleteYourData.com subscription, also called Neon
        Law Nautilus, is active, a death check sets those triggers in motion on
        your behalf. You choose whether to turn it on.
      note: >-
        Why it matters: a life insurer settles a death claim once it receives
        due proof of death. Nevada requires insurers to check the federal Death
        Master File only twice a year, and a benefit whose beneficiary cannot be
        found is presumed abandoned. A Florida appeals court found that when a
        death goes unidentified, beneficiaries are not notified or paid.
      sources:
        - ["Nev. Rev. Stat. § 688A.140", "https://app.midpage.ai/laws/nv-nrs/t57/ch688A/s688A_140-9e5653?utm_source=mcp"]
        - ["Nev. Rev. Stat. § 688D.090", "https://app.midpage.ai/laws/nv-nrs/t57/ch688D/s688D_090-b48728?utm_source=mcp"]
        - ["Patronis v. United Ins. Co. of Am., No. 1D18-2114 (Fla. 1st DCA June 3, 2020)", "https://app.midpage.ai/document/jimmy-patronis-in-his-official--b7fe6425-201e-44f5-93bb-980abef1299c?utm_source=mcp"]
      cta_label: Visit Vesta Estate Planning

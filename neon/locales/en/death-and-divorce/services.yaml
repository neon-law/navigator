head_title: "{site_name} | Services"
meta_description: >-
  Divorce and probate from Death & Divorce, a practice of
  Guieb & Shook PC. Scope and fees are set out in writing before work begins.
title: Death & Divorce services
hero_mark: scales
tagline: Divorce and probate. Care for what comes next.
hero_lines:
  - text: A steadier way through
    accent_words: 2
  - text: what comes after
    accent_words: 0
hero_lead: >-
  We help with divorce and probate. Guieb & Shook PC is the law firm you would
  retain. For wills, trusts, and planning ahead, visit Vesta Estate Planning.
hero_cta:
  href: https://calendar.notion.so/meet/nick-shook/or15n4yy7
  label: Book Consultation
skin: practice
bands:
  - kind: cards
    anchor: work
    overline: The work
    heading: Divorce and probate
    description: >-
      The written retainer identifies the work we agree to do. Scope and fees
      are explained before work begins.
    items:
      - title: Divorce
        body:
          - - text: >-
                Counsel for the decisions, agreements, and court papers that
                help a family move through a separation.
      - title: Probate
        body:
          - - text: >-
                Guidance through the court and administrative work of settling
                an estate after someone dies.
  - kind: cards
    anchor: planning
    overline: Planning ahead
    heading: Estate planning belongs with Vesta
    description: Wills, trusts, and lifetime plan updates through our fellow Guieb & Shook PC practice.
    items:
      - title: Vesta Estate Planning
        body:
          - - text: Plan for the people, property, and care choices that matter to you.
          - - text: Visit Vesta Estate Planning
              href: https://www.vestaestateplanning.com/
  - kind: cards
    anchor: approach
    overline: Our approach
    heading: Clear about the hard parts
    description: >-
      We make room for the human weight of these moments while keeping the
      next practical step visible.
    items:
      - title: Listen first
        body:
          - - text: We begin with what is happening and what needs attention now.
      - title: Write it down
        body:
          - - text: Scope, timing, and fees are set out in writing before work begins.
      - title: Stay with the work
        body:
          - - text: We keep communication clear as the matter moves toward completion.
  - kind: cards
    anchor: beyond
    overline: What comes after
    heading: A plan for the next chapter
    description: >-
      The work may be about an ending, but the reason to do it is what comes
      next for you and the people you love.
    items:
      - title: Decisions with care
        body:
          - - text: We explain the choices in front of you without pretending they are simple.
      - title: A durable record
        body:
          - - text: We prepare documents that make the agreed decisions easier to carry forward.
  - kind: cta
    heading: Tell us what is happening
    body: >-
      Start with the decision, deadline, or loss that brought you here. We
      will help you find the next step.
    email: "{firm_email}"

death_and_divorce:
  eyebrow: Death & Divorce
  statement_heading: Help with the ending. Care for what comes next.
  statement_body: >-
    A marriage ending. Someone you love dying. Decisions still need to be
    made, even when life feels unsettled. We help with divorce and probate,
    one practical step at a time. Estate planning is offered through Vesta
    Estate Planning, our fellow Shook Law PC practice.
  practices:
    - - Divorce
      - >-
        Clear counsel for the agreements, decisions, and court work that move
        a separation toward its next chapter.
    - - Probate
      - >-
        Steady guidance for the work of settling an estate and carrying out
        what someone left behind.
  video_label: A short introduction
  video_body: >-
    This space is reserved for a quiet introduction to the people and the
    work behind Death & Divorce.
  process_label: What comes next
  process_heading: A steadier way through.
  steps:
    - - Tell us where things stand
      - >-
        Share the decision, deadline, or loss that brought you here. We will
        listen and tell you what information helps us understand the work.
    - - Make the next step clear
      - >-
        We explain the scope, timing, and fees in writing before work begins.
    - - Move forward together
      - >-
        We prepare the agreed work and keep the next decision visible until
        the engagement is complete.
  closing_heading: We will be with you.
  closing_body: >-
    Start with the decision, deadline, or loss in front of you. We will listen,
    explain the work, and help you see the next step.

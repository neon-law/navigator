  faq_heading: Before you get started.
  faqs:
    - - Do I have to attend the hearing?
      - >-
        Counsel appears on your behalf for the accepted hearing. Your testimony or participation may still be needed.
        Your lawyer will confirm that with you before the hearing.
    - - Is this a City service?
      - >-
        No. Summons Defense is a practice of Shook Law PC, a private law firm, not affiliated with the City of
        New York or OATH. You may represent yourself. OATH’s Help Center offers free procedural information,
        and some matters may qualify for free outside legal assistance.
    - - How far ahead should I act?
      - >-
        Act as soon as you receive the summons. OATH says to request a phone hearing at least three business days
        and no more than one month before the hearing date. In-person requests must be made at least five business
        days ahead. Sending this form does not satisfy either deadline.
    - - What if I missed a hearing or want to appeal?
      - >-
        Contact OATH promptly and read its current instructions. Reopening a default is different from appealing a
        hearing decision. Appeals generally must be filed within 30 days of the decision, or 35 days if mailed;
        service and payment or waiver requirements also apply. These are separate from an appearance engagement.
    - - What does the fee cover?
      - >-
        The agreed hearing appearance: $100 per telephone hearing, or a one-time $500 in-person appearance fee.
        City fines and penalties are separate. We confirm any additional preparation, repeat appearance,
        appeal, correction filing, or other work in writing before you agree to it.
    - - Will an AI assistant represent me?
      - >-
        No. An assistant or AI-enabled assistant can help organize intake. Local counsel reviews the matter and
        appears at the hearing. Legal judgment and representation stay with your lawyer.
  footer_note: >-
    Summons Defense is a practice of Shook Law PC. A private law firm, not affiliated with the City of New York or

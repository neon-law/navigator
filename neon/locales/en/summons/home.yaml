    - - We appear. You get an update.
      - Your lawyer presents your defense and explains the decision and next steps. We tell you if your participation is needed.
  guides_heading: Start with the agency on your summons.
  guides_intro: >-
    Different charges need different evidence. Open a guide for a practical preparation checklist and the City’s own
    instructions. Counsel confirms whether your particular summons fits this service.
  guides:
    - - DSNY
      - Sanitation & sidewalks
      - Recycling, set-out rules, and street conditions
      - |-
        Save dated photos showing the condition and the exact location cited.
        Gather collection schedules, cleaning logs, and receipts relevant to the alleged violation.
        Read the charge and penalty notice carefully; fixing a condition does not by itself dismiss a summons.
      - https://www.nyc.gov/site/oath/help-center/frequently-asked-questions.page
    - - DOB
      - Buildings & construction
      - Permits, alterations, and correction orders
      - |-
        Gather permits, approved plans, work records, and photos tied to the date of the charge.
        Check whether your summons offers a cure and identify its specific deadline.
        Paying a penalty does not close the correction process. Check DOB’s certificate-of-correction requirements.
      - https://www.nyc.gov/site/buildings/property-or-business-owner/certificate-of-correction-frequently-asked-questions.page
    - - FDNY
      - Fire safety
      - Inspections, equipment, and fire-code summonses
      - |-
        Identify whether the document is an OATH summons, a violation order, or a criminal court notice.
        Gather inspection reports, maintenance records, and dated proof of correction.
        Use FDNY Business for certificate-of-correction requests and verify whether you still need a hearing.
      - https://www.nyc.gov/site/fdny/business/violations/violations.page
    - - DEP
      - Noise & environmental rules
      - Noise, idling, air, and equipment
      - |-
        Match each charge to its location, date, time, and cited rule.
        Preserve relevant video, equipment records, permits, and service or removal records.
        Organize what the records establish about the condition on the cited date, not just its condition today.
      - https://www.nyc.gov/site/oath/trials/bnotes-1025archive.page
    - - DCWP
      - Shops & businesses
      - Licenses, prices, signs, and consumer rules
      - |-
        Pull the City inspection checklist for your type of business.
        Save the licenses, price displays, receipts, and records relevant to each charge.
        Compare the inspector’s description with your dated records; prepare an answer to each alleged violation.
      - https://www.nyc.gov/site/dca/businesses/inspection-checklists.page
    - - DOHMH
      - Restaurants & food service
      - Inspection findings and health-code charges
      - |-
        Keep the full inspection report and identify each condition you dispute.
        Gather relevant temperature logs, pest-control records, permits, and dated photos.
        Review the Health Department’s inspection guide and keep correcting unsafe conditions while the case proceeds.
      - https://www.nyc.gov/assets/doh/downloads/pdf/rii/blue-book.pdf
  cases_heading: Small details can matter. Here’s the record.
  cases_note: >-
    Examples from OATH’s published summaries, not our client results. These decisions turn on their own facts and
    rules; they do not predict your outcome. Preparation tips are general information, not advice for your case.
  cases:
    - - SANITATION / APPEAL 2100929
      - Read the penalty notice.
      - >-
        In a 2021 recycling appeal, OATH reversed a repeat-offender finding because the summons did not adequately
        explain the maximum penalty. The wording of the notice mattered.
      - https://www.nyc.gov/site/oath/hearings/decisions0222.page
    - - BUILDINGS / APPEAL 2500988
      - Keep the original approvals.
      - >-
        In a September 2025 outdoor-dining appeal, OATH reversed a work-without-a-permit finding because the structure
        was exempt when built. The decision depended on that program and its timing.
      - https://www.nyc.gov/site/oath/trials/bnotes-1025archive.page
    - - BUILDINGS / APPEAL 2101404
      - Explain barriers with evidence.
      - >-
        In a 2021 correction-order appeal, OATH upheld liability: the owner’s evidence did not establish an
        impossibility defense. Difficulty making repairs was not enough on that record.
      - https://www.nyc.gov/site/oath/hearings/decisions0322.page
  intake_heading: One place to start.
  intake_body: >-
    Leave your contact details below to arrange intake. An assistant or AI-enabled assistant will help collect the
    information for your lawyer’s review. We aim to gather it together once; your lawyer may ask for missing details.
  intake_checklist:
    - Have every page of your summons ready.
    - Note the hearing date and any notices changing it.
    - Gather photos, permits, receipts, and your account of what happened.
    - Tell the assistant about language or accessibility needs.
  intake_note: >-
    This form requests contact only. It does not upload evidence, hire a lawyer, or reserve a hearing appearance.
    We will arrange collection of your documents during intake. If your hearing is close, contact OATH directly
    while you wait for our written confirmation.

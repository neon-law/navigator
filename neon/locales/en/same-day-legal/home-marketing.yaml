head_title: "{site_name} | Home"
meta_description: >-
  Use your AI assistant to draft records requests and prepare your own legal paperwork. Choose
  ad hoc attorney review from $50 or ongoing help for $29 per month.
title: ""
tagline: Prepare your own legal paperwork
hero_lead: >-
  Create your free account now. When you’re ready, use Navigator in your AI assistant
  to find a template, draft a records request, or prepare small claims papers. You review and send or file them yourself.
skin: same_day_legal
bands:
  - kind: cards
    anchor: attorney-options
    overline: ""
    heading: Want an attorney’s help?
    description: Legal work begins when you and the firm agree to a written engagement.
    pricing_style: true
    items:
      - title: Ad hoc attorney review
        chips: ["From $50"]
        cadence: one time
        body:
          - - text: Get a lawyer’s review of one filing question or one document. You agree on the fee before you pay.
        href: "mailto:{firm_email}"
        href_label: Contact us for one review
      - title: Ongoing help
        chips: ["$29"]
        cadence: per month
        body:
          - - text: The plan includes attorney review, basic filings such as LLC formation, and privacy services.
        href: /app#pricing
        href_label: See plan details and pricing
  - kind: cards
    anchor: needs
    overline: ""
    heading: Legal services
    items:
      - title: Start an LLC
        body:
          - - text: Prepare the paperwork to form your company.
      - title: Write a will
        body:
          - - text: Put your wishes in writing and decide who will carry them out.
      - title: Change your name
        body:
          - - text: Prepare a petition for a legal name change.
      - title: File in small claims
        body:
          - - text: Prepare the papers to bring a small claims case.
      - title: Review a contract
        body:
          - - text: Understand the terms and discuss changes before you sign.
      - title: Prepare an NDA
        body:
          - - text: Set out what stays confidential before you share information.
      - title: Make a job offer
        body:
          - - text: Put the role, pay, and other employment terms in an offer letter.
      - title: Publish a privacy policy
        body:
          - - text: Explain how your business collects and uses personal information.
      - title: Respond to a dispute
        body:
          - - text: Discuss what happened, any deadlines, and your options.

  - kind: cards
    anchor: school-records
    overline: AI assistant
    heading: Draft a school records request
    items:
      - title: Ask for a letter you can send
        body:
          - - text: >-
                Try asking your AI assistant, “Draft a letter asking my school district to let me review the
                current IEP, evaluations, and progress reports. Leave blanks for names and dates.”
                Fill in the blanks yourself, then send it to the district’s special education office.
        href: /auth/signup
        href_label: Create your free account

head_title: "{site_name} | Home"
meta_description: >-
  Pre-sign up for free tools to prepare your own business filing before the new year. Choose
  ad hoc attorney review from $50 or ongoing help for $29 per month.
title: ""
tagline: Get your business filing started before the new year
hero_lead: >-
  Create your free account now. When you’re ready, use Navigator in your AI assistant
  to find templates and prepare your own paperwork. You file it yourself and pay any government fees.
hero_cta:
  href: /auth/signup
  label: Pre-sign up for free
skin: same_day_legal
bands:
  - kind: steps
    anchor: mcp-setup
    overline: ""
    heading: Find a legal template in your AI assistant
    description: Browse the public template catalog for free. You can use it without a Navigator account.
    items:
      - title: Add Navigator to ChatGPT
        body:
          - - text: "Open "
            - text: ChatGPT Plugins
              href: https://chatgpt.com/plugins
            - text: >-
                , select +, then Add custom MCP server. Name it Navigator and describe it as a public legal template catalog.
          - - text: >-
                If your workspace hides this option, ask your administrator about custom plugins.
                In another assistant that supports MCP, open its settings and add a custom server.
      - title: Enter the connection details
        body:
          - - text: "Paste this server URL: "
            - text: https://www.neonlaw.com/app/mcp
              code: true
          - - text: >-
                Choose no authentication and, if asked, Streamable HTTP. In ChatGPT, review the connection,
                choose Create as a plugin, and install Navigator.
          - - text: "The hosted service limits how often you can call it. Prefer to run it yourself? "
            - text: Get the open-source project
              href: https://github.com/neon-law/navigator
            - text: "."
      - title: Try it in a new chat
        body:
          - - text: "Type @ and select Navigator in ChatGPT. Then ask "
            - text: "Which Nevada LLC templates are in the public catalog?"
              code: true
          - - text: Look for Nevada LLC Formation in the results.
  - kind: cards
    anchor: attorney-options
    overline: ""
    heading: Want an attorney’s help?
    description: Legal work begins when you and the firm agree to a written engagement.
    pricing_style: true
    items:
      - title: Ad hoc attorney review
        chips: ["From $50"]
        cadence: one time
        body:
          - - text: Get a lawyer’s review of one filing question or one document. You agree on the fee before you pay.
        href: "mailto:{firm_email}"
        href_label: Contact us for one review
      - title: Ongoing help
        chips: ["$29"]
        cadence: per month
        body:
          - - text: The plan includes attorney review, basic filings such as LLC formation, and privacy services.
        href: /app#pricing
        href_label: See plan details and pricing
  - kind: cards
    anchor: needs
    overline: ""
    heading: Legal services
    items:
      - title: Start an LLC
        body:
          - - text: Prepare the paperwork to form your company.
      - title: Write a will
        body:
          - - text: Put your wishes in writing and decide who will carry them out.
      - title: Change your name
        body:
          - - text: Prepare a petition for a legal name change.
      - title: File in small claims
        body:
          - - text: Prepare the papers to bring a small claims case.
      - title: Review a contract
        body:
          - - text: Understand the terms and discuss changes before you sign.
      - title: Prepare an NDA
        body:
          - - text: Set out what stays confidential before you share information.
      - title: Make a job offer
        body:
          - - text: Put the role, pay, and other employment terms in an offer letter.
      - title: Publish a privacy policy
        body:
          - - text: Explain how your business collects and uses personal information.
      - title: Respond to a dispute
        body:
          - - text: Discuss what happened, any deadlines, and your options.

website:
  practice:
  - path: /practice/dispute-resolution.html
    title: Dispute Resolution
    description: Resolving conflicts efficiently, in negotiation or in court.
    summary: Resolving conflicts efficiently, in negotiation or in court.
    photo: practice/dispute-resolution.jpg
    alt: ''
    lead: Resolving conflicts efficiently, in negotiation or in court.
    body: |-
      Most disputes are best resolved early and on clear terms. We start by understanding what you need from the outcome, then choose the path most likely to get you there: a demand letter, a negotiated settlement, mediation or arbitration, or litigation in state or federal court.

      When a case goes to court, we handle it from the first pleading through discovery, motions and trial preparation. You will know where the matter stands, what comes next and what it is likely to cost.

      ## What we handle

      - Breach of contract and other commercial disputes
      - Disputes among business owners, partners and shareholders
      - Fraud and misrepresentation claims
      - Pre-suit demands and settlement negotiations
      - Mediation and arbitration
      - Enforcing and collecting judgments

      ## Who we represent

      Individuals, founders and businesses, as plaintiffs or defendants.
  - path: /practice/business-litigation.html
    title: Business Litigation
    description: Litigating complex commercial and securities disputes for companies, shareholders and investors
      in state and federal court.
    summary: Litigating complex commercial and securities disputes for companies, shareholders and investors in
      state and federal court.
    photo: practice/securities-litigation.jpg
    alt: ''
    lead: Litigating complex commercial and securities disputes for companies, shareholders and investors in state
      and federal court.
    body: |-
      When a business dispute has to be litigated, we represent companies, their owners and their investors in state and federal court, including in complex cases with multiple parties, related proceedings in other courts and expert valuation of securities. We handle each case from the first pleading through discovery, motions and settlement or trial.

      Our work spans commercial disputes over contracts, partnerships and business torts, and securities disputes between companies and the people who invest in them: fraud or misrepresentation in the sale of securities, financing disputes, and shareholder claims.

      Many securities disputes turn on information: what a company disclosed, what an investor was told, or what others publish about a company and its leadership. When false statements about a company’s stock are spread to move the price, the matter can involve defamation and market manipulation as well as securities claims.

      ## What we handle

      - Commercial disputes, including breach of contract and business torts
      - Shareholder and partnership disputes, including claims by and against shareholders
      - Securities fraud and misrepresentation in the sale of securities
      - Financing disputes with investment funds and institutional lenders
      - False statements about a company’s stock, including defamation by online publishers
      - Market manipulation, including short-and-distort schemes
      - Injunctions and other emergency relief

      ## Who we represent

      Public and private companies and their boards and officers, business owners, shareholders and investors.
  - path: /practice/corporate-governance.html
    title: Corporate & Governance
    description: Formation, governance, shareholder agreements and ongoing general counsel.
    summary: Formation, governance, shareholder agreements and ongoing general counsel.
    photo: practice/business-corporate.jpg
    alt: ''
    lead: Formation, governance, shareholder agreements and ongoing general counsel.
    body: |-
      A business runs best on clear foundations: the right entity, agreements that say what the owners actually intend, and records that stay in order as the company grows.

      We set those foundations, then stay on as outside general counsel, so there is one firm that already knows the company when a question, a deal or a dispute comes up.

      ## What we handle

      - Entity formation and choice of entity
      - Operating, partnership and shareholder agreements
      - Board and shareholder governance
      - Ongoing outside general counsel
      - Buying, selling or restructuring a business
      - Corporate records and compliance

      ## Who we represent

      Owner-led businesses, closely held companies and their owners.
  - path: /practice/startups-venture.html
    title: Startups & Venture
    description: Entity structuring, equity, fundraising and investor documents.
    summary: Entity structuring, equity, fundraising and investor documents.
    photo: practice/startups-venture.jpg
    alt: ''
    lead: Entity structuring, equity, fundraising and investor documents.
    body: |-
      Early decisions about structure and equity are hard to undo later. We help founders get them right from the start, in plain terms and at a pace that fits a company that is still finding its footing.

      When it is time to raise money, we prepare and negotiate the documents, keep the capitalization table accurate and explain what each term means for control and ownership.

      ## What we handle

      - Formation and founder agreements
      - Equity, vesting and option plans
      - SAFEs, convertible notes and priced rounds
      - Investor documents and capitalization tables
      - Intellectual property assignment and contractor agreements
      - Advisor agreements

      ## Who we represent

      Founders and early-stage companies.
  - path: /practice/contracts-commercial.html
    title: Contracts & Commercial
    description: Drafting and negotiating the agreements your business runs on.
    summary: Drafting and negotiating the agreements your business runs on.
    photo: practice/contracts-commercial.jpg
    alt: ''
    lead: Drafting and negotiating the agreements your business runs on.
    body: |-
      Contracts are where a business sets its risks and its promises. We draft agreements that are clear enough to follow and specific enough to rely on if something goes wrong.

      We also review and negotiate the other side’s paper, flagging the terms that matter and proposing practical changes rather than a wall of edits.

      ## What we handle

      - Customer, vendor and services agreements
      - Software, SaaS and technology agreements
      - Licensing agreements
      - Nondisclosure agreements
      - Contract review and negotiation
      - Disputes over contract terms

      ## Who we represent

      Businesses of every size, and the individuals who sign on their behalf.
  - path: /practice/estate-planning-trusts.html
    title: Estate Planning & Trusts
    description: Wills, trusts and succession planning for families and business owners.
    summary: Wills, trusts and succession planning for families and business owners.
    photo: practice/estate-planning-trusts.jpg
    alt: ''
    lead: Wills, trusts and succession planning for families and business owners.
    body: |-
      A good plan protects the people you care about and spares them uncertainty later. We listen first, then put in place the documents that carry out your wishes.

      For business owners, we coordinate the estate plan with the company’s own agreements, so ownership passes the way you intend.

      ## What we handle

      - Wills
      - Revocable and irrevocable trusts
      - Powers of attorney and health care directives
      - Guardian nominations for children
      - Business succession planning
      - Reviewing and updating existing plans

      ## Who we represent

      Individuals, families and business owners.
  - path: /practice/real-estate.html
    title: Real Estate
    description: Residential and commercial transactions, leasing and title matters.
    summary: Residential and commercial transactions, leasing and title matters.
    photo: practice/real-estate.jpg
    alt: ''
    lead: Residential and commercial transactions, leasing and title matters.
    body: |-
      Whether you are buying a home or leasing space for a business, we review the documents, explain the obligations and see the transaction through to closing.

      We work with brokers, lenders and title companies so the deal stays on schedule and nothing is left unexamined.

      ## What we handle

      - Residential purchases and sales
      - Commercial purchases and sales
      - Commercial and residential leases
      - Title review
      - Holding real estate through an entity

      ## Who we represent

      Buyers, sellers, landlords and tenants, individual and commercial.
  - path: /practice/privacy-data-protection.html
    title: Privacy & Data Protection
    description: Privacy policies, data compliance and guidance when personal information is at risk.
    summary: Privacy policies, data compliance and guidance when personal information is at risk.
    photo: practice/privacy-data-protection.jpg
    alt: ''
    lead: Privacy policies, data compliance and guidance when personal information is at risk.
    body: |-
      Privacy laws now reach most businesses that collect personal information. We help you understand which rules apply, then put policies and practices in place that match what the business actually does.

      When personal information is exposed, we help you work out your obligations and respond in an orderly way.

      ## What we handle

      - Privacy policies and terms of service
      - Compliance with state privacy laws
      - Data processing and vendor agreements
      - Data breach response
      - Privacy review of new products and features

      ## Who we represent

      Businesses that collect or handle personal information.
  attorneys:
  - path: /attorneys/waleed-amer.html
    title: Waleed Amer
    description: Waleed Amer, Founding Partner, Guieb & Shook P.C. Business and securities litigator representing
      companies and shareholders in commercial disputes.
    role: Founding Partner
    portrait: portraits/waleed-amer.jpg
    body: |-
      ## Overview

      Waleed Amer is a business and securities litigator. He represents companies and shareholders in commercial and securities disputes in federal and state court, and advises businesses on contracts, business practices and avoiding disputes before they start. He also holds a Legal Engineer Certificate from Harvey Academy.

      Before founding Guieb & Shook, Waleed was a senior associate at a New York litigation firm, where he was the lead attorney for Nasdaq- and NYSE-listed companies in complex, multimillion-dollar commercial and securities litigation, including disputes with institutional funds over the terms of their financing. His cases involved claims under the Securities Act of 1933 and the Securities Exchange Act of 1934, securities fraud, RICO and business torts.

      He has led hearings and argued motions to dismiss, for summary judgment and for injunctions in the Southern District of New York, the District of Delaware, the District of Colorado and New York State Supreme Court. He has also taken and defended depositions, worked with valuation experts and negotiated settlements, and he works alongside in-house counsel and executives to keep each case aligned with the client’s business goals.

      Earlier, as an associate at an insurance defense firm, he defended tort cases for insurance carriers from the start of a case through discovery. As a law graduate, he did pro bono work with Brooklyn Legal Services, for tenants displaced by a building fire, and with the Courtroom Advocates Project of Sanctuary for Families, helping survivors of domestic violence obtain orders of protection. He was a fellow at the Center for Business and Financial Law at New York Law School.

      Outside the office, Waleed is an avid runner and a member of the Staten Island Athletic Club.

      ## Representative experience

      Before founding Guieb & Shook, Waleed:

      - Obtained a ruling in the Southern District of New York permitting service of process on foreign defendants through a Form 8-K filed on EDGAR, social media posts and notices in U.S. and international newspapers, followed by a default judgment requiring the defendants to retract defamatory articles about a publicly traded client and permanently enjoining further publication.
      - Obtained partial dismissal of a securities fraud action against a public company and its executives in the District of Colorado, including dismissal of civil conspiracy and Colorado Consumer Protection Act claims.
      - Obtained a stay of New York Supreme Court proceedings pending a related action in the District of Delaware, for a publicly traded holding company in litigation with an investment fund.
      - Drafted the opening motion in a tort action that ended in summary judgment dismissing all claims against a religious institution and a high school, on the ground that they owed the plaintiff no duty.

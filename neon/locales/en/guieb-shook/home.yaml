  legal:
  - path: /legal/attorney-advertising.html
    title: Attorney Advertising
    description: Attorney advertising notice for the Guieb & Shook P.C. website.
    lead: This website is attorney advertising. It is labeled “Attorney Advertising” under the New York Rules of
      Professional Conduct, and it may be considered advertising under the rules of the other states where the firm’s
      attorneys are admitted.
    body: |-
      ## Responsible attorneys

      Guieb & Shook P.C. is responsible for the content of this website. Attorneys responsible for this website: Waleed Amer and Nicholas Shook, Guieb & Shook P.C., 5150 Mae Anne Ave, Ste 405-9002, Reno, NV 89523.

      ## Prior results

      Prior results do not guarantee a similar outcome. Every matter turns on its own facts and the law that applies to it.

      ## Admissions

      Waleed Amer is admitted to practice law in New York. Nicholas Shook is admitted to practice law in New York, California, Nevada and Washington. No attorney at the firm practices in a jurisdiction where that attorney is not admitted, except as the rules of that jurisdiction allow.
  - path: /legal/disclaimer.html
    title: Disclaimer
    description: Disclaimer for the Guieb & Shook P.C. website.
    lead: Please read this notice before using this website.
    body: |-
      ## Not legal advice

      The information on this website is for general informational purposes only. It is not legal advice, and it may not reflect the most current legal developments. Do not act or refrain from acting on anything on this site without advice from a lawyer about your own situation.

      ## No attorney–client relationship

      Viewing this website, or contacting the firm by email, phone or otherwise, does not create an attorney–client relationship. The firm represents a client only after it has checked for conflicts of interest and the client has signed an engagement letter.

      ## Confidential information

      Please do not send confidential or time-sensitive information until the firm has confirmed in writing that it will represent you. Information you send before then may not be treated as confidential or privileged, and it may not reach the right attorney in time.

      ## Jurisdictions

      The firm’s attorneys are admitted to practice only in the jurisdictions listed on the [Attorney Advertising](/legal/attorney-advertising.html) page. The firm does not seek to represent anyone in a jurisdiction where this website does not comply with local rules.
  - path: /legal/privacy-policy.html
    title: Privacy Policy
    description: How Guieb & Shook P.C. handles information from visitors to its website.
    lead: This policy explains what information the firm collects through this website and with whom it may be shared.
      It covers this website only; information about clients and their matters is governed by the firm’s professional
      obligations of confidentiality.
    body: |-
      ## Information you send us

      The firm receives the name, contact details, and message you submit through this website. If you sign in, Navigator processes the information needed to authenticate and provide access to your account. The [Navigator privacy policy](/privacy) describes how the platform handles this information, including texting terms.
  - path: /legal/accessibility.html
    title: Accessibility
    description: Accessibility statement for the Guieb & Shook P.C. website.
    lead: Guieb & Shook P.C. wants everyone to be able to use this website, including people who use assistive technology.
    body: |-
      ## Our approach

      The firm aims to meet the Web Content Accessibility Guidelines (WCAG) 2.2 at Level AA.

      ## Help and feedback

      If any part of this website is hard to use, or you need information in another format, please contact the firm at [info@guiebshook.com](mailto:info@guiebshook.com) or [(510) 800-2090](tel:+15108002090). The firm will work with you to provide the information you need.
  story:
    description: How Guieb & Shook P.C. took shape across three New York boroughs, and the family names it carries.
    intro: The firm took shape over a season of conversations that moved across New York City, from Manhattan to
      Brooklyn and Staten Island.
    boroughs:
    - id: manhattan
      name: Manhattan
      photo: manhattan-1.jpg
      alt: Red-brick loft buildings and water towers in Tribeca
      caption: Tribeca
      copy: Where a legal engineers meetup sparked the first conversations about the firm, and where we kept building
        the systems behind it.
    - id: brooklyn
      name: Brooklyn
      photo: brooklyn-bridge-autumn-street.jpg
      alt: The stone tower of the Brooklyn Bridge seen from a street in DUMBO, red autumn leaves in front
      caption: DUMBO
      copy: 'Where the practice found its rhythm: long working sessions, conversations with fellow practitioners,
        live matters on the table, and the systems to support them taking shape alongside.'
    - id: staten-island
      name: Staten Island
      photo: staten-island-richmondtown.jpg
      alt: A leaf-covered lane past a red maple and historic buildings at Historic Richmond Town, Staten Island
      caption: Historic Richmond Town
      copy: Where hikes on La Tourette Trail and working sessions over coffee in Historic Richmond Town shaped the
        firm’s direction.
    names:
    - name: Guieb
      paragraphs:
      - Guieb is the family name of Waleed Amer’s mother. Her father practiced law in Manila, Philippines.
      - The firm carries his name to honor him and her, and the tradition of counsel they passed down.
    - name: Shook
      paragraphs:
      - Nicholas Shook’s parents grew up half a world apart and met by chance.
      - 'The firm carries the Shook name in that same spirit: bridging the distance between people, places and ideas.'
  home:
    description: Guieb & Shook P.C. — a New York firm with West Coast roots, serving individuals, families, founders
      and businesses.
    slides:
    - video: hero-1-williamsburg
      eyebrow: Attorneys at law
      heading:
      - Modern tools.
      - Timeless counsel.
    - video: hero-2-golden-gate
      eyebrow: New York · California · Nevada · Washington
      heading:
      - Two coasts.
      - One practice.
    - video: hero-3-brooklyn
      eyebrow: New York business litigation
      heading:
      - Advocacy that
      - carries weight.
    - video: hero-4-bay-bridge
      eyebrow: West Coast engineering
      heading:
      - Bridging law
      - and technology.
    about: |-
      Guieb & Shook brings innovation to advocacy. We combine the rigor of New York litigation with the systems thinking of West Coast engineering in every matter.

      Waleed Amer brings a background in complex business and securities litigation, representing public companies and shareholders in multimillion-dollar disputes.

      Nicholas Shook brings a practice in business litigation, privacy and estate planning, and five years as a software engineer at Apple that gave him a builder’s discipline for clear systems.

      That discipline runs through [Navigator](https://www.neonlaw.com/lawyers), the practice-management system we built in-house. It takes on the routine work behind every matter, so clients get quicker turnaround and clearer updates, and our attorneys give their time to the judgment and strategy that clients hire us for.
    practice_intro: Handled personally by the firm’s attorneys, for individuals, families, founders and businesses.

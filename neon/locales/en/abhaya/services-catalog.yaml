# Abhaya Immigration's directory of common filings, as structured records.
#
# The same typed catalog Neon publishes (`views::locales::services`), so the
# `/services` page renders these through the shared services band: one search,
# one card per filing, and one "government fees cost extra" badge. Abhaya
# publishes no prices (`priced: false`): every matter is quoted after a
# consultation, and the catalog gate (Y002) refuses any fee on a row. Item
# codes, service names, and `includes` scope lines are attorney-set.
catalog_version: 2
priced: false
categories:
  - value: work_visas
    label: Work visas
  - value: green_cards
    label: Green cards
  - value: permits_and_travel
    label: Work permits and travel

services:
  - id: o1-new
    item: "2101"
    name: O-1 extraordinary ability petition
    blurb: >-
      A new O-1 petition for a person with extraordinary ability or achievement
      in science, business, education, arts, or athletics.
    category: work_visas
    state_fee: true
    includes:
      - Review your achievements against the O-1 criteria
      - Prepare the petition, evidence index, and support letters
      - A licensed attorney reviews before filing
    related:
      - o1-extension
    keywords:
      - O-1A
      - O-1B
      - I-129
      - extraordinary ability


  discovery_body: >-
    We take on vehicle collisions, negligence, medical malpractice, data theft,
    cybercrime, and digital stalking — and we move before evidence disappears.
    Each situation depends on its facts and the applicable law.
  discovery_cards:
    - - VEHICLE COLLISIONS
      - >-
        Car, truck, motorcycle, and pedestrian claims. Insurers secure their
        advantage in the first days — we secure yours: we obtain the crash
        report, scene photos, and witness accounts, and we go after the
        insurer that lowballs you.
      - CAR AND OTHER COLLISIONS
      - /car-accidents
    - - NEGLIGENCE AND LIABILITY
      - >-
        Injuries from someone else's carelessness, such as unsafe products,
        dog bites, or workplace conditions. We prove who was careless and
        hold them to it.
      - CARELESSNESS
      - ""
    - - MEDICAL NEGLIGENCE
      - >-
        Injuries involving medical care. We demand the records others will
        not hand over and read them line by line.
      - MEDICAL CARE
      - ""
    - - DATA THEFT
      - >-
        Stolen personal information or compromised accounts. Companies blame
        users. We demand the breach records, find out what was taken, and
        put the blame where it belongs.
      - STOLEN DATA OR ACCOUNTS
      - /data-theft
    - - CYBERCRIME
      - >-
        Online fraud, account takeovers, and impersonation scams. Platforms
        close tickets. We preserve the evidence and move against the person
        behind it.
      - ONLINE FRAUD AND SCAMS
      - /cybercrime
    - - THEFT
      - >-
        Someone took your money or your property. We preserve the proof,
        follow the records, and pursue the person who took it.
      - STOLEN MONEY OR PROPERTY
      - /theft
    - - DIGITAL STALKING AND ONLINE ABUSE
      - >-
        Repeated unwanted contact, monitoring, or harassment using digital
        tools. We take it seriously: we preserve the evidence and move
        against the person behind it.
      - DIGITAL CONDUCT
      - ""
    - - SLIP AND FALL INJURIES
      - >-
        Falls on wet floors, icy walkways, or poorly kept property. Owners
        blame the victim. We prove who was responsible for the space.
      - UNSAFE PROPERTY
      - ""
  discovery_note: >-
    Descriptions are general. A lawyer must review the facts and applicable
    law to determine whether the firm can help.
  assessment_heading: ["HURT?", "TELL US.", "WE'LL LOOK."]
  assessment_body: >-
    Answer a few questions and get the steps that protect your claim. Evidence
    disappears — we tell you what to save before it is gone.
  assessment_note: >-
    This browser-based checklist gives general information, not legal advice
    or an assessment of a claim. It does not accept your case or create an
    attorney-client relationship. Deadlines may apply. Your answers stay in
    this browser tab.
  recent_result: >-
    We are ready to hear what happened and tell you how we would fight it.
    This checklist cannot determine whether you have a claim.
  deadline_result: >-
    Deadlines can end a claim before it starts. Contact us and we check which
    notice or filing deadlines may apply. This checklist cannot determine
    which deadlines apply or whether time remains.
  evidence_tips:
    - Keep the crash report, scene photos, and medical records from the collision.
    - Keep medical records, bills, and a dated timeline of the care.
    - Keep account notices, messages, and records that show what data was affected.
    - Keep dated messages and a timeline of unwanted digital contact.
  record_tips:
    - Keep copies of relevant records and messages with their dates.
    - Save relevant records and messages now, before they are lost. Evidence
      disappears; we move first.
  deadline_tip: >-
    Notice and filing deadlines move fast. We check which ones may apply to
    your situation.
  result_note: >-
    Only a lawyer who reviews the facts can assess legal options or deadlines.
  closing_lines: [WE USE AI TO PUT, MORE MONEY IN YOUR POCKET.]

# A synthetic AUTOMATION-HOME deployment. See ../../README.md; nothing here
# names a resource that exists.
#
# `NAVIGATOR_GCP_PROJECT_ID` is the one value that must be real: the webhook
# five-tuple in `store::deployment::WEB_REQUIREMENTS` is scoped by
# `project_id: Some(GITHUB_AUTOMATION_HOME_PROJECT)`, matched against this
# exact string, so any other value leaves that requirement — and the
# `SecretProviderClass` block gated on it — unexercised by the whole suite.
#
# The directory is deliberately NOT named for that project. A synthetic staging
# directory sitting in a fixture tree reads as the real tree never having
# moved, and the code follows the explicit capability flag rather than its name.

kms_key = "projects/example-project/locations/example-region/keyRings/navigator-secrets/cryptoKeys/deployment-config"

provisioned = true

[env]
NAVIGATOR_ENVIRONMENT = "production"
NAVIGATOR_CREDENTIAL_ENVIRONMENT = "production"

# --- Google Cloud ----------------------------------------------------------
NAVIGATOR_GCP_PROJECT_ID = "example-project"
NAVIGATOR_GCP_LOCATION = "example-region"
NAVIGATOR_GKE_CLUSTER_NAME = "example-cluster"
NAVIGATOR_GKE_CONTEXT = "gke_example-project_example-region_example-cluster"
NAVIGATOR_K8S_NAMESPACE = "example-automation-home"
NAVIGATOR_VPC_NAME = "example-vpc"
NAVIGATOR_SUBNETWORK_NAME = "example-subnet"
NAVIGATOR_GATEWAY_IP_NAME = "example-gateway"
NAVIGATOR_GATEWAY_IP = "192.0.2.1"
NAVIGATOR_GCP_SERVICE_ACCOUNT_ID = "example-navigator"
NAVIGATOR_DRIVE_GCP_SERVICE_ACCOUNT_ID = "example-navigator-drive"
NAVIGATOR_WEB_SECRET_NAME = "example-automation-home-web-secrets"

# --- Sign-in client --------------------------------------------------------
NAVIGATOR_OAUTH_CLIENT_ID_BROWSER = "000000000001-examplehome.apps.googleusercontent.com"
NAVIGATOR_BOOTSTRAP_OWNER_EMAIL = "owner@example.invalid"
NAVIGATOR_FORGEJO_ROOT_URL = "https://forgejo.example.invalid/"
NAVIGATOR_FORGEJO_OIDC_CLIENT_ID = "synthetic-forgejo-home-client"
NAVIGATOR_FORGEJO_OIDC_NAME = "synthetic-oidc"
NAVIGATOR_FORGEJO_OIDC_DISCOVERY_URL = "https://forgejo.example.invalid/.well-known/openid-configuration"
NAVIGATOR_FORGEJO_ADMISSION_DOMAINS = "example.invalid"

# --- Storage ---------------------------------------------------------------
NAVIGATOR_ASSETS_BUCKET = "example-assets"
NAVIGATOR_DOCUMENTS_BUCKET = "example-documents"
NAVIGATOR_EXPORTS_BUCKET = "example-exports"
NAVIGATOR_SURREAL_ARCHIVES_BUCKET = "example-surreal-archives"
NAVIGATOR_LOGS_BUCKET = "example-automation-home-logs"
NAVIGATOR_APPLICATIONS_BUCKET = "example-applications"
NAVIGATOR_ARCHIVES_BUCKET = "example-archives"
NAVIGATOR_TELEMETRY_BUCKET = "example-automation-home-telemetry"

# --- Images ----------------------------------------------------------------
NAVIGATOR_IMAGE_REGISTRY = "ghcr.io/example/navigator"
NAVIGATOR_WEB_IMAGE = "neon-server"

# --- Public surface --------------------------------------------------------
NAVIGATOR_PUBLIC_HOST = "navigator.example.invalid"
NAVIGATOR_PRIMARY_DOMAIN = "example.invalid"
CANONICAL_HOST = "navigator.example.invalid"
NAV_BASE_URL = "https://navigator.example.invalid/"
NAVIGATOR_ASSET_BASE_URL = "https://navigator.example.invalid/assets"
NAVIGATOR_WORKFLOWS_HOST = "workflows.example.invalid"
NAVIGATOR_WORKFLOWS_URL = "https://workflows.example.invalid/"
# Public Restate Cloud request-signing key; synthetic fixture value.
RESTATE_IDENTITY_KEY = "publickeyv1_test-identity-key"
SLACK_GENERAL_CHANNEL_ID = "C0000000002"
SLACK_FINANCE_CHANNEL_ID = "C0000000001"
SLACK_MESSAGES_CHANNEL_ID = "C0000000003"
SLACK_STAGING_MESSAGES_CHANNEL_ID = "C0000000004"

# Declaring Dash0 is optional. When the endpoint is present, the dataset and
# encrypted token are required together by store::deployment.
DASH0_ENDPOINT = "https://ingest.dash0.example"
DASH0_DATASET = "example-dataset"

# --- Sign-in ---------------------------------------------------------------
GOOGLE_OAUTH_REQUIRED_HD = "example.com"

# Declaring Microsoft OAuth is what makes OAUTH_MICROSOFT_CLIENT_SECRET
# required, the same trigger shape as DocuSign below. This is the only row
# that declares it; `example-deployment` supplies no OAUTH_MICROSOFT_CLIENT_ID
# and so must have the object skipped instead.
OAUTH_MICROSOFT_CLIENT_ID = "00000000-0000-0000-0000-000000000001"
OAUTH_MICROSOFT_ALLOWED_TENANTS = "00000000-0000-0000-0000-000000000002"
OAUTH_APPLE_CLIENT_ID = "com.example.navigator"
# hCaptcha on the lead forms: naming a sitekey makes HCAPTCHA_SECRET required.
HCAPTCHA_SITEKEY = "10000000-ffff-ffff-ffff-000000000001"
# Twilio SMS intake: naming a number makes TWILIO_AUTH_TOKEN and TWILIO_ACCOUNT_SID required.
NAVIGATOR_SMS_NUMBER = "+15550100000"

# --- Forge -----------------------------------------------------------------
# The automation home runs the engineering webhook receiver, so the five-tuple
# applies to this row and to no other. Two members are coordinates; the HMAC
# secret, the Restate ingress URL, and the bearer are key material.
NAVIGATOR_FORGE_BACKEND = "github"
NAVIGATOR_GITHUB_ORG = "neon-law-source-code"
NAVIGATOR_GIT_HOST = "git.example.invalid"
NAVIGATOR_GITHUB_CANONICAL_REPOSITORY = "neon-law-source-code/navigator"
NAVIGATOR_GITHUB_APP_ID = "100001"

# --- Signatures ------------------------------------------------------------
# Declaring DocuSign is what makes every DocuSign requirement apply, and this
# is the only row that declares it. `example-deployment` supplies no
# DOCUSIGN_BASE_URL and so must have every DocuSign object skipped instead —
# the two rows are the two sides of that trigger.
DOCUSIGN_BASE_URL = "https://demo.docusign.example/restapi"
DOCUSIGN_OAUTH_BASE = "account-d.docusign.example"
DOCUSIGN_SIGNER_EMAIL = "signer@example.com"

# --- SurrealDB -------------------------------------------------------------
NAVIGATOR_SURREAL_ENDPOINT = "wss://example-automation-home.surreal.example/rpc"
NAVIGATOR_SURREAL_NAMESPACE = "navigator"
NAVIGATOR_SURREAL_DATABASE = "navigator"
NAVIGATOR_GITHUB_AUTOMATION_HOME = "true"
NAVIGATOR_SMS_TEST_RECIPIENTS_DEPLOYMENT = "false"

prompts:
  person__minor: The child whose name (or sex designation) this petition would change.
  person__petitioner: The parent or legal guardian bringing this petition for the child.
  person__minor_new_name: The child's complete requested new name, exactly as it should read on the order. Leave blank if you are not asking for a name change.
  custom_single_choice__filing_court: Which court will this be filed in? If the child lives in New York City, any NYC Civil Court accepts this petition and costs less ($65.00 instead of $210.00).
  custom_text__place_of_birth: The full address of the place where the child was born — street, city or town, state, ZIP, country.
  custom_single_choice__filing_county: The county where that court sits.
  custom_single_choice__relationship: What is your relationship to the child?
  custom_text__other_relation: If you chose Other, what is your relationship to the child?
  custom_single_choice__name_change: Are you asking the court to change the child's name?
  custom_single_choice__sex_designation_change: Are you asking the court to change the child's sex designation?
  custom_text__reason_for_change: Why are you asking to change the child's name? Tell the story plainly; the judge reads this.
  custom_single_choice__prior_name_change: Has a name change petition ever been filed for the child in any court?
  custom_text__prior_name_change_details: If yes, give the court, the date filed, the case number if known, and the result.
  custom_single_choice__minor_convicted: Has the child ever been convicted of a crime?
  custom_text__minor_felony_details: If yes, the court and the crime. The attorney confirms the exact wording at review.
  custom_single_choice__minor_bankruptcy: Has the child ever filed for bankruptcy?
  custom_single_choice__minor_judgments_liens: Are there any judgments or liens of record against the child?
  custom_single_choice__minor_party_to_action: Is the child a party to any lawsuit or proceeding?
  custom_text__minor_financial_details: If yes to any of the three, give the court where it was filed, the date, and the case number if known.
  custom_single_choice__minor_currently_married: Is the child currently married?
  custom_single_choice__minor_previously_married: Has the child been previously married?
  custom_single_choice__minor_children_under_21: Does the child have any children under 21?
  custom_single_choice__minor_child_support: Does the child have to pay child support?
  custom_single_choice__minor_child_support_current: If yes, are the payments satisfied and up to date?
  custom_usd__minor_child_support_arrears: If not, how much is owed?
  custom_text__minor_child_support_court: The court that issued the child support order, including the county.
  custom_text__minor_support_collections_unit: The Child Support Collections Unit handling the payments, if any.
  custom_single_choice__minor_spousal_support: Is the child responsible for spousal support?
  custom_single_choice__minor_spousal_support_current: If yes, are the payments satisfied and up to date?
  custom_usd__minor_spousal_support_arrears: If not, how much is owed?
  custom_text__minor_spousal_support_court: The court that issued the spousal support order, including the county.
  custom_text__petitioner_address: Your full address — street, city or town, state, ZIP, country.
  custom_single_choice__petitioner_convicted: Have you ever been convicted of a crime?
  custom_text__petitioner_felony_details: If yes, the court and the crime. The attorney confirms the exact wording at review.
  custom_single_choice__petitioner_bankruptcy: Have you ever filed for bankruptcy?
  custom_single_choice__petitioner_judgments_liens: Are there any judgments or liens of record against you?
  custom_single_choice__petitioner_party_to_action: Are you a party to any lawsuit or proceeding?
  custom_text__petitioner_financial_details: If yes to any of the three, give the court where it was filed, the date, and the case number if known.
  custom_single_choice__petitioner_currently_married: Are you currently married?
  custom_single_choice__petitioner_previously_married: Have you been previously married?
  custom_single_choice__petitioner_children_under_21: Do you have any children under 21?
  custom_single_choice__petitioner_child_support: Do you have to pay any child support?
  custom_single_choice__petitioner_child_support_current: If yes, are the payments satisfied and up to date?
  custom_usd__petitioner_child_support_arrears: If not, how much is owed?
  custom_text__petitioner_child_support_court: The court that issued your child support order, including the county.
  custom_text__petitioner_support_collections_unit: The Child Support Collections Unit handling your payments, if any.
  custom_single_choice__petitioner_spousal_support: Are you responsible for spousal support?
  custom_single_choice__petitioner_spousal_support_current: If yes, are the payments satisfied and up to date?
  custom_usd__petitioner_spousal_support_arrears: If not, how much is owed?
  custom_text__petitioner_spousal_support_court: The court that issued your spousal support order, including the county.
  custom_single_choice__minor_new_sex_designation: The child's requested new sex designation. Leave blank if you are not asking for a sex designation change.
  custom_single_choice__minor_prior_sex_designation: Has a sex designation change petition ever been filed for the child in any court?
  custom_text__minor_prior_sex_designation_details: If yes, give the court, the date filed, the case number if known, and the result.
  custom_single_choice__minor_sex_designation_reasons_given: Do you want to give the court your reasons for changing the child's sex designation? This is optional and not required for the order.
  custom_text__minor_sex_designation_reasons: If yes, the reasons.
  custom_datetime__date_of_birth: The child's date of birth.
  custom_text__minor_current_address: The child's full current address — street, city or town, state, ZIP, country. The court may ask for proof of this address when you file.
  custom_single_choice__sealing_requested: Should this court record be sealed for the child's personal safety? While the case is pending, the clerk temporarily seals it anyway.
  custom_text__sealing_details: If yes, explain why you believe sealing is needed.
  custom_single_choice__documents_attached: Are you attaching any supporting documents or additional pages?
  custom_text__supporting_documents_list: If yes, list the name or a description of each document.
  people__consenting_parents: Each parent or legal guardian who is NOT signing this petition must consent. Add each one whose consent is required. If every parent or guardian is signing as a petitioner, skip this. (A child aged 14 or older signs their own consent section in person before a notary.)

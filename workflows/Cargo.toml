[package]
name = "workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
billing.workspace = true
chrono.workspace = true
chrono-tz = { workspace = true, optional = true }
cloud.workspace = true
dotenvy.workspace = true
# DBOS durable execution (`dbos_engine`), behind the `dbos` feature so only the
# processes that host an executor — `portal` (the web process) and
# `workflows-service` — compile the SDK.
dbos = { workspace = true, optional = true }
mail-parser.workspace = true
pdf.workspace = true
# `create_notation_from_repo` reads a Project repo's template through the
# shared engine (`store::template_source`), which takes a `RepoStore`.
repos.workspace = true
reqwest.workspace = true
# The retainer-first gate classifies a template by its declared `kind`
# through the one classifier (`rules::kind::Kind::opens_a_matter`), the same
# one the lawyer matter list reads.
rules.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
store.workspace = true
telemetry.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
views.workspace = true

[features]
dbos = ["cloud/forge-sync", "dep:chrono-tz", "dep:dbos", "dep:tokio", "dep:url"]

[dev-dependencies]
sqlx.workspace = true
store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock.workspace = true
# Trace-propagation test: a real tracer + the W3C propagator so the trigger's
# injected span context produces a well-formed `traceparent` on the wire.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

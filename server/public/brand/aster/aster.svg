    <circle cx="229" cy="259" r="3" fill="#FFF8E6"/><circle cx="284" cy="256" r="3" fill="#FFF8E6"/>
    <ellipse cx="203" cy="284" rx="16" ry="8" fill="#D9826B" opacity=".52"/><ellipse cx="304" cy="280" rx="15" ry="8" fill="#D9826B" opacity=".52"/>

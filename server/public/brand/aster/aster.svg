    <path d="M283 368 Q309 393 338 368" fill="#A57542" stroke="#503B2C" stroke-width="3"/>
    <rect x="306" y="372" width="10" height="18" rx="2" fill="url(#brass)"/>
    <circle cx="333" cy="416" r="10" fill="none" stroke="#C69747" stroke-width="2"/><path d="M333 406 V426 M323 416 H343" stroke="#C69747" stroke-width="2"/>
  </g><g id="scarf">

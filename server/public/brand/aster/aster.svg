    <path d="M221 190 L247 139 M130 237 L189 230" fill="none" stroke="#FFF0BE" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  </g><g id="left-arm" fill="url(#gold)" stroke="#B8792A" stroke-width="3">

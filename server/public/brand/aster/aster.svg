<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <title>Aster the Astrocartographer</title>
  <desc>A golden star with distinct arms, hands, legs and bare feet, wearing a teal scarf and a satchel, with a paintbrush as tall as a walking cane.</desc>
  <defs>

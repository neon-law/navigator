    <linearGradient id="wood" x2="1"><stop stop-color="#734731"/><stop offset=".45" stop-color="#BF8D53"/><stop offset="1" stop-color="#583A2C"/></linearGradient>
    <linearGradient id="brass" x2="1"><stop stop-color="#9C672D"/><stop offset=".45" stop-color="#F2D78C"/><stop offset="1" stop-color="#B98637"/></linearGradient>

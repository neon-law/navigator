[package]
name = "features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Pulls in fantoccini + url so feature suites (and the legacy
# `web/tests/browser_e2e.rs`) can share a single set of WebDriver
# helpers. Off by default because the BDD scenarios that ship today
# all drive `axum::Router` directly via `tower::ServiceExt::oneshot`.
webdriver = ["dep:fantoccini", "dep:url"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["form", "multipart"] }
base64.workspace = true
chrono.workspace = true
cloud.workspace = true
cucumber.workspace = true
pdf.workspace = true
fantoccini = { workspace = true, optional = true }
forms.workspace = true
futures.workspace = true
http-body-util.workspace = true
import.workspace = true
portal.workspace = true
repos.workspace = true
rules.workspace = true
serde_json.workspace = true
sha2.workspace = true
store = { workspace = true, features = ["test-support"] }
tokio.workspace = true
tower.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
server.workspace = true
neon.workspace = true
wiremock.workspace = true
workflows.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[[test]]
name = "acroform_fill"
harness = false

[[test]]
name = "template_validate"
harness = false
[[test]]
name = "legal_workflow_shapes"
harness = false

[[test]]
name = "compliance_filings_workflow_shapes"
harness = false

[[test]]
name = "nonprofit_workflow_shapes"
harness = false

[lints]
workspace = true

# Dioxus CLI configuration for the Nautilus mobile app. `dx` reads this from
# the crate directory — run dx commands from nautilus-mobile/.
[application]
name = "nautilus"
default_platform = "ios"

[bundle]
identifier = "com.neonlaw.nautilus"
icon = [
    "icons/nautilus-32.png",
    "icons/nautilus-64.png",
    "icons/nautilus-256.png",
]

apiVersion: batch/v1
kind: CronJob
metadata:
  name: social-publish-reconciler-trigger
  namespace: navigator
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: social-publish-reconciler-trigger
              image: YOUR_IMAGE_REGISTRY/navigator-social-publish-reconciler-trigger:YY.M.D
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTATE_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_INGRESS_URL
                      optional: true
                - name: RESTATE_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_AUTH_TOKEN
                      optional: true

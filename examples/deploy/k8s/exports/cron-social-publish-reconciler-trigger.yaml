apiVersion: batch/v1
kind: CronJob
metadata:
  name: social-publish-reconciler-trigger
  namespace: navigator
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: social-publish-reconciler-trigger
              image: YOUR_IMAGE_REGISTRY/navigator-social-publish-reconciler-trigger:YY.M.D
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTATE_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_INGRESS_URL
                      optional: true
                - name: RESTATE_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_AUTH_TOKEN
                      optional: true
                # Flip the switch to submit through the worker's DBOS
                # ingress instead of Restate; the submit joins the slot run
                # the worker's internal reconciler schedule already owns.
                # Default off: Restate stays the active engine until the
                # cutover. The ingress URL and bearer come from the same
                # secret the worker reads.
                - name: NAVIGATOR_DBOS_SOCIAL_PUBLISH_RECONCILER_ENABLED
                  value: "false"
                - name: NAVIGATOR_DBOS_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: NAVIGATOR_DBOS_INGRESS_URL
                      optional: true
                - name: NAVIGATOR_DBOS_INGRESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: NAVIGATOR_DBOS_INGRESS_TOKEN
                      optional: true

apiVersion: batch/v1
kind: CronJob
metadata:
  name: youtube-comments-poll-trigger
  namespace: navigator
spec:
  suspend: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: youtube-comments-poll-trigger
              image: YOUR_IMAGE_REGISTRY/navigator-youtube-comments-poll-trigger:YY.M.D
              imagePullPolicy: IfNotPresent
              env:
                - name: NAVIGATOR_DBOS_INGRESS_URL
                  value: http://navigator-web-dbos:9083
                - name: NAVIGATOR_DBOS_INGRESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: NAVIGATOR_DBOS_INGRESS_TOKEN

# Daily trigger for NightlyProjectUpdate. DBOS reconciles open Project calendars, guests, channels, and repositories.
# Each open Project receives its daily notice in its internal Slack channel.
# Schedule is 03:33 UTC daily; the UTC date is the idempotency key.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-project-update-trigger
  namespace: navigator
  labels:
    app: nightly-project-update-trigger
spec:
  suspend: true
  schedule: "33 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: nightly-project-update-trigger
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly-project-update-trigger
              image: YOUR_IMAGE_REGISTRY/navigator-nightly-project-update-trigger:YY.M.D
              imagePullPolicy: Always
              env:
                - name: RESTATE_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_INGRESS_URL
                      optional: true
                - name: RESTATE_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: RESTATE_AUTH_TOKEN
                      optional: true
                # Flip the switch to submit through the worker's DBOS
                # ingress instead of Restate. Default off: Restate stays
                # the active engine until the cutover. The ingress URL and
                # bearer come from the same secret the worker reads.
                - name: NAVIGATOR_DBOS_NIGHTLY_PROJECT_UPDATE_ENABLED
                  value: "false"
                - name: NAVIGATOR_DBOS_INGRESS_URL
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: NAVIGATOR_DBOS_INGRESS_URL
                      optional: true
                - name: NAVIGATOR_DBOS_INGRESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: navigator-web-secrets
                      key: NAVIGATOR_DBOS_INGRESS_TOKEN
                      optional: true
                - name: RUST_LOG
                  value: info
              envFrom:
                - configMapRef:
                    name: navigator-otel-env
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi

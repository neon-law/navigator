# Brand Google-managed TLS certificates. `navigator-firm` lists every
# brand host of this environment, since the Firm wears every brand and a
# target HTTPS proxy accepts at most 15 certificates:
# https://docs.cloud.google.com/load-balancing/docs/ssl-certificates
# Brands not yet moved onto it keep one `ManagedCertificate` each, listing
# exactly that family's environment host. They are removed once the Firm
# certificate is Active, because GKE recreates a certificate whose domains
# change and the safe order is add first, remove after:
# https://docs.cloud.google.com/kubernetes-engine/docs/how-to/managed-certs
#
# `ops ship` replaces the token below with the rendered documents,
# derived from `views::brand::BrandKey::ALL`.
#
# See `ingress/managed-certificate.yaml` for ManagedCertificate vs
# Certificate Manager and the HTTP-01 challenge ordering.
# NAVIGATOR_BRAND_MANAGED_CERTIFICATES

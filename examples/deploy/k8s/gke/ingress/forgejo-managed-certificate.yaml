# Google-managed TLS certificate for `NAVIGATOR_FORGEJO_HOST` — the host
# of the deployment's `NAVIGATOR_FORGEJO_ROOT_URL`, which `ops ship`
# derives rather than reading a second coordinate.
#
# Attached to the shared `navigator-web-gke` Ingress alongside the web and
# workflows certificates via the `networking.gke.io/managed-certificates`
# annotation. One hostname per certificate, so a DNS miss on the Forgejo
# host reissues only this one.
#
# See `ingress/managed-certificate.yaml` for ManagedCertificate vs
# Certificate Manager and the HTTP-01 challenge ordering.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: navigator-forgejo
  namespace: navigator
spec:
  domains:
    - NAVIGATOR_FORGEJO_HOST

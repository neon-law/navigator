# Immutable GCS generations and DBOS receipts need no persistent filesystem.
# GKE metadata authenticates a separate, source-bucket-bound client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: NAVIGATOR_ARCHIVE_WRITE_ONLY_CONFIG
              value: /var/lib/navigator/iceberg/config/archive-config.json
          volumeMounts:
            - name: archive-write-only-config
              mountPath: /var/lib/navigator/iceberg/config
              readOnly: true
      volumes:
        - name: archive-write-only-config
          configMap:
            name: navigator-archive-write-only
            items:
              - key: archive-config.json
                path: archive-config.json

# Immutable GCS generations and DBOS receipts need no persistent filesystem.
# The source reader identity is distinct from offsite writer ADC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          env:
            - name: NAVIGATOR_ARCHIVE_WRITE_ONLY_CONFIG
              value: /var/lib/navigator/iceberg/config/archive-config.json
          volumeMounts:
            - name: archive-write-only-config
              mountPath: /var/lib/navigator/iceberg/config
              readOnly: true
            - name: archive-source-credentials
              mountPath: /var/run/navigator-archive-source
              readOnly: true
      volumes:
        - name: archive-write-only-config
          configMap:
            name: navigator-archive-write-only
            items:
              - key: archive-config.json
                path: archive-config.json
        - name: archive-source-credentials
          secret:
            secretName: navigator-archive-source-credentials
            defaultMode: 0440
            items:
              - key: credentials.json
                path: credentials.json

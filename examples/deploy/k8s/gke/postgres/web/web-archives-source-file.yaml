# Explicit-file source identity; GKE metadata mode does not include this patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          volumeMounts:
            - name: archive-source-credentials
              mountPath: /var/run/navigator-archive-source
              readOnly: true
      volumes:
        - name: archive-source-credentials
          secret:
            secretName: navigator-archive-source-credentials
            defaultMode: 0440
            items:
              - key: credentials.json
                path: credentials.json

# Standalone workers use the same runtime PostgreSQL role and TLS trust as web.
# The pod label admits this client through the PostgreSQL NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflows-service
  namespace: navigator
spec:
  template:
    metadata:
      labels:
        navigator.neonlaw.org/postgres-client: "true"
    spec:
      containers:
        - name: worker
          env:
            - name: NAVIGATOR_POSTGRES_HOST
              value: navigator-postgres.navigator.svc.cluster.local
            - name: NAVIGATOR_POSTGRES_PORT
              value: "5432"
            - name: NAVIGATOR_POSTGRES_DATABASE
              value: navigator
            - name: NAVIGATOR_POSTGRES_SSLMODE
              value: verify-full
            - name: NAVIGATOR_POSTGRES_ROOT_CERT
              value: /etc/navigator/postgres/ca.crt
            - name: NAVIGATOR_POSTGRES_USER
              value: navigator_app
            - name: NAVIGATOR_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: navigator-postgres-app
                  key: password
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/navigator/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: navigator-postgres-app
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444

# Dioxus CLI configuration for the Nautilus web preview. `dx` reads this from
# the crate directory — run dx commands from nautilus-preview/.
[application]
name = "nautilus-preview"
default_platform = "web"

[bundle]
identifier = "com.neonlaw.nautilus.preview"
icon = [
    "icons/nautilus-32.png",
    "icons/nautilus-64.png",
    "icons/nautilus-256.png",
]

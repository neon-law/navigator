form_code = "washoe__fee_waiver_application"

# Second Judicial District Court (Washoe) local form — Application and
# Declaration to Waive Fees and Costs (F-6, revised 03/19/2026 SB, 5 pages,
# 99 fields; the Family and General Jurisdiction folders ship the same PDF,
# registry pins F6FAM/F6GJ share one hash).
#
# The F-6 is a full financial disclosure: benefits received, monthly income,
# monthly expenses, assets, and the household the applicant supports. The
# questionnaire documents in-template that it exceeds the 5-8 question
# target (same treatment as the DV application's 234 fields).
#
# Mapped: the caption's applicant and opposing-party lines, the section 1
# declaration name, the benefits checkboxes as adjacent yes/no toggles (the
# checkbox-group fill shape is ENG-454, so each benefit is its own toggle —
# same pattern as the small-claims notice's claim types), each income
# checkbox paired with its amount, the monthly expenses, the asset rows,
# the cash amount, the household table as flat row states
# (custom_*_household_<part>_<n>, skip-when-empty past the first row; the
# people-list row shape carries only contact parts, so age, relationship,
# and contribution cannot ride a people__ aggregate), the not-employed
# explanation, the additional-information narrative, and the printed name
# beside the signature.
#
# Deliberately left unmapped (decision recorded, lawyer or clerk completes):
# - `Your first and last name` / `Your street address` /
#   `Your city, state, zip code` / `Your telephone` / `Your email` — the
#   attorney/self-represented-litigant header block; the firm confirms the
#   mailing address with the applicant at review.
# - `Case number` / `Department number` — the clerk's caption boxes.
# - `Check Box11` — the section 2 lead-in affirmation ("I receive benefits
#   from one or more of the following programs"), derived: the lawyer
#   checks it at review whenever a benefit box below is checked (verified
#   by fill-test renders: Box11 sits beside the lead-in line at the section
#   indent, Box12 beside "Supplemental Security Income (SSI);" at the
#   benefit-item indent shared with the page-2 boxes).
# - `Date of your signature` — the signature date, set when the applicant
#   signs at the review appointment (a literal would freeze the date at
#   vendor time).
# - `Your signature or type /s/ then you name` — the wet signature (the
#   official blank's own typo, recorded verbatim).


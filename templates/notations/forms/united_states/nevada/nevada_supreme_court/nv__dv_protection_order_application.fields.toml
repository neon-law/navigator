form_code = "nv__dv_protection_order_application"

# Nevada Supreme Court self-help form — Application for Protection Order
# Against Domestic Violence (statewide PDF-fillable edition, ~234 fields).
#
# The application's detailed relief selections become binding order terms,
# so intake carries the parties, relationship, incident facts, and the
# core emergency requests; the consequential specifics are completed by the
# firm with the applicant at the review appointment.
#
# Mapped: the applicant's name (full plus First/Middle/Last parts), the
# adverse party's name (full plus parts), the relationship checkboxes
# (Married/Dating/Coparents/Other, export "On"), the living-together pair
# (export "Yes"), the victim checkbox, the incident date and description
# (the header fields and the first row of the incident table), the weapon
# and police-report pairs (export "On"), the residence stay-away pair
# (export "Yes"), and the venue county.
#
# Deliberately left unmapped (firm or clerk completes at review):
# - `Relationship.OtherType` — the describe box for the "other" path.
# - `Incident.Weapon.Describe`, `Guns.No/Yes/Unknown` — weapon identity and
#   the adverse party's firearms access; gathered at review (the
#   firearms-surrender terms are consequential).
# - `Incident Date 2`/`What Happened 2` and `PriorIncident.*` — earlier
#   incidents; collected at review.
# - `Arrest.Party`, `DVPrior.*`, `AdverseParty.Jail.*` — arrest, prior
#   case, and custody status details gathered at review.
# - `Child1..ChildN.*` and `Emergency.ChildCustody*` — the children's
#   block and custody-relief terms; collected at review.
# - `Emergency.*` remaining relief fields, `Residence.*`,
#   `SameComplex.*`, `Accompany*`, `ExtendedOrder.*`, `Contact.*`,
#   `Exhibits` — detailed relief and contact preferences, confirmed at
#   review because they become order terms.
# - `ApplicantVictim.Yes` — no discoverable on-state export; the lawyer
#   checks the victim box at review.
# - `ApplicantNonConfidential.*` and `Address Alert` — the confidential-
#   address determination is a lawyer decision at review.
# - `NeedInterpreter.*` — intake language handled by the firm.
# - `CASE NO`, `DEPT`, `Date`, `Year`, `/s/`, `Township` — clerk,
#   signature-date, and township entries.

[[field]]
name = "Applicant.Name.Full"
question = "person__client.name"

[[field]]
name = "Applicant.Name.First"
question = "person__client.given"

[[field]]
name = "Applicant.Name.Middle"
question = "person__client.middle"

[[field]]
name = "Applicant.Name.Last"
question = "person__client.family"

[[field]]
name = "AdverseParty.Name.Full"

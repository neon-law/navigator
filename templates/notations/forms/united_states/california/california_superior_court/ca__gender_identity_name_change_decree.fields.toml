form_code = "ca__gender_identity_name_change_decree"

# NC-230 (Rev. 7/1/2026) — Decree Changing Name to Conform to Gender
# Identity (the 200-series decree).
#
# Mapped: the petitioner's caption name, the filing county, and the item-3
# slot (legal name when the petition was filed, and the new legal name).
#
# Deliberately left unmapped (court completes at or after the hearing):
# - `sec1[0].LI1[0].li1a[0].DateField1[0]`, `HearingCrtroom[0]`, and the
#   `li1b[0].hearing[0]` without-hearing checkbox — hearing specifics.
# - `List2[0].LI1[0].li2b[0].SexOffender[0]/[1]` and
#   `DeterminationClerk[0]/[1]` — the CLETS/CJIS determination under Penal
#   Code section 290.
# - `List2[0].LI1[0].li2c[0]/li2d[0].Objections[0]`, `FillText52[0]`,
#   `li2f[0].OtherFindings_cb[0]`/`OtherFindings[0]` — objection and other
#   findings.
# - `Date_dt[0]`/`T242[0]` — the judge's signature block.
# - `Caption[0].AttyPartyInfo[0].*`, `CourtInfo[0].*` beyond the county,
#   `CaseNumber[0]` — firm identity, court branch, and case number.

[[field]]
name = "NC-230[0].Page1[0].Caption[0].TitlePartyName[0].Petitioner[0]"
question = "person__client.name"

[[field]]
name = "NC-230[0].Page1[0].List3[0].PresentName1[0]"
question = "person__client.name"

[[field]]
name = "NC-230[0].Page1[0].List3[0].NewName1[0]"
question = "person__new_name.name"

[[field]]
name = "NC-230[0].Page1[0].Caption[0].CourtInfo[0].CrtCounty[0]"
question = "custom_text__county_of_residence"

form_code = "wa__small_claims_notice"

# King County District Court local form — Notice of Small Claim (KCDC
# September 2025, 3 pages).
#
# Mapped: the four caption name rows (two plaintiffs, two defendants),
# both plaintiff contact rows and both defendant contact rows (name,
# street, city, state, zip), the client's own phone and email, both
# claim-amount boxes (the notification paragraph and the statement of
# claim), the due-date box, all nine claim-type checkboxes plus the
# Other explanation and the auto-accident date, and the page-3
# claim-facts narrative box.
#
# The survey counted 73 AcroForm tree nodes; the parser sees 62 terminal
# fields — the difference is the eleven non-terminal parents in the
# form's nested "Faulty Workmanship" chain, whose nonsense parent name
# the parser qualifies its children through. The parser's qualified
# names are the ground truth here.
#
# Deliberately left unmapped (decision recorded, firm or clerk completes):
# - `cmbdivision` — the clerk's division dropdown (ships with the form's
#   own placeholder value; left as the form ships it).
# - `No` — the clerk's case-number box.
# - `o` / `Email or Alt Phone_2` — plaintiff (2)'s phone and email; a
#   people-list row carries name and address parts only, so a
#   co-plaintiff's phone/email is confirmed at review.
# - `Phone No_2` / `Email or Alt Phone_3` / `Phone No_3` /
#   `Email or Alt Phone_4` — the defendants' phone and email rows (same
#   people-row limit); service needs the address, which is mapped.
# - `Faulty Workmanship.1.1.0.1` / `Faulty Workmanship.1.1.1.1` and
#   `Name 1` / `Name 2` / `Language 1` / `Language 2` — the interpreter
#   question and rows; hearing accommodations are confirmed with the
#   client at review.
# - `Faulty Workmanship.1.1.1.0.1.1` (military service),
#   `Faulty Workmanship.1.1.1.0.0.1` (no defendant covered), and
#   `Faulty Workmanship.1.1.1.0.0.0` (do not know) — the Servicemember
#   Civil Relief Act determination is a legal conclusion for the lawyer
#   at review, together with its two narrative boxes,
#   `No defendant is covered by the Servicemember Civil Relief Act The
#   facts supporting this claim are` (the inline facts blank on the
#   no-defendant line) and `I do not know if any defendants are covered
#   by the Servicemember Civil Relief Act` (the continuation box under
#   it).
# - `Clerk` — the clerk's action line.
# - `City_5` / `State on` / `Date_2` / `Print or Type Name` — the
#   signed-at city, state, date, and printed name; signed at the review
#   appointment.
# The nine claim-type checkboxes are independent yes/no answers (the
# types combine), not one radio group: `custom_multiple_choice` needs
# the checkbox-group fill shape tracked under ENG-454, so the
# questionnaire asks them as adjacent toggles instead of one
# multi-select question.


form_code = "ny__nc1_adult_name_change_petition"
# UCS-NC1 (06/2025) — Name Change and/or Sex Designation Change Petition,
# Individual Adult. The parser reports 49 AcroForm fields.
#
# Every Yes/No question on this blank is ONE radio field carrying two kid
# widgets whose exports are opaque digits (a few use /Yes//No strings).
# The existing checkbox-pair merge accepts kid-less members only, so each
# radio is a plain rename to a `custom_single_choice` state whose choice
# set carries the widget's own exports: the fill selects the kid whose
# appearance states contain the chosen export. Where both kids' state
# lists overlap (the `currently_married` and `children_under_21` groups
# and the print-once-per-page relief boxes), only a discriminating export
# is offered — for the two marriage/children groups that is the Yes
# export, and a No answer leaves the box for the lawyer at review rather
# than paint both columns.
#
# Mapped: the petitioner's present and requested names, birth data,
# residence, the filing court and county dropdowns, every Yes/No group,
# the relief checkboxes, the support arrears and detail boxes, and the
# sex-designation section.
#
# Deliberately left unmapped (decision recorded, lawyer or clerk completes):
# - `IndexNumber` — the clerk's caption number (four header boxes).
# - `Age` — derivable from the intake's date of birth at review; the
#   transform has no computed-value path, so the box stays for the
#   lawyer.
# - `CourtOfConviction` / `Crime` — the conviction details split across
#   two boxes; the intake's felony narrative informs the lawyer, who
#   completes the boxes (two different texts cannot share one answer).
# - `SignatureDate` / `AffirmDay` / `AffirmMonth` / `AffirmYear` — the
#   verification date, set when the petitioner signs at the review
#   appointment (the day/month/year widgets are dropdowns, not literals).
# - `Reset_Form` / `Print_Form` — the blank's own push buttons.

[[field]]
name = "PetitionerName"
question = "person__client.name"


form_code = "ny__nc4_family_name_change_petition"
# UCS-NC4 (06/2025) — Family Name Change Petition. The parser reports 126
# AcroForm fields.
#
# One petition for a whole household: the caption names the petitioner and
# any co-petitioners, the roster lists every member (petitioner included)
# with their proposed name, and the consent pages repeat the venue county.
# The roster's present-name boxes resolve through the `people__family_members`
# aggregate (row/part), the proposed-name boxes all take the one new family
# name, and the six household disclosure groups are plain renames to
# `custom_single_choice` states whose choice sets carry the widgets' own
# opaque exports (the same UCS widget family as NC1's blank).
#
# Mapped: the caption, the roster names, the family-wide new name, the court
# and county dropdowns (petition, parent-consent, and minor-consent pages
# share the venue), the co-petitioner line, the six disclosures, the reasons,
# prior-petition and sealing boxes with their detail areas, the household
# address and move-in date, and the non-petitioning parents' sworn details.
#
# Deliberately left unmapped (decision recorded, lawyer or clerk completes):
# - `Reset_Form` — the blank's own push button.
# - `IndexNumber` — the clerk's caption number (five header boxes).
# - `PetitionerPlaceOfBirth` / `PetitionerDOB` / `PetitionerAge` and the
#   `FamilyMemberPlaceOfBirth` / `FamilyMemberDOB` / `FamilyMemberAge` rows —
#   proof of birth is attached for every member and the clerk transcribes
#   the birth data from that proof at filing; the age is derivable at
#   review. The transform has no people row-part for birth data.
# - `PreviousNameChangePetition0` — the "No" half of the prior-petition
#   radio pair; as on NC1, a No answer leaves the box for the lawyer at
#   review rather than paint both columns.
# - `PreviousNameChangeRequest-attachments` /
#   `ReasonsForNameChangeRequest-attachments` /
#   `SealNameChangeRequest-attachments` — the lawyer decides at review
#   which sections ride with attachments.
# - `ParentRelationshipToMinor` / `ParentRelationshipToMinor1` — the
#   "[select one] parent legal guardian" boxes; their exports are not
#   machine-readable, so the lawyer checks the right box at review.
# - `ParentConsentCounty` / `MinorConsentCounty` — the consent pages repeat
#   the venue county as dropdowns, and a second choice widget cannot merge
#   into an already-mapped question; the lawyer confirms each at review.
# - `ParentConsentNotaryDay` / `ParentConsentNotaryMonth` /
#   `ParentConsentNotaryYear`, `MinorConsentNotaryDay` /
#   `MinorConsentNotaryMonth` / `MinorConsentNotaryYear`, and
#   `AffirmDay` / `AffirmMonth` / `AffirmYear` — sworn before the notary or
#   signed at the review appointment (dropdown widgets, not literals).
# - `PetitionerSignatureDate` / `CoPetitionerSignatureDate` — the wet
#   signature dates on the petition page.
# - `CoPetitionerName` (the verification page's three print-name lines) and
#   `MinorName` (the four minor-consent name boxes) — which minors consent
#   (and in which consent block) is a lawyer determination: consent applies
#   only to minors 14 or older, and the roster order is not guaranteed to
#   match the consent-page order. The roster itself includes the petitioner
#   as its first row, per the form's own note.


form_code = "ny__nc2_minor_name_change_petition"
# UCS-NC2 (06/2025) — Petition for Individual Minor (under 18). The parser
# reports 98 AcroForm fields across 7 pages; the survey counted the same 98.
#
# Two actors share one form: questions 1-20 concern the minor, questions
# 21-39 the petitioner (the parent or guardian filing). Each actor's block
# gets its own states (minor_*/petitioner_* prefixes). Text fields with
# several kid widgets (the caption name, the present-name box, the
# requested-name recitals in the consent sections) are one /Tx field per
# group — the fill sets /V once and every kid displays it, which is exactly
# what the form wants (the same name recited in the caption, Section C, and
# each consent).
#
# This generator's parent /Opt entries on Yes/No radios are junk, but the
# kid appearance states follow an honest pattern with two inversions caught
# by geometry: the minor's spousal-support pair (Q16) and the petitioner's
# child-support pair (Q33) check Yes on `1` and No on `0` (kid0 sits on the
# No column); every other pair checks Yes on `0`, No on `1`. SealingRequest
# uses literal Yes/No exports. The relationship radio exports 0/1/2 down
# its Parent(s)/Guardian(s)/Other rows.
#
# Mapped: names (which auto-paint the consent recitals), the court and
# county dropdowns, the relationship radio, both actors' full background
# blocks, the sex-designation section, the sealing and documents section,
# and the two non-petitioning-parent consent slots.
#
# Deliberately left unmapped (decision recorded, lawyer or clerk completes):
# - `IndexNumber` — the clerk's caption number across seven header boxes.
# - `Age` / `PetitionerAge` — derivable at review; the transform has no
#   computed-value path.
# - `CourtOfConviction` / `Crime` / `CourtOfConviction1` / `Crime1` — each
#   conviction splits across two boxes (court, crime); the intake's felony
#   narratives inform the lawyer, who completes them.
# - `CoPetitionerName` / `SignatureDatePetitioner` /
#   `SignatureDateCoPetitioner` — the optional co-petitioner line and the
#   signature dates, set when the petitioners sign.
# - `AffirmDay1/2` `AffirmMonth1/2` `AffirmYear1/2` — the verification
#   dates (day/month/year dropdowns), set at the review appointment.
# - `ParentConsentCounty1/2` and every `*Notary*` dropdown — the notary
#   completes the consent verifications in person.
# - `MinorConsentCounty` + `MinorConsentNotary*` — the Section E consent a
#   child aged 14 or older signs before a notary, in person.
# - `Reset_Form` / `Print_Form` — the blank's own push buttons.
# - `PetitionerName` — the verification-section printed petitioner name
#   (two kid widgets); the transform only merges kid-less text fields, so
#   the lawyer completes it from the intake at review.
# - `NameChange0` / `SexDesignationChange0` — the Section B verification
#   checkboxes ("is the name/sex designation being changed"); derived from
#   the intake itself, checked by the lawyer at review.
# - `NewSexDesignation` — the three "to [sex]" recital dropdowns in the
#   consent sections D/E; the lawyer completes them alongside the notary
#   blocks. The Q7 dropdown itself (`NewSexDesignation2`) is mapped.


# cargo-nextest configuration.
#
# The browser/accessibility E2E suites drive a real Chromium session
# against the KIND-deployed stack, where a W3C Element Click can be
# dispatched at an off-screen or briefly-covered point and land on
# nothing (see `features::webdriver::scroll_and_js_click`). That is a
# genuinely intermittent failure mode, so CI retries and *classifies*
# it — a test that fails then passes is reported `FLAKY` and tagged in
# JUnit even when the run exits 0 — instead of a plain `cargo test`
# where an intermittent race is indistinguishable from a hard failure.

[profile.default]
# Local runs get zero retries so developers see a flake immediately
# rather than having it silently papered over.
retries = 0
# Failures-only output: passing tests print nothing, a failing test
# still prints its full panic, assertion diff, and captured output.
# The default local loop is read by agents as much as humans, and a
# per-test PASS line across ~50 binaries is pure noise either way —
# a green run is the one-line Summary, a red run is only the failure.
status-level = "fail"
final-status-level = "fail"
# The `features` crate's cucumber suites are `harness = false` binaries
# that do not speak nextest's `--list` protocol, so a workspace run
# aborts on them. Exclude the package here and run those suites with
# `cargo test -p features` until they adopt cucumber's libtest writer.
default-filter = "not package(features)"

[test-groups]
# macOS's keychain trust-settings API fails with -36 ("I/O error")
# when many processes read it concurrently. Each nextest test is its
# own process, and every `cloud` test that builds an AWS SDK client
# loads platform certs, so cap that package's process concurrency.
platform-certs = { max-threads = 2 }
# Fresh canonical schemas compete for PostgreSQL shared DDL locks.
canonical-postgres-fixtures = { max-threads = 2 }

[[profile.default.overrides]]
filter = "package(cloud)"
test-group = "platform-certs"

[[profile.default.overrides]]
filter = '''
binary(/^(dbos|mail_signatures|project_drive_folder_id|project_repository_url|project_resource_links|project_slack_channel|git_repo_schema|project_lifecycle|project_native_delete|brand_move_mirror|firm_journal|contract_review_native|firm_anchor_native|firm_journal_api|api_reads|postgres_startup|entity_native_delete|practice_preview_native|person_phones|brand_phone_numbers|twilio_summary|native_cron_ingress|inbox_native_projects|object_handover|notation_native|project_slack|coverage_postgres|native_nightly_membership|no_delete_guard)$/)
| (binary(=store) & test(/^(email_tokens|entity_types)::tests::/))
| (binary(=portal) & test(/^twilio_(resolution|sms|voice)::tests::/))
| test(/^workflow::native_tests::/)
| test(=runner::tests::the_locked_lane_lands_each_slot_rerun_on_a_new_attempt_key)
| test(=runner::tests::the_unlocked_lane_keeps_one_snapshot_key_per_slot_across_reruns)
| test(=runner::tests::snapshot_phase_writes_into_the_archive_root_and_leaves_exports_empty)
| test(=workflow::tests::two_daily_snapshots_and_a_retry_do_not_mix_full_table_generations)
| test(=workflow::tests::promotion_authors_iceberg_metadata_for_a_store_table_and_chains_a_second_run)
| (package(archives) & test(/^(postgres::tests|sent_email_export::tests|source::tests)::/))
| (package(archives) & test(/^write_only::operations::object_store::tests::/))
| (package(archives) & test(=write_only::operations::tests::closed_source_reuses_only_sealed_local_rows_and_never_recaptures_missing_or_changed_copy))
| (package(archives) & test(=write_only::tests::real_pg_snapshot_is_readable_as_raw_local_iceberg_and_hashes_detect_corruption))
| (package(archives) & test(=write_only::tests::structured_copy_records_real_asset_reference_without_claiming_missing_blob_recovery))
| test(/^dbos_email_summary::recovery::tests::/)
| test(/^email_receipts::summary_recovery::(tests|interrupted_tests)::/)
| (binary(=store) & test(=communications::native_tests::a_logged_call_carries_its_direction_and_role_at_the_top_level))
| test(/^postgres::application_scope_tests::/)
| test(/^project_slack_deliveries::reconciliation::tests::/)
| (binary(=coverage_manifest) & test(=the_navigator_manifest_names_every_relation_this_release_creates))
| (binary(=store) & test(/^postgres::inbox_tests::(fi_history_is_native_idempotent_metadata_and_cannot_queue_or_dispatch|raced_fi_native_id_payloads_cannot_split_across_channels_or_replace_the_winner|identical_fi_replays_preserve_reviewed_history_and_new_events_reopen_it|fi_import_lock_prevents_assignment_until_destination_verification_finishes|fi_project_destination_is_reserved_before_any_history_commit|native_call_and_fi_triage_preserve_roles_billing_and_attribution)$/))
| (binary(=store) & test(/^postgres::native_origin::tests::/) & not test(=postgres::native_origin::tests::invalid_tier_and_nil_operation_fail_before_connecting))
| (binary(=hudson) & test(=postgres_backfill::tests::native_target_refuses_dry_run_and_family_before_source_configuration_or_capture_files))
| (binary(=workflows_service) & test(=host::host_mode_tests::verified_object_activation_removes_only_the_two_legacy_sdk_http_services))
| (binary(=workflows_service) & test(/^host::local_providers::tests::(detached_native_handlers_use_captured_effects_and_the_owned_postgres_store|injected_store_refuses_damaged_history_and_closed_pool_without_fallback|native_billing_digest_without_exports_registers_without_provider_effects)$/))
| (binary(=workflows) & test(=dbos_engine::dri_digest::tests::native_source_keeps_all_projects_and_both_dri_sides))
| (binary(=store) & test(/^(entity_roles|relationships)::tests::/))
| (binary(=workflows) & test(/^email::audit::tests::logging_email_/))
| (binary(=store) & test(/^sent_emails::native_tests::/))
| (binary(=workflows_service) & test(/^project_slack::tests::/))
| (binary(=webapp) & test(=server_store::tests::request_pool_crosses_spawn_and_damaged_history_refuses_the_callback))
| (binary(=hudson) & test(=postgres_admission::tests::selected_application_database_must_match_the_verified_target))
| binary(=sandbox_usage_ledger)
| binary(=document_folder)
| binary(=postgres_native_fixture)
| binary(=party_write_locks)
| binary(=project_adversity_native)
| binary(=person_merge_native)
| (binary(=store) & test(/^postgres::native_origin::fixture::tests::/))
| (binary(=hudson) & test(/^devx::forgejo::smoke::postgres_tests::/))
| (binary(=store) & test(/^postgres::native_origin::recovery_plan::tests::/))
| (binary(=store) & test(/^journal_startup_migration::postgres_tests::/))
| (binary(=store) & test(/^contract_reviews::postgres_tests::/))
'''
test-group = "canonical-postgres-fixtures"

[profile.ci]
# Retry a failing test up to twice with exponential backoff + jitter.
# A pass on retry is recorded as FLAKY (not a clean pass), so the
# JUnit trend surfaces a standing flake rate before it turns a deploy
# red.
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }
# Pin nextest's stock levels: deploy.yml tees this run's log and the
# RETRY/FLAKY status lines are the diagnostic trail, so the quiet
# default profile above must not leak into CI through inheritance.
status-level = "pass"
final-status-level = "flaky"

# Bound retries for workspace tests. KIND browser scenarios have their own timeouts.
[[profile.ci.overrides]]
filter = "not package(features)"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# Emitted at `target/nextest/ci/junit.xml`; uploaded as a CI artifact.
path = "junit.xml"

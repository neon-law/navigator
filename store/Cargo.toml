[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# The operator's PostgreSQL migration entrypoint, run as a Kubernetes Job
# before services start (docs/postgres-tooling.md).
[[bin]]
name = "navigator-migrate"
path = "src/bin/navigator-migrate.rs"

[features]
# Shared PostgreSQL and compatibility fixture APIs, without an embedded engine.
# Unit tests also reach these helpers through cfg(test).
test-support = []
# Only explicit compatibility runs compile the embedded SurrealDB engine.
surreal-compatibility = ["surrealdb/kv-mem"]

[dependencies]
addr.workspace = true
model.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cloud.workspace = true
# RFC 4180 reader for the LinkedIn data-export `messages.csv` (LAW-238
# D1): quoted CONTENT fields with embedded newlines are the export's norm.
csv.workspace = true
futures.workspace = true
hex.workspace = true
# `nef` shares MIME parsing between docket ingestion and Inbox processing.
mail-parser.workspace = true
# `source_pages` locates a quote in a stored PDF asset and lifts the pages
# it falls on, through `pdf::passage` (#893).
pdf.workspace = true
# The canonical scaffold a fresh Project repository is seeded with, shared
# with `navigator repository scaffold` so the CLI and the server write the
# same bytes (docs/project-repositories.md).
project-scaffold.workspace = true
# Jitter for the optimistic-concurrency retry in `persons`: losers that all
# back off by the same interval simply re-stage the same collision.
rand.workspace = true
# The bare-repo store: `store::projects::provision_repo` shells to `git`
# through here so eager creation and the lazy git transport share one
# provisioning path (docs/project-repositories.md §6).
repos.workspace = true
# `template_source` validates a Project repo's template with the same rule
# set `navigator validate` runs before persisting it as a version — one
# validator everywhere (docs/agent-workflows.md), refuse-on-error.
include_dir.workspace = true
rules.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
serde_yaml.workspace = true
sha2.workspace = true
# Remote transport and schema compatibility; the engine is an explicit opt-in.
surrealdb.workspace = true
# The TLS provider `store::surreal::install_tls_provider` registers. Pinned to
# the same 0.23 rustls surrealdb links, so the provider lands in the instance
# that actually performs the `wss://` handshake.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
zip.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
# `brand_domains` parses a Brand's website URL and IDNA-normalizes its host.
url.workspace = true
uuid.workspace = true
# `matter_captions` stores a Project's `matter:` block in the shape
# `word::matter::Matter` deserializes and composes a caption from.
word.workspace = true

[dev-dependencies]
# Self-enable test-support so this crate's own unit + integration tests
# reach `store::test_support`.
store = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true

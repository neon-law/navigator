    slug: thanks-apple
    title: "Thanks, Apple"
    description: "A farewell to my Apple teammates, and the north star that's taking me to Neon Law."
    status: published
    publish_at: "2026-06-19T00:00:00Z"
    body_markdown: |
      _Nick is a lawyer at Neon Law._

      ![If fruit falls, it's fair game](img/thanks-apple/collage-6.jpg)

      Friends,

      My favorite part of our leadership palette is Know People, and my favorite part about Apple is you. I feel so lucky to
      have learned from so many of you over these past five years.

      Thank you to Prateek for taking a chance on me nearly five years ago, and to Koushik and Manjeet for being such
      wonderful managers. On the UCA team, I learned how to manage a data lake the size of more than eight Libraries of
      Congress — and I learned that when you do hard work alongside stellar teammates and with a smile, anything is possible.

      Thank you to Owen, my big bro, for taking me under his wing and teaching me what it means to be a technical trainer. I
      had the time of my life traveling the world and getting to visit you in places like Hyderabad, Bangalore, Austin,
      London, Singapore, and beyond. And thank you to Agam, Antoine, Lorena, Sai, and Madan for being the kind of teammates
      everyone hopes to have.

      I'm grateful for the data engineering community, and for Melissa, Sundar, Yan, Himadri, and Shyju. Working across the
      company, we discovered we were all doing different flavors of the same thing — and I learned so much from those
      conferences these past two years. Hosting the data engineering meetups was one of my favorite parts of being here.

      A big thank you to Kartthik and Alejandro, my roommates for a bit, who took me in after my divorce. It wasn't the
      easiest chapter of my life, but it's one where I found brothers.

      I was on personal leave this past month, and during that time I realized my professional north star is doing everything
      I can to advance access to justice. I'll be building my law firm, Neon Law, toward exactly that.

      Thank you all, from the bottom of my heart.

      See you around,

      Nick


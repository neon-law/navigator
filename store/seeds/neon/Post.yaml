  - brand: neon
    slug: one-message-several-views
    title: "One message, several views"
    description: "How rows, documents, and relationships help us prepare legal work in Navigator."
    status: draft
    publish_at: "2026-10-13T00:00:00Z"
    body_markdown: |
      One of the most profound things I learned in my career is that the same data deserves more than one view.

      Sometimes you need a spreadsheet: rows, columns, and precise questions. Sometimes you need the original document: the
      email, attachment, or transcript in its full context. Sometimes you need a graph: the people, organizations, and
      relationships connecting them.

      An email can be all three. That idea shapes how we're building Navigator.

      The design starts with every message arriving in the omnichannel Inbox. We save the person, email, and conflict
      relationships before looking for its Project. A matched message feeds a summary and a governed Project repository
      update; an unmatched message stays in the Inbox. Either path creates a notification to the attorney.

      ```mermaid
      flowchart TD
          A[Message arrives to Omnichannel inbox] --> S
          subgraph S[Save to database]
              direction LR
              P[1. Save person table] ~~~ E[2. Save email] ~~~ C[3. Save conflicts]
          end
          S --> D{Project found?}
          D -->|Yes| R[Assign to Project]
          R --> U[Summarize and update per-project repo]
          D -->|No| K[Keep in Inbox]
          U --> N[Create notification to attorney]
          K --> N
      ```

      This diagram describes the intended flow. Person matching preserves uncertain identities; conflict saves retain
      source-linked relationships for review. Summarization uses the existing approval gates, and repository updates contain
      approved source-safe changes. Automatic enrichment, routing, repository updates, and the timing of attorney
      notifications across both branches remain implementation work. Durable inbound Slack notifications already exist; this
      flow adds the completion ordering and branch coverage described above.

      ## The row: what arrived, and where it belongs

      When an email enters Navigator's Firm Inbox, the intake code records the sender address, subject, body, and provider
      identity. A Conversation stays in that Inbox whether or not someone assigns it to a Project. A Project is our container
      for a matter.

      An unassigned message keeps its saved body and metadata at the Firm intake boundary. It has no Project Communication
      link until assignment. That distinction matters. The same person can be buying a home and making an estate plan. Knowing
      who wrote the email doesn't tell you which matter it belongs to.

      Once assigned, messages enter the Project's Communication log. Here is an excerpt from the actual schema:

      ```surql
      DEFINE FIELD OVERWRITE project_id ON communication TYPE record<project>;
      DEFINE FIELD OVERWRITE channel ON communication TYPE string
          ASSERT $value IN ['document_comment', 'email_inbound', 'email_outbound',
                            'portal_message', 'sms_inbound', 'sms_outbound',
                            'facebook_inbound', 'facebook_outbound',
                            'instagram_inbound', 'instagram_outbound',
                            'threads_inbound', 'threads_outbound',
                            'youtube_inbound', 'youtube_outbound', 'tiktok_inbound', 'tiktok_outbound', 'call'];
      DEFINE FIELD OVERWRITE direction ON communication TYPE string
          ASSERT $value IN ['inbound', 'outbound', 'internal'];
      DEFINE FIELD OVERWRITE author_person_id ON communication TYPE option<record<person>>;
      DEFINE FIELD OVERWRITE counterparty ON communication TYPE option<string>;
      DEFINE FIELD OVERWRITE subject ON communication TYPE option<string>;
      DEFINE FIELD OVERWRITE body ON communication TYPE string;
      DEFINE FIELD OVERWRITE source_ref ON communication TYPE option<string>;
      DEFINE FIELD OVERWRITE asset_id ON communication TYPE option<record<asset>>;
      ```

      Those are typed records and links: the relational view of the message. This communication lane currently runs on
      SurrealDB. The useful idea is the shape of the data, independent of the database brand.

      The schema also gives each message a source reference so ingestion can recognize a repeated delivery. Channel and
      Project indexes answer different questions: where did this arrive, and which matter does it belong to?

      ## The document: preserve the source

      A summary helps you get oriented. The original tells you what the sender actually wrote.

      Navigator's email-summary intake archives the source bytes, and the Communication shape can link to an Asset holding a
      raw payload. Documents and attachments have their own storage and metadata lane. This is the document view: preserve
      context, then give it enough structure to retrieve and use it.

      Saving the body also gives us a source for approved analysis and writing-style examples. A style corpus needs explicit
      selection and attribution; a received email describes its sender's voice, not automatically mine. That selection
      pipeline is work ahead. I'd like us to search message bodies two ways: full-text search for the words someone used, and
      vector search for passages with a similar meaning. Those searches are work ahead; storing a body is only the foundation.

      ## The graph: who is connected to whom

      The third view is relationships. A person can own a company, represent another party, or be connected to someone the
      firm already serves. A contact list gets much more useful when you can follow those connections.

      Navigator already has a Conflict-Check Graph. This is its supplemental relationship table, straight from the schema:

      ```surql
      DEFINE TABLE IF NOT EXISTS relationship TYPE RELATION FROM person|entity TO person|entity SCHEMAFULL PERMISSIONS NONE;
      ```

      The conflict checker walks recorded relationships between people and organizations. Edges carry their kind, confidence,
      and provenance so a lawyer can assess why a connection appears.

      That is the foundation I want for a CRM as well: contact history connected to the work and relationships that give it
      meaning. Automatically extracting those relationships from every message is still work ahead. An email address alone
      doesn't establish a person's identity, and a model's guess needs evidence and review.

      ### Where Apache AGE fits

      [Apache AGE](https://age.apache.org/) adds graph nodes, edges, and traversal queries to PostgreSQL. That gives us a
      place to ask relationship questions alongside ordinary relational tables: who owns this organization, who represents
      that party, and how are they connected to people we already know?

      Navigator's PostgreSQL image already includes AGE, and compatibility tests exercise graph traversal and recovery. The
      application conflict checker currently uses SurrealDB relationships. Porting those relationships and keeping the graph
      consistent with relational records is still work ahead. AGE is the planned graph layer; it does not currently receive
      every incoming email.

      In the target design, the saved email record anchors the source. Person and Entity nodes describe known identities;
      reviewed Relationship Edges describe connections. Project assignment is a separate link. A message can contribute to
      contact history without belonging to a matter, and recording a person grants them no access.

      ## AI as mise en place

      In a kitchen, mise en place means getting the ingredients ready before you cook. That's how I think about AI preparing a
      matter: assemble the requests, stated dates, missing information, and sources so the lawyer can choose the next step.

      Navigator already has a durable email-summary workflow using Gemini through Vertex. Its result has a deliberately small
      shape. This is the Rust type from the implementation:

      ```rust
      pub struct EmailSummary {
          pub summary: String,
          pub requested_actions: Vec<String>,
          pub sender_stated_dates: Vec<String>,
          pub missing_information: Vec<String>,
      }
      ```

      The workflow checks that the message belongs to a Project and that its authenticated sender identity is explicitly
      approved before sending content to the model. Feature configuration also controls whether inference is enabled. The
      code's existence is separate from activation on a particular installation.

      A sender-stated date stays a sender-stated date. A requested action stays a request. The next step I want is to turn
      that preparation into source-linked proposals a lawyer can review, then make governed updates to the Project's source
      repository where appropriate. Message bodies and privileged matter content stay in Navigator-managed storage.

      I also want privilege-review labels to help surface messages that need a lawyer's attention. Today, the Communication
      lane uses Project access boundaries and internal-message visibility. A label would support review; it would carry no
      promise that a model has decided legal privilege.

      ## Beyond the mailbox

      One day, I want Gmail to become one transport into this system, with Navigator as the place we do the work. Email and
      SMS already have Inbox adapters. Social-channel support is developing, and call notes already have a structured home as
      Communications. Consented call transcripts belong in this direction too; automatic transcript intake needs its own
      verified path.

      Whatever the channel, I want the same questions answered: who is speaking, what did they say, which Project needs it,
      and what should we prepare next?

      One message. Several useful views. A better-prepared next step.

      ## Implementation notes

      The code excerpts above match Navigator’s public source, with comments omitted from the schema excerpt. The
      structured Communication and Inbox foundations correspond to completed issues ENG-160 and ENG-935; the Project
      relationship work to ENG-822; durable summaries to ENG-797 and ENG-944; and structured call notes to LAW-140. These are
      implementation references, not a claim that every integration is activated.


[package]
name = "workflows-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The native DBOS worker uses PostgreSQL and requires complete native ownership.
# The explicit `restate-compatibility` feature adds the retained HTTP endpoint
# and its journaled handlers; the compatibility image enables that feature.
[[bin]]
name = "workflows-service"
path = "src/main.rs"

[[bin]]
name = "social-publish-reconciler-trigger"
path = "src/bin/social-publish-reconciler-trigger.rs"

[[test]]
name = "request_identity_signature"
required-features = ["restate-compatibility"]

[lib]
path = "src/lib.rs"

[features]
default = []
restate-compatibility = ["dep:restate-sdk", "archives/restate-compatibility", "billing-workflows/restate-compatibility"]
# Reproduce JWT provider ambiguity without enabling an embedded database.
jwt-provider-regression = ["restate-jwt/aws_lc_rs"]

[dependencies]
billing.workspace = true
anyhow.workspace = true
archives = { workspace = true, default-features = false }
async-trait.workspace = true
axum.workspace = true
billing-workflows = { workspace = true, default-features = false }
dbos.workspace = true
chrono.workspace = true
cloud.workspace = true
dotenvy.workspace = true
restate-sdk = { workspace = true, optional = true }
# Match the Restate SDK's JWT instance so startup can pin its provider even
# when optional compatibility features enable another backend (ENG-550).
restate-jwt.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
reqwest.workspace = true
sha2.workspace = true
sqlx.workspace = true
# The `repository` child reads a Project repository's `navigator.yaml` pin
# through `rules::project_manifest`, the same reader `navigator project gate`
# uses, so the two can never disagree about what a repository pins.
rules.workspace = true
store = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }
telemetry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
workflows = { workspace = true, features = ["dbos"] }
views.workspace = true

[dev-dependencies]
bs58.workspace = true
serde_json.workspace = true
sqlx.workspace = true
surrealdb.workspace = true
ed25519-dalek.workspace = true
store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
wiremock.workspace = true
tempfile.workspace = true

[lints]
workspace = true

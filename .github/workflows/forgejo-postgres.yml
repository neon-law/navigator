name: Forgejo on KIND
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      KUBECONFIG: /tmp/forgejo-kind.config
      NAVIGATOR_KIND_CLUSTER: forgejo-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.0
      - name: Render the GKE overlays
        run: |
          set -euo pipefail
          for lane in staging production; do
            manifest="/tmp/forgejo-$lane.yaml"
            kubectl kustomize "examples/deploy/k8s/gke/forgejo/$lane" > "$manifest"
            if [[ "$lane" == staging ]]; then
              expected_namespace=navigator
            else
              expected_namespace=navigator
            fi
            grep -q "namespace: $expected_namespace" "$manifest"
            grep -q 'name: YOUR_FORGEJO_OIDC_NAME' "$manifest"
            grep -q 'discovery_url: YOUR_FORGEJO_OIDC_DISCOVERY_URL' "$manifest"
            grep -q 'email_domain_allowlist: YOUR_FORGEJO_ADMISSION_DOMAINS' "$manifest"
            grep -q 'name: navigator-forgejo-database' "$manifest"
            if grep -q 'name: navigator-forgejo-runner' "$manifest"; then
              echo "Forgejo $lane must not deploy an Actions runner" >&2
              exit 1
            fi
          done
      - name: Install pinned KIND
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Create the task-owned cluster
        run: |
          kind create cluster --name forgejo-smoke --config k8s/kind-forgejo-config.yaml --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$KUBECONFIG" --wait 120s
          kubectl --context kind-forgejo-smoke create namespace navigator
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - name: cache the Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate-cli
          save-if: false
      - name: build navigator CLI
        run: cargo build -p deploy --quiet
      # The receiver serves from the Debian bookworm PostgreSQL pod, whose
      # glibc is older than the runner's; a glibc-linked binary fails its
      # readiness gate with `GLIBC_2.38 not found`. Stage a static musl
      # binary instead — no debuginfo or incremental artifacts, and the
      # target tree is dropped behind the copy to keep the runner's disk.
      - name: build the in-pod receiver binary (musl)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_DEV_INCREMENTAL=false \
            cargo build -p deploy --bin navigator-deploy \
            --target x86_64-unknown-linux-musl --quiet
          mkdir -p target/receiver
          cp target/x86_64-unknown-linux-musl/debug/navigator-deploy \
            target/receiver/navigator-deploy
          rm -rf target/x86_64-unknown-linux-musl
      - name: navigator-deploy dev forgejo up
        run: target/debug/navigator-deploy dev forgejo up
      - name: navigator-deploy dev forgejo smoke
        run: target/debug/navigator-deploy dev forgejo smoke
      - name: Diagnose
        if: failure()
        run: |
          kubectl --context kind-forgejo-smoke -n navigator get pods,jobs,pvc,service,endpointslice,networkpolicy -o wide || true
          for pod in navigator-forgejo-0 navigator-postgres-0; do
            kubectl --context kind-forgejo-smoke -n navigator describe pod "$pod" | tail -30 || true
            kubectl --context kind-forgejo-smoke -n navigator logs "$pod" --all-containers --tail=80 || true
          done
          kubectl --context kind-forgejo-smoke -n navigator logs deploy/navigator-forgejo-runner --tail=80 || true
          kubectl --context kind-forgejo-smoke -n navigator logs deploy/rauthy --tail=40 || true
      - name: Cleanup task cluster
        if: always()
        run: kind delete cluster --name forgejo-smoke
'on':
  pull_request:
    paths:
      - k8s/forgejo/**
      - k8s/postgres/**
      - k8s/overlays/kind/forgejo/**
      - k8s/overlays/kind/rauthy/**
      - k8s/overlays/kind-postgres-persistence/**
      - k8s/kind-forgejo-config.yaml
      - examples/deploy/k8s/gke/forgejo/**
      - deploy/src/devx/forgejo/**
      - .github/workflows/forgejo-postgres.yml
  push:
    branches: [main]
    paths:
      - k8s/forgejo/**
      - k8s/postgres/**
      - k8s/overlays/kind/forgejo/**
      - k8s/overlays/kind/rauthy/**
      - k8s/overlays/kind-postgres-persistence/**
      - k8s/kind-forgejo-config.yaml
      - examples/deploy/k8s/gke/forgejo/**
      - deploy/src/devx/forgejo/**
      - .github/workflows/forgejo-postgres.yml
  workflow_dispatch: null

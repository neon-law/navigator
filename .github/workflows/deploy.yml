  release-cli-publish:
    name: attach the CLI archives to the GitHub Release
    # One publish job attaches EVERY archive rather than one job per
    # platform. `gh release create` is guarded by `if ! gh release view`, which
    # is check-then-act: jobs racing on the same tag would all see no release
    # and all try to create it, and the losers would fail.
    # Both archives, plus the publishes — every artifact of stage 2. This
    # job cuts the Release, the first thing in the run a stranger can fetch, and
    # a CLI attached without the images its tag names is half a release, so it
    # waits on all of them rather than on the archives it uploads.
    needs:
      [
        release-cli-build-linux,
        release-cli-build-macos,
        release-lsp-build-linux,
        release-lsp-build-macos,
        publish-service,
        publish-triggers,
        publish-cli-image,
        release-version,
      ]
    # A GitHub Release hangs off an immutable Git tag, and a release IS a tag
    # now, so `publishable` is the whole condition — `release-version` sets it
    # only for a validated tag ref.
    if: needs.release-version.outputs.publishable == 'true'
    # Standard runner: downloads, `gh release` calls, and uploads. No compile.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job publishes an artifact built elsewhere and needs no working
      # tree of its own — the checkout is here only so the local
      # `slack-progress` action is on disk. Sparse, so it stays a metadata
      # fetch.
      # Sparse: this job publishes artifacts built elsewhere, plus source files
      # below that are neither — `install.sh`, `LICENSE`, `LICENSE-MIT`,
      # `LICENSE-APACHE-2`, and `NOTICE` ship
      # from source, not from a build step, so they are checked out rather
      # than downloaded. The license files and `NOTICE` are also attached standalone to
      # the public distribution host below, alongside the archives that
      # already carry a copy of each beside the executable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          sparse-checkout: |
            .github/actions/slack-progress
            .github/actions/navigator-install/install.sh
            LICENSE
            LICENSE-MIT
            LICENSE-APACHE-2
            NOTICE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "download the Linux CLI archive"
      - name: download the Linux CLI archive
        timeout-minutes: 90
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navigator-linux-cli
          path: dist
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "download the macOS CLI archive"
      - name: download the macOS CLI archive
        timeout-minutes: 90
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navigator-macos-cli
          path: dist
      # ENG-115: this artifact only exists when release-cli-build-macos had
      # Apple Developer ID secrets to sign with. Absent them, there is nothing
      # to download — `continue-on-error` keeps that the normal case, not a
      # failure, and the upload step below only attaches the file if it
      # actually landed in `dist/`.
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "download the macOS installer package"
      - name: download the macOS installer package
        timeout-minutes: 90
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: navigator-macos-pkg
          path: dist
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "download the Linux LSP archive"
      - name: download the Linux LSP archive
        timeout-minutes: 90
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navigator-linux-lsp
          path: dist
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "download the macOS LSP archive"
      - name: download the macOS LSP archive
        timeout-minutes: 90
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navigator-macos-lsp
          path: dist
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "create the release if needed and attach the archive"
      - name: create the release if needed and attach the archive
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
          PRERELEASE: ${{ needs.release-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              # A `-hotfix.N` tag is marked as a prerelease so GitHub stops
              # reporting it as "Latest release". Without this the hotfix would
              # become the front-page download even though it is, by semver
              # precedence, ranked BELOW the ordinary release it precedes.
              flags=(--title "Neon Law Navigator ${TAG}" --generate-notes)
              if [ "${PRERELEASE}" = "true" ]; then
                  flags+=(--prerelease)
              fi
              # NO `--target`. The tag already exists — `release-tag` created it
              # earlier in THIS run, at the SHA every archive here was compiled
              # from — so the Release hangs off that ref. `--target` was
              # load-bearing while this job created the tag itself, and passing
              # it now would name a SHA for a ref that already has one.
              gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}"
          fi
          # Every upload names its archive tag-exactly. `navigator-*` and
          # `navigator-lsp-*` are distinct strings but not distinct match sets:
          # the CLI wildcard also matched `navigator-lsp-<tag>-*`, so each LSP
          # archive uploaded twice, and any drift between the two command
          # shapes would have clobbered the wrong bytes. `--clobber` only makes
          # a re-run idempotent; the exact filename is what keeps each asset
          # its own. The LSP archives share this job and this Release, but not
          # the CLI's filename prefix, so an editor extension (Zed's
          # marketplace, first) can resolve the LSP asset by name without also
          # matching the CLI's.
          gh release upload "${TAG}" dist/navigator-${TAG}-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" dist/navigator-${TAG}-macos.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          # Only present when release-cli-build-macos had Apple Developer ID
          # secrets to sign and notarize with; see that job's
          # `apple-signing` step. Its absence is the normal case today, not a
          # broken upload.
          if [ -f "dist/navigator-${TAG}-macos.pkg" ]; then
              gh release upload "${TAG}" dist/navigator-${TAG}-macos.pkg \
                  --repo "${GITHUB_REPOSITORY}" --clobber
          fi
          gh release upload "${TAG}" dist/navigator-lsp-${TAG}-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" dist/navigator-lsp-${TAG}-macos.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          # The sha256 sidecars `.github/actions/navigator-install` and
          # `install.sh` verify before extracting the archive each names.
          gh release upload "${TAG}" dist/navigator-${TAG}-linux.tar.gz.sha256 \
              --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" dist/navigator-${TAG}-macos.tar.gz.sha256 \
              --repo "${GITHUB_REPOSITORY}" --clobber
          # `install.sh` itself, tag-exact like every other asset here: the
          # script's own logic can change between releases same as the
          # binary can, so a reader pinned to one release gets the installer
          # that shipped with it, not whatever main currently carries.
          cp .github/actions/navigator-install/install.sh "navigator-${TAG}-install.sh"
          gh release upload "${TAG}" "navigator-${TAG}-install.sh" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          # LICENSE and NOTICE travel standalone too, not only bundled inside
          # each archive — a reader who never unpacks one still has them a
          # click away.
          gh release upload "${TAG}" LICENSE --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" LICENSE-MIT --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" LICENSE-APACHE-2 --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" NOTICE --repo "${GITHUB_REPOSITORY}" --clobber
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-publish"
          step: "attach immutable image digest manifest"
      - name: attach immutable image digest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          jq -s 'add' "${RUNNER_TEMP}"/image-digests/*/image-digest.json > "${RUNNER_TEMP}/navigator-image-digests.json"
          gh release upload "${TAG}" "${RUNNER_TEMP}/navigator-image-digests.json" --repo "${GITHUB_REPOSITORY}" --clobber

  # ---------- Stage 3b: hand the release to the Homebrew tap ----------
  # `brew install neon-law/navigator/navigator` is the macOS install
  # path, and this job is what keeps it current.
  #
  # IT SENDS A TAG AND NOTHING ELSE. The tap computes every sha256 itself, from
  # the bytes the job above just attached. Shipping digests in the payload would
  # let a malformed dispatch pin the formula to bytes nobody verified, and would
  # leave the tap unable to repair a bad bump without a new release here — which
  # `YY.M.D` makes impossible until tomorrow, since it admits one ordinary
  # release per UTC day. The tap's own `workflow_dispatch` re-runs any tag.
  #
  # WHY A SEPARATE REPOSITORY. A tap is a Git repository Homebrew clones and
  # re-reads on every `brew update`, and the formula changes on a cadence this
  # repository's `main` does not: once per release, mechanically, with no review
  # to add. Landing it here would mean either a bot commit to a protected `main`
  # or a PR nobody reads, and would put a full workspace clone in front of every
  # `brew update`. The tap is also the reason the unsigned macOS binary is
  # usable at all — brew fetches with curl, which sets no `com.apple.quarantine`
  # attribute, so Gatekeeper does not block bytes a browser download would.
  # Notarization is still the right fix (ENG-115); this is what stands in.
  #
  # THIS JOB FAILS THE RELEASE UNLESS THE FORMULA ACTUALLY MOVES, and the
  # distinction is the whole point. `POST /dispatches` answers 204 the moment
  # GitHub queues the event and carries no run id, so dispatching proves only
  # that the tap was told. Three consecutive releases were told and none was
  # bumped — `26.8.21-hotfix.10`, `.11`, and `.12` each died at the tap's final
  # `git push` — and all three stayed green here while `brew` served
  # `26.8.20-hotfix.4`. A tap that silently stops updating reports a stale
  # version to everyone who installed through it, which is the same shape as the
  # Project-CI 404 the archive jobs above exist to prevent.
  #
  # So the job reads the formula back and waits for it to name this tag. THE
  # FORMULA REMAINS THE PROOF — a bump that goes green without committing is
  # caught by nothing else, and the outcome is what `brew` resolves.
  #
  # What the formula alone cannot say is WHY it has not moved: a bump that died
  # thirty seconds ago and a bump still queued read identically as "not this tag
  # yet", so a poll waiting on the second has to spend its whole budget on the
  # first. It did: `26.8.30-rc.1` was refused by the tap 27 seconds after being
  # dispatched, and this job then waited a further quarter of an hour to say so.
  #
  # The tap's own run conclusion is what separates those two, so the loop reads
  # it and fails the moment the bump has failed. Three reasons this is safe now,
  # each of which was a reason not to do it before:
  #
  #   - NO GRANT WIDENS. The tap is a PUBLIC repository — Homebrew clones it
  #     anonymously on every `brew update` — so its run list is public data,
  #     read with this run's own `GITHUB_TOKEN`. `HOMEBREW_TAP_TOKEN` stays
  #     `contents: write` and nothing asks it for `actions: read`.
  #   - NO RACE WITH A MANUAL RE-RUN. The read is narrowed to
  #     `event=repository_dispatch` and to runs created since this job
  #     dispatched, so the tap's `workflow_dispatch` repair path is invisible to
  #     it. And the formula is checked FIRST on every pass, so a repair that has
  #     already published this tag ends the loop before any conclusion is read.
  #   - A READ THAT FAILS COSTS NOTHING. The conclusion only ever ends the wait
  #     EARLY; it is never what proves success. If the run cannot be found or
  #     the API declines, the loop is exactly the formula poll it was before,
  #     bounded by the same deadline.
  #
  # A HOTFIX REACHES THE TAP TOO, and the reason is that the tap can always walk
  # forward off one. The formula holds exactly one version and every `brew
  # install` resolves to it, so the question a hotfix raises is not "is this an
  # rc?" — every published tag passed the same KIND gate — but "can the NEXT
  # ordinary release replace it?"
  #
  # By itself it could not. Homebrew's comparator is not semver: it orders
  # `26.8.20-hotfix.4` ABOVE `26.8.20`, the reverse of the semver §11.3 ranking
  # this workflow relies on everywhere else. A formula bumped to a hotfix and
  # then to its own base version would look like a DOWNGRADE to `brew`, which
  # reports the keg as current and never upgrades it. That stranding — not the
  # rc worry — is what kept hotfixes away from the tap.
  #
  # `scripts/bump.sh` in the tap closes it with `version_scheme`, the mechanism
  # Homebrew provides for exactly this: a formula whose scheme is higher than an
  # installed keg's is newer regardless of how the two versions compare. The
  # bump compares the new tag to the old one with Homebrew's OWN comparator and
  # increments the scheme whenever the new tag does not sort strictly above, so
  # every bump is an upgrade whatever the shape of either tag.
  #
  # What stays true: a hotfix is still marked `--prerelease` on GitHub, so it is
  # not the front-page download. Only `brew`, which resolves one version and
  # needs that version to be the newest good build, follows it.
  release-operator-cli-publish:
    name: attach the operator CLI archives to the GitHub Release
    # `hudson` and `scorpio` attach after the Release exists, in a job
    # of their own. The gate action can consume Navigator as soon as
    # `release-cli-publish` finishes. The tap waits for all three CLIs.
    needs:
      [
        release-cli-publish,
        release-deploy-cli-build-linux,
        release-deploy-cli-build-macos,
        release-scorpio-build-linux,
        release-version,
      ]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: download the operator CLI archives
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{hudson,scorpio}-*"
          merge-multiple: true
          path: dist
      - name: attach the operator CLI archives
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          gh release upload "${TAG}" dist/hudson-${TAG}-linux.tar.gz \
              dist/hudson-${TAG}-linux.tar.gz.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" dist/hudson-${TAG}-macos.tar.gz \
              dist/hudson-${TAG}-macos.tar.gz.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" dist/scorpio-${TAG}-linux.tar.gz \
              dist/scorpio-${TAG}-linux.tar.gz.sha256 --repo "${GITHUB_REPOSITORY}" --clobber

  release-homebrew-tap:
    name: hand the release to the Homebrew tap
    needs: [release-operator-cli-publish, release-version]
    # TWO CONDITIONS, and they answer different questions.
    #
    # `publishable` is "did this commit cut a release?" The Release must also
    # carry all three CLI archives before dispatch. The tap downloads them
    # to compute formula checksums.
    #
    # AND THERE IS NO SECOND CONDITION ANY MORE. `publishable` is the whole
    # gate: EVERY publishable tag is dispatched, hotfix and release candidate
    # included, and `cli/tests/homebrew_tap_dispatch.rs` refuses to let that
    # narrow again.
    #
    # It narrowed once. The tap's own `bump` and `test` workflows accepted
    # `YY.M.D` and `YY.M.D-hotfix.N` and refused a release candidate, so this
    # job grew a `tap_follows` condition rather than dispatching `26.8.30-rc.1`
    # into a bump that could only fail. `homebrew-navigator#9` taught the tap to
    # accept `-rc.N`, which removes the reason for the condition — and removing
    # it is worth more than the tidiness, because that condition is what cost
    # `26.9.3` its bump. `tap_follows` was added on 2026-09-02; `26.9.3`
    # released the next day with `26.9.2` as the checker binary this workflow
    # runs, that binary predated the output, `needs...outputs.tap_follows`
    # resolved to the empty string, and this job SKIPPED on a fully green run.
    # `brew install` served a version two releases behind for a day with no
    # failure anywhere to say so.
    #
    # The general lesson is in the `checker` step above, which now refuses a
    # binary that does not write every output this job reads. The specific
    # lesson is here: a gate that narrows below `publishable` must earn its
    # place, because its failure mode is a silent skip rather than a red run.
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    # Outlasts the confirmation wait below, which is the long pole. A job that
    # dies on its own clock reports a timeout rather than the stale formula that
    # caused it.
    timeout-minutes: 15
    # No `contents: write`. This job writes nothing in THIS repository; the
    # cross-repository grant is the `HOMEBREW_TAP_TOKEN` secret, scoped to
    # `contents: write` on the tap alone.
    permissions:
      contents: read
    steps:
      # Sparse: this job publishes nothing of its own and needs the tree only
      # so the local `slack-progress` action is on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          sparse-checkout: .github/actions/slack-progress
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-homebrew-tap"
          step: "dispatch the formula bump"
      - name: dispatch the formula bump
        timeout-minutes: 90
        id: dispatch
        env:
          # A fine-grained token with `contents: write` on
          # `neon-law/homebrew-navigator` and nothing else. The
          # run's own GITHUB_TOKEN cannot reach another repository, and
          # widening it to one that could would hand every job in this
          # workflow that reach.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-version.outputs.tag }}
          TAP_REPO: neon-law/homebrew-navigator
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
              echo "::error::HOMEBREW_TAP_TOKEN is unset — the Homebrew tap cannot be told about ${TAG}, and every brew install would keep resolving the previous release"
              exit 1
          fi
          # THE INSTANT THE TAP WAS TOLD, recorded before telling it. The
          # confirmation below narrows the tap's run list to runs created since
          # this moment, so an older run — a previous release's, or a re-run of
          # one — can never be mistaken for this release's bump. A minute is
          # subtracted because the two repositories' clocks are not the same
          # clock and GitHub's `created` filter has one-second resolution.
          # Erring early can only widen the window, and the `event` filter plus
          # the formula check below already exclude everything that could admit.
          echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # `-f` sends a string field; the nested `client_payload[tag]` key is
          # how `gh api` composes the object the tap workflow reads as
          # `github.event.client_payload.tag`.
          gh api --method POST "/repos/${TAP_REPO}/dispatches" \
              -f "event_type=navigator-release" \
              -f "client_payload[tag]=${TAG}"
          echo "dispatched navigator-release ${TAG} to ${TAP_REPO}"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-homebrew-tap"
          step: "confirm the formula moved"
      - name: confirm the formula moved
        timeout-minutes: 90
        env:
          # The same tap-scoped token. Reading a file it can already write asks
          # for no grant it does not hold.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The run's OWN token, for the tap's run list alone. The tap is public
          # — Homebrew clones it anonymously on every `brew update` — so its
          # runs are public data and reading them needs no cross-repository
          # grant. Keeping this separate is the point: `HOMEBREW_TAP_TOKEN`
          # stays `contents: write` on one repository and never acquires
          # `actions: read`.
          PUBLIC_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
          TAP_REPO: neon-law/homebrew-navigator
          SINCE: ${{ steps.dispatch.outputs.since }}
          # A CEILING, NOT A PLAN. The bump answers in well under a minute, and
          # a bump that FAILS is now reported the moment it fails rather than at
          # this deadline — which is the whole of what changed here. What is
          # left to absorb is a queued runner and the tap's `bump-formula`
          # concurrency group, so the ceiling covers the case where no
          # conclusion can be read at all. `BUMP_BUDGET_MINUTES` in
          # `cli/tests/homebrew_tap_dispatch.rs` holds the job timeout above it.
          BUMP_BUDGET_MINUTES: "10"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + BUMP_BUDGET_MINUTES * 60))
          while :; do
              # A failed read leaves that formula pending until the next poll.
              published=()
              for formula in navigator hudson scorpio; do
                  contents="$(gh api -H "Accept: application/vnd.github.raw" \
                      "/repos/${TAP_REPO}/contents/Formula/${formula}.rb" || true)"
                  version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)"$/\1/p' <<< "${contents}")"
                  if [ "${version}" = "${TAG}" ]; then
                      continue
                  fi
                  published+=("${formula}=${version:-missing}")
              done
              if [ "${#published[@]}" -eq 0 ]; then
                  echo "the tap publishes Navigator, Hudson, and Scorpio at ${TAG}"
                  exit 0
              fi

              # A completed failure can end the wait early. A successful run
              # still needs all three versions to be visible in the tap.
              conclusion="$(GH_TOKEN="${PUBLIC_TOKEN}" gh api \
                  "/repos/${TAP_REPO}/actions/workflows/bump.yml/runs?event=repository_dispatch&created=%3E%3D${SINCE}&per_page=1" \
                  --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)"
              if [ -n "${conclusion}" ] && [ "${conclusion}" != "success" ]; then
                  echo "::error::the tap refused ${TAG} — its bump completed '${conclusion}' and the tap still reports '${published[*]}'. The dispatch was accepted, so the bump itself is what failed: https://github.com/${TAP_REPO}/actions/workflows/bump.yml"
                  exit 1
              fi
              # A run that completed `success` without moving the formula is the
              # silent case this job exists for. It is NOT reported here — the
              # bump commits and pushes after its own checks, so the formula can
              # trail a successful conclusion by seconds. The deadline below is
              # what reports it, and it reports it as what it is.
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "::error::the tap never published ${TAG} — the tap still reports '${published[*]}' after ${BUMP_BUDGET_MINUTES} minutes${conclusion:+, and its bump completed '${conclusion}' without updating all formulas}. The dispatch above was accepted, so the bump itself is what failed: https://github.com/${TAP_REPO}/actions/workflows/bump.yml"
                  exit 1
              fi
              sleep 10
          done

  # THE ZED EXTENSION FOLLOWS EVERY RELEASE TOO, by the same hand-off the tap
  # gets. `neon-law/zed-navigator-lsp` is the dev extension that
  # attaches `navigator-lsp` to Markdown in Zed; its `bump.yml` sets the
  # extension's version to this tag and pushes `v<tag>`, so the two
  # repositories name one version.
  #
  # This carries the version only. The extension resolves `navigator-lsp` from
  # this repository's Releases at runtime, so a Zed user picks up a new server
  # whether or not this job ran — which is why nothing here publishes to Zed's
  # extension registry.
  #
  # The gate is `publishable` and nothing narrower, for the reason
  # `release-homebrew-tap` gives: a narrower gate fails by skipping silently.
  release-zed-extension:
    name: hand the release to the Zed extension
    needs: [release-cli-publish, release-version]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    # Outlasts the confirmation wait below.
    timeout-minutes: 15
    # No `contents: write`. The cross-repository grant is the
    # `ZED_EXTENSION_TOKEN` secret, scoped to `contents: write` on the
    # extension repository alone.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          sparse-checkout: .github/actions/slack-progress
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-zed-extension"
          step: "dispatch the extension bump"
      - name: dispatch the extension bump
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.ZED_EXTENSION_TOKEN }}
          TAG: ${{ needs.release-version.outputs.tag }}
          EXTENSION_REPO: neon-law/zed-navigator-lsp
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
              echo "::error::ZED_EXTENSION_TOKEN is unset — the Zed extension cannot be told about ${TAG}, and its version would stop following Navigator's"
              exit 1
          fi
          gh api --method POST "/repos/${EXTENSION_REPO}/dispatches" \
              -f "event_type=navigator-release" \
              -f "client_payload[tag]=${TAG}"
          echo "dispatched navigator-release ${TAG} to ${EXTENSION_REPO}"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-zed-extension"
          step: "confirm the extension was tagged"
      # An accepted dispatch is not a completed bump — `POST /dispatches`
      # answers 204 the moment the event is queued. The tag is the proof: the
      # extension's bump pushes `v<tag>` only after the shim builds at that
      # version. The repository is public, so the run's own token reads it.
      - name: confirm the extension was tagged
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
          EXTENSION_REPO: neon-law/zed-navigator-lsp
          BUMP_BUDGET_MINUTES: "10"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + BUMP_BUDGET_MINUTES * 60))
          # A read failure looks the same as a tag that has not landed yet, and
          # both are answered by waiting.
          until gh api "/repos/${EXTENSION_REPO}/git/ref/tags/v${TAG}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "::error::the Zed extension never tagged v${TAG} after ${BUMP_BUDGET_MINUTES} minutes. The dispatch was accepted, so its bump is what failed: https://github.com/${EXTENSION_REPO}/actions/workflows/bump.yml"
                  exit 1
              fi
              sleep 10
          done
          echo "the Zed extension is tagged v${TAG}"

  # ---------- Stage 4: post the release report to Slack ----------
  # Sent only after the container images are published. When configured, posts
  # to the #navigator channel via the prod ops incoming webhook
  # (SLACK_WEBHOOK_URL, a GitHub Actions secret) — the same channel and webhook
  # the failure guard below uses. An absent webhook notices and skips; reporting
  # cannot invalidate published bytes. The webhook itself must be pinned to
  # #navigator. This job reports what was published; `release-deploy` below
  # hands the tag to `release-deploy.yml`, which does the rolling.
  #
  # THREE messages, posted in order, because they answer different questions and
  # get read at different times:
  #
  #   1. What was published — the asset manifest. Read once, when the tag lands,
  #      to confirm the shelf holds what it should.
  #   2. How to install the CLI this release cut, per platform.
  #   3. How this tag reaches clients — the `release-deploy.yml` rollout, and
  #      the `ops ship` command with the version already substituted for a
  #      manual roll.
  #
  # The one rule still binds: identifiers and counts, never content — the bodies
  # carry the tag, image names, the run URL, and commands, nothing
  # client-bearing.
  notify:
    name: slack release report
    needs:
      [
        publish-service,
        publish-triggers,
        release-cli-publish,
        release-version,
      ]
    # Tag only (publish is already gated; stated here too so a branch run never
    # posts a deploy report).
    #
    # `release-cli-publish` must SUCCEED rather than being allowed to
    # skip. It cuts the tag and the Release, and
    # `.github/actions/gate` — the gate every Project repository runs —
    # downloads the CLI from that Release. A skipped attach breaks Project CI
    # everywhere while this run reports green, so it is gated on success rather
    # than on not-failure.
    if: >-
      !cancelled()
      && needs.release-version.outputs.publishable == 'true'
      && needs.publish-service.result == 'success'
      && needs.publish-triggers.result == 'success'
      && needs.release-cli-publish.result == 'success'
    runs-on: ubuntu-24.04
    # Two webhook POSTs — should be seconds; cap it so a hung HTTP request
    # can't keep the workflow open.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TAG: ${{ needs.release-version.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AUTOMATION: ${{ vars.DEPLOY_AUTOMATION_ENABLED }}
    # NO CHECKOUT. Every message below is composed from `env` and posted with
    # `curl`, and this job uses no local composite action.
    steps:
      # ---- Message 1 of 3: what this tag published ----
      # The asset manifest. Every name here is a real publish-matrix target in
      # this same workflow; if a matrix entry is added or retired, this list is
      # what tells the channel, so it must be edited alongside it.
      #
      # The brand image is the headline (#864 / #974): the binary is the
      # site, so `neon-server` runs `/app/neon` and cannot be pointed at another
      # legal entity's face by configuration. `navigator-web` is an alias tag
      # built from the same Containerfile as `neon-server` — byte-identical —
      # kept only until #796's ship targets flip the deployed manifests off it.
      - name: post the published-assets manifest to engineering Slack
        timeout-minutes: 90
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              echo "::notice::SLACK_WEBHOOK_URL is unset — skipping the assets manifest"
              exit 0
          fi
          TEXT=":package: *Neon Law Navigator ${TAG} — published assets*

          *Brand host image* (the binary is the site; no runtime flag selects the face)
          • \`neon-server\` — www.neonlaw.com, the firm serving the whole site

          *Service images*
          • \`navigator-web\` — alias tag, byte-identical to \`neon-server\`; retires with #796

          *Scheduled-job images*
          • \`navigator-ops\`, \`navigator-nightly-project-update-trigger\`

          All 12 images were published with the release tag and \`latest\`.

          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          code=$(curl -sS -o /tmp/slack-assets.out -w '%{http_code}' \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
          echo "Slack responded ${code}"
          if [ "${code}" != "200" ]; then
              echo "::error::Slack assets post failed (${code})"
              cat /tmp/slack-assets.out || true
              exit 1
          fi
          echo "Published-assets manifest posted to #navigator"

      # The archives live on this repository's public Release, so these
      # instructions need no other host.
      - name: post tagged CLI installation instructions to engineering Slack
        timeout-minutes: 90
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              echo "::notice::SLACK_WEBHOOK_URL is unset — skipping the CLI installation instructions"
              exit 0
          fi
          # ONE brew line for every published tag, hotfix included. The tap is
          # dispatched for both (see `release-homebrew-tap`), so naming `brew`
          # here resolves to the tag in this heading rather than to whatever the
          # tap last saw. There is no `PRERELEASE` branch to make.
          BREW_LINE="• Apple silicon macOS and x86_64 Linux: \`brew install neon-law/navigator/navigator\` (or \`brew upgrade navigator\` if you already have it). This is the recommended path on a supported Mac — the released binary is unsigned, and Gatekeeper blocks an unsigned Mach-O downloaded through a browser but not one brew fetched with curl."
          TEXT="*CLI installation for ${TAG}*

          ${BREW_LINE}
          • macOS (Apple silicon): download \`navigator-${TAG}-macos.tar.gz\` from the \`${TAG}\` Release at https://github.com/neon-law/navigator/releases, then \`tar -xzf navigator-${TAG}-macos.tar.gz navigator && install -m 0755 navigator /usr/local/bin/navigator && navigator --version\`.
          • Linux: download \`navigator-${TAG}-linux.tar.gz\` from the same Release, then \`tar -xzf navigator-${TAG}-linux.tar.gz navigator && install -m 0755 navigator /usr/local/bin/navigator && navigator --version\`.

          Intel macOS and arm64 Linux have no prebuilt Navigator archive or Homebrew install path.

          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          code=$(curl -sS -o /tmp/slack-cli-install.out -w '%{http_code}' \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
          echo "Slack responded ${code}"
          if [ "${code}" != "200" ]; then
              echo "::error::Slack CLI-install post failed (${code})"
              cat /tmp/slack-cli-install.out || true
              exit 1
          fi
          echo "Tagged CLI-install instructions posted to #navigator"

      # ---- Message 3 of 3: how this build reaches clients ----
      # `release-deploy` below dispatches `release-deploy.yml` while
      # `vars.DEPLOY_AUTOMATION_ENABLED` is `true`; that workflow rolls staging,
      # then production for a stable tag. The manual `ops ship` line is for a
      # recovery or a rehearsal, run from this repository's own checkout, where
      # `deployments/` holds the rows. Row names stay placeholders here:
      # `no_public_source_instructs_a_deployment_by_name` in
      # deploy/src/devx/deployments.rs requires any literal row to exist.
      # Quoted: an unquoted `#` starts a YAML comment.
      - name: "post the ship instructions to #navigator"
        timeout-minutes: 90
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              echo "::notice::SLACK_WEBHOOK_URL is unset — skipping the ship instructions"
              exit 0
          fi
          if [ "${AUTOMATION}" = "true" ]; then
              ROLLOUT="\`release-deploy.yml\` rolls it next: staging first, then production for a stable tag. A prerelease stays on staging."
          else
              ROLLOUT="\`DEPLOY_AUTOMATION_ENABLED\` is not \`true\`, so nothing rolls it automatically. Dispatch it by hand: \`gh workflow run release-deploy.yml --ref main -f tag=${TAG}\`"
          fi
          TEXT=":package: *Neon Law Navigator ${TAG} — images published*

          ${ROLLOUT}

          *To ship by hand*, from a checkout of this repository with \`gcloud auth application-default login\` current:
          \`hudson ops ship --deployment <row> --deployments-dir . --tag ${TAG}\`

          The rows are the directories under \`deployments/\`; roll the \`-stg\` row and look at it before the one clients are on. \`--dry-run\` renders and diffs without applying. Then confirm the roll landed:
          \`curl -fsS https://<host>/version | jq .release\`

          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          code=$(curl -sS -o /tmp/slack-ship.out -w '%{http_code}' \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
          echo "Slack responded ${code}"
          if [ "${code}" != "200" ]; then
              echo "::error::Slack ship-instructions post failed (${code})"
              cat /tmp/slack-ship.out || true
              exit 1
          fi
          echo "Ship instructions posted to #navigator"

  publish-cli-image:
    name: publish the Navigator CLI container
    needs: [release-version, release-tag, release-cli-build-linux, release-deploy-cli-build-linux]
    if: needs.release-version.outputs.publishable == 'true'
    # Standard runner. The image is `FROM scratch` plus the already-built
    # binary, so buildx compiles nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navigator-linux-cli
          path: dist
      # `release-deploy.yml` rolls a release with `hudson ops ship`
      # from this image, so it carries the operator CLI beside `navigator`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hudson-linux
          path: dist
      - name: extract the release CLIs
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir cli-image
          tar -xzf "dist/navigator-${TAG}-linux.tar.gz" -C cli-image navigator
          tar -xzf "dist/hudson-${TAG}-linux.tar.gz" -C cli-image hudson
          printf 'FROM scratch\nCOPY navigator /navigator\nCOPY hudson /hudson\nENTRYPOINT ["/navigator"]\n' > cli-image/Containerfile
      - name: authenticate to Artifact Registry
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: publish and sign CLI image
        id: publish
        env:
          IMAGE_REF: ${{ env.NAVIGATOR_IMAGE_REGISTRY }}/navigator-cli
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx build --platform linux/amd64 --file cli-image/Containerfile \
              --tag "${IMAGE_REF}:${TAG}" --push --metadata-file /tmp/cli-image-metadata.json cli-image \
              >/dev/null && jq -r '.["containerimage.digest"]' /tmp/cli-image-metadata.json)"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign and record CLI image
        env:
          IMAGE_REF: ${{ env.NAVIGATOR_IMAGE_REGISTRY }}/navigator-cli
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          scripts/cosign-sign.sh "${IMAGE_REF}@${IMAGE_DIGEST}"
          jq -n --arg image "navigator-cli" --arg digest "${IMAGE_DIGEST}" '{($image): $digest}' > image-digest.json
      - name: mirror the same digest to public GHCR
        timeout-minutes: 5
        env:
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}/navigator
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.NAVIGATOR_IMAGE_REGISTRY }}/navigator-cli
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin
          target="${GHCR_REGISTRY}/navigator-cli"
          for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --prefer-index=false --tag "${target}:${RELEASE_TAG}" --tag "${target}:latest" "${IMAGE_REF}@${IMAGE_DIGEST}" \
                  && source_digest="$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${IMAGE_DIGEST}" | sha256sum | cut -d' ' -f1)" \
                  && target_digest="$(docker buildx imagetools inspect --raw "${target}:${RELEASE_TAG}" | sha256sum | cut -d' ' -f1)" \
                  && [ "${source_digest}" = "${target_digest}" ] \
                  && cosign sign --yes "${target}@sha256:${target_digest}"; then
                  exit 0
              fi
              sleep "$((attempt * 2))"
          done
          echo "::error::GHCR mirror of ${target}:${RELEASE_TAG} failed after retries"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-navigator-cli
          path: image-digest.json
          if-no-files-found: error

  # ---------- Stage 5: hand the tag to the rollout ----------
  # `release-deploy.yml` rolls staging, then production. It starts from a
  # `workflow_dispatch` this job sends, not from the Release: GitHub starts no
  # workflow from an event `github.token` caused, and the Release exists before
  # the images and archives finish. So this job needs every publish job — both
  # image matrices, every CLI and LSP archive build, and the attach job —
  # and dispatches only once all of them succeeded.
  #
  # `vars.DEPLOY_AUTOMATION_ENABLED` is the on switch for the unattended path.
  # Unset, this job says so and dispatches nothing.
  release-deploy:
    name: dispatch the staging-then-production rollout
    needs:
      [
        release-version,
        publish-service,
        publish-triggers,
        release-cli-build-linux,
        release-cli-build-macos,
        release-cli-publish,
        publish-cli-image,
      ]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
      - name: merge immutable image digest manifest
        id: digest-manifest
        run: |
          set -euo pipefail
          jq -s 'add' "${RUNNER_TEMP}"/image-digests/*/image-digest.json > "${RUNNER_TEMP}/image-digests.json"
          echo "json=$(jq -c . "${RUNNER_TEMP}/image-digests.json")" >> "$GITHUB_OUTPUT"
      - name: dispatch release-deploy.yml for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
          AUTOMATION: ${{ vars.DEPLOY_AUTOMATION_ENABLED }}
          IMAGE_DIGESTS: ${{ steps.digest-manifest.outputs.json }}
        run: |
          set -euo pipefail
          if [ "${AUTOMATION}" != "true" ]; then
              echo "::notice::DEPLOY_AUTOMATION_ENABLED is not 'true' — ${TAG} is published and nothing is dispatched"
              exit 0
          fi
          gh workflow run release-deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag="${TAG}" -f image-digests="${IMAGE_DIGESTS}"
          echo "dispatched release-deploy.yml for ${TAG}"

  # ---------- Failure guard: alert #navigator ----------
  # Fires whenever ANY of release-version / build / integration / the publish-*
  # jobs / the CLI lane / notify fails
  # (failure() is true if any needed job — or its upstream — failed, even when
  # later jobs were skipped as a result; a job that merely skipped is not a
  # failure and does not page). Posts to
  # #navigator via the prod ops incoming webhook (SLACK_WEBHOOK_URL, a GitHub
  # Actions secret) and tags Nick when that webhook is configured —
  # the @-mention is what separates this paging alert from the un-tagged
  # success report above. Like that report: tag + run URL only, never client
  # content.
  #
  # A FAILED ROLLOUT DOES NOT PAGE FROM HERE: `failure()` only sees this run's
  # jobs, and the rollout is its own `release-deploy.yml` run, which pages
  # #navigator itself. A failed dispatch does page from here.
  notify-failure:
    name: slack — alert engineering on failure
    needs:
      [
        release-version,
        build,
        integration,
        cli-glossary,
        release-tag,
        publish-service,
        publish-triggers,
        release-cli-build-linux,
        release-cli-build-macos,
        release-lsp-build-linux,
        release-lsp-build-macos,
        release-deploy-cli-build-linux,
        release-deploy-cli-build-macos,
        release-scorpio-build-linux,
        release-cli-publish,
        release-operator-cli-publish,
        release-homebrew-tap,
        release-zed-extension,
        notify,
        release-deploy,
      ]
    # `main` only: a failed `kind-ci/**` branch iteration is expected churn and
    # must not page engineering.
    #
    # Deliberately NOT gated on release-version's `publishable` output. That job
    # is the one that REJECTS a manifest naming an already-superseded version, so
    # it is among the most likely to fail — and when it does its outputs are
    # empty, so an output-gated guard would stay silent about the very failure it
    # exists to report. That is exactly how the old two-workflow release failed
    # unnoticed for four consecutive nights. Read the trigger ref instead.
    #
    # Reading the ref costs nothing in false positives here, because a merge
    # carrying no version bump has nothing to fail: `release-version` succeeds,
    # reports `publishable=false`, and every other job skips. So any failed
    # `main` run is a real one.
    #
    # This is the automatic Slack signal that a release broke when the optional
    # webhook is configured. GitHub's run conclusion remains the source of truth
    # either way; see docs/gitops.md § "What detects a broken pipeline".
    if: failure() && github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    # A single webhook POST — cap it so a hung request can't keep the run open.
    timeout-minutes: 10
    steps:
      - name: "post failure alert to #navigator"
        timeout-minutes: 90
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_OPS_MENTION: ${{ secrets.SLACK_OPS_MENTION }}
          TAG: ${{ needs.release-version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              echo "::notice::SLACK_WEBHOOK_URL is unset — skipping the failure alert"
              exit 0
          fi
          TEXT=":x: Neon Law Navigator deploy ${TAG} failed — ${SLACK_OPS_MENTION} please investigate.
          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
          echo "Slack responded ${code}"
          # Slack incoming webhooks return 200 with body "ok" on success.
          if [ "${code}" != "200" ]; then
              echo "::error::Slack post failed (${code})"
              cat /tmp/slack.out || true
              exit 1
          fi
          echo "Failure alert posted to #navigator"

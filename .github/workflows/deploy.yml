name: deploy

# The publish flow (see docs/gitops.md "CI/CD workflows"). ONE workflow builds
# the images: a version bump lands on `main`, and this run proves the workspace,
# publishes it to Artifact Registry, creates the release tag, attaches the CLI archives, and
# reports it. In strict order:
#
#   0. release-version — DECIDE whether this commit is a release, by running
#      `navigator release check`. It reads `[workspace.package].version` and
#      compares it against every release tag in the repository, using semver's
#      own ordering. Three answers, and the middle one is the ordinary case:
#
#        - NEWER than every released version → this is a release when THIS
#          commit is the bump: `publishable=true`, and everything below runs.
#          A later merge whose first parent already carried the same unreleased
#          version reports `publishable=false`, so a red release is re-run or
#          bumped past instead of rebuilt by every merge behind it.
#        - EQUAL to the newest → already released. `publishable=false`, and the
#          run ends here in seconds. This is almost every push to `main`.
#        - OLDER than the newest → the job FAILS. A manifest naming a version
#          already superseded is a bad bump or a rebase that resurrected an old
#          one, and publishing it would hand consumers a version they have
#          already moved past.
#
#      THE VERSION IS THE MANIFEST, so the two checks this job used to make are
#      gone — not relaxed, but unsatisfiable-by-construction. There is no
#      tag-equals-manifest comparison because the tag is DERIVED from the
#      manifest, and no provenance check because a push to `main` is the trigger.
#      Between them those were the whole reason `Cargo.toml` once sat at `0.1.0`
#      while tags marched on: a version and a tag were two decisions that had to
#      be made to agree. They are one decision now.
#
#      NOTHING HERE READS A CLOCK. `YY.M.D` remains the naming convention (see
#      the `cut-release` skill), but a bump is authored days before it merges, so
#      a date check could only fail a release for having been reviewed slowly.
#      What the calendar really bought was uniqueness, and comparing against the
#      tags buys that directly. Ordering does the rest: semver ranks a
#      prerelease below its own base, so `26.8.22-hotfix.3` is admissible after
#      `26.8.21` and refused after `26.8.22`, with no rule about which day a
#      hotfix hangs off.
#
#      The version then threads into every image build as the `RELEASE_TAG`
#      build-arg, which each Containerfile turns into a runtime
#      `ENV NAVIGATOR_RELEASE_TAG` that `main.rs` reads — so a running container
#      reports exactly the string its image is tagged with AND the string its
#      own source carries. A `kind-ci/**` branch reports `publishable=false` and
#      stops after integration.
#   1. integration — build the KIND service images, stand up KIND, run the full
#      e2e + interop + browser/accessibility suite against the live cluster.
#   1b. release-tag — create the immutable `YY.M.D` tag at this commit, once
#      integration is green and before anything publishes. THE ORDER IS THE
#      POINT. While a person pushed the tag, the ref existed before a single
#      image was built, so a release that went red spent its name for good and
#      had to be recovered as a hotfix. Creating it here means a failed release
#      costs nothing: re-run the run. This is the only job that writes a Git ref,
#      it creates and never moves one, and the `release-tags` ruleset — which
#      restricts deletion, update, and non-fast-forward with no bypass actor —
#      makes that irreversible the moment it lands.
#   2. publish     — only if integration is green, push all images to Artifact Registry
#      tagged with the release version + `latest`. The service images go
#      through `publish-service` (amd64-only, one native build per image); the
#      CronJob images go through `publish-triggers` (also amd64-only).
#      Prod runs on GKE Autopilot, which schedules on amd64 nodes, so amd64 is
#      the only architecture any image is consumed on.
#   2b. the CLI archives — EVERY publishing run builds a Linux and a macOS
#      `navigator` archive, IN THIS SAME STAGE and behind the same
#      `integration` gate the image publishes carry. Then
#      `release-cli-publish` creates the GitHub Release hanging off the
#      tag `release-tag` created and attaches them. Two jobs hold
#      `contents: write` and neither can MOVE a ref: `release-tag` creates one
#      and `release-cli-publish` creates a Release against it.
#
#      The archives share stage 2 with the images because they share a version.
#      One tag names the Artifact Registry image tags, these two archives,
#      `navigator --version`, and the Release page, and a reader of that version
#      cannot see which of those the e2e suite proved — so every one of them
#      waits for it. Building them earlier also billed runners on releases
#      whose e2e then went red.
#
#      IT IS LOAD-BEARING BEYOND THE HUMAN DOWNLOAD. `.github/actions/gate`
#      — the composite gate EVERY Project repository runs — fetches
#      `navigator-<version>-<platform>` from the Release this job creates. If
#      it stops running, Project CI breaks everywhere with a download 404 and
#      nothing in THIS repository goes red.
#
#      Each archive carries LICENSE, LICENSE-MIT, and LICENSE-APACHE-2 beside
#      the executable: whoever unpacks it holds the binary and not the
#      repository. Dual MIT / Apache-2.0 distributions retain both license
#      texts and applicable attribution notices.
#   3. notify      — when the prod ops incoming webhook is configured, post the
#      publish report to #navigator: what this run published, then the
#      `ops ship` command with the version already substituted. Reporting is
#      advisory; an absent `SLACK_WEBHOOK_URL` notices and skips.
#
# This workflow publishes images and dispatches `release-deploy.yml` only after
# all release assets are ready. The deployment workflow performs staging and
# production rollouts through protected GitHub Environments.
#
# Plus one out-of-band guard: when Slack is configured, `notify-failure` posts
# to #navigator (tagging Nick) whenever ANY stage fails. It carries only the
# version + run URL — the "identifiers and counts, never content" rule binds
# here too. A missing webhook cannot turn one failed release into two failures.
#
# The nightly run builds and verifies main in KIND. Publishing and shipping
# run only for release pushes. See docs/gitops.md "What detects a broken pipeline".
#
# And running underneath every stage: every forward-path step opens with a
# `./.github/actions/slack-progress` post to #navigator, so the channel watches
# the run advance instead of waiting ~45 silent minutes for a verdict, and the
# last line posted names the step a failure died in. Those posts are advisory —
# the action never fails a job over a webhook — and they self-gate on
# publishability, so a `kind-ci/**` branch iteration and an ordinary merge that
# carries no bump both stay silent exactly as the two reports above do. Steps gated on `failure()`/`always()` are post-mortem
# diagnostics rather than progress and are deliberately not narrated;
# `notify-failure` already covers that moment.
#
# THE VERSION IS `[workspace.package].version`, read in job 0 and threaded
# through every build as the `RELEASE_TAG` build-arg. Components are unpadded —
# no leading zeros, which semver requires rather than merely prefers (June is
# `6`, and `26.06.1` is not a version at all).
#
# RECOVERING A FAILED RELEASE (docs/gitops.md § "Recovering a failed release"):
# re-run the failed jobs. WHERE THE RUN DIED DECIDES WHAT THAT COSTS, and the
# tag job is the line. Before it, no ref exists and no artifact was published,
# so a re-run is free and the version keeps its name. After it, the tag is
# immutable — the `release-tags` ruleset forbids moving it — but a re-run
# republishes the same name over itself, and there is nothing to un-publish
# because nothing was deployed: the images either reached the registry or they
# did not. If the SOURCE is wrong, that version is spent: bump past it and merge
# again.

# ONE WAY TO PUBLISH: land a version bump on `main`. Deliberately no second.
#
# A push to main can publish a version bump. Branch iterations and the nightly
# schedule verify KIND through the same build and integration jobs.
#
# The distinction worth holding: "publish an image" and "deploy to a cluster"
# are different powers. Publishing costs a registry push; deploying is what put
# cloud credentials in CI, and it is a human act (`hudson ops ship`).
on:
  push:
    branches:
      # THE PUBLISH PATH. Every merge lands here and `release-version` decides in
      # seconds whether it is a release: almost always it is not, because the
      # workspace version already equals the newest tag, and the run stops.
      #
      # There is deliberately NO tag trigger. A pushed tag was the publish path
      # until the version became the trigger, and keeping it would mean keeping
      # the four validations a bare ref needs — shape, date, manifest equality,
      # and provenance — for a second path nobody uses. The tag this workflow
      # CREATES still matches the `release-tags` ruleset glob
      # (`deploy/src/devx/github_setup.rs`), which is what makes every published
      # version's ref one GitHub refuses to delete or move.
      - main
      # CI-iteration seam, and the ONLY way to prove a change to this file.
      # Pushing a branch named `kind-ci/**` runs ONLY the KIND integration job
      # below — the tag job, the publish-* jobs, notify, and notify-failure are
      # all gated on `publishable`, so a branch run creates no ref, pushes no
      # images, and posts no Slack. Without it, editing this workflow would mean
      # shipping the edit untested. Not a second workflow — same deploy.yml,
      # just an extra trigger on the one job that needs pre-publish iteration.
      - "kind-ci/**"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  # Artifact Registry is the only registry this workflow writes, and it
  # authenticates by federating the run's GitHub OIDC token into the
  # the configured image-publisher identity through Workload Identity — no JSON
  # key, no PAT. `id-token: write` is the whole grant, and it is granted per
  # job rather than here: `publish-service` and `publish-triggers` push images,
  # and no other job in this file has any business minting a cloud credential.
  # The service account holds `roles/artifactregistry.writer` on the one
  # repository. See docs/gitops.md → "Keyless pushes to Artifact Registry".

# There is deliberately no published-asset origin probe (and no `env:` block)
# in this workflow. Every deployment's assets bucket is private and served
# same-origin through the live site's `/assets` proxy, so the only URL that
# can verify publication is the deployment's own public host. That host is
# checked by `ops ship` after a full or image-only roll, once the rollout and
# Restate re-registration have completed; a failed check prevents ship from
# reporting success. The operator upload lane and `ops ship`'s direct
# slide-media NAVIGATOR_ASSETS_BUCKET preflight still catch missing bytes
# before mutation, while the KIND image bakes stubbed placeholders and the
# integration job verifies KIND serves them.

# THE REGISTRY AND ITS PUBLISHER IDENTITY ARE DEPLOYMENT COORDINATES, NOT SOURCE.
# The registry endpoint and image repository path, publisher identity, and
# Workload Identity provider come from repository secrets, never committed values.
# Forks can run CI, while publishing stays disabled unless the configured
# expected repository matches.
env:
  NAVIGATOR_IMAGE_REGISTRY: ${{ secrets.NAVIGATOR_IMAGE_REGISTRY }}
  DEPLOY_EXPECTED_REPOSITORY: ${{ vars.DEPLOY_EXPECTED_REPOSITORY }}

concurrency:
  # Main releases stay serialized while their tag decisions and publication run.
  # Nonpublishing kind-ci branches skip tag lookup and use a separate lane per ref.
  group: ${{ startsWith(github.ref_name, 'kind-ci/') && format('deploy-kind-ci-{0}', github.ref) || github.event_name == 'schedule' && 'deploy-nightly-kind' || 'deploy-release' }}
  cancel-in-progress: false

jobs:
  release-version:
    name: is this commit a release?
    # Standard runner. On ~95% of merges this job downloads a published binary
    # and answers in seconds (0.2 min on every run this month). Its fallback
    # compiles the debug CLI, the same build `ci.yml`'s gate and
    # `quickstart.yml` run on `ubuntu-24.04`.
    runs-on: ubuntu-24.04
    # This job CREATES NOTHING and holds `contents: read`. It reads the merged
    # manifest and the tag list, answers one question, and writes nothing. The
    # ref that names this release is created by `release-tag`, after integration
    # has proved the tree.
    #
    # `actions: read` is the dedup step's requirement, not release-check's: the
    # `permissions:` block below zeroes every scope it does not name, and the
    # dedup step's `gh api .../actions/workflows/deploy.yml/runs` call needs this
    # one to authenticate. Without it every push to `main` 404s here before the
    # release decision ever runs (run 33979407990).
    #
    # A SEPARATE 404, same symptom, was the `-f`/`--paginate` call itself: `gh
    # api` switches to `POST` the moment any `-f` field is given unless
    # `--method GET` is passed explicitly, and a POST to this GET-only endpoint
    # 404s regardless of scope (run 33987946885). The dedup step below passes
    # `--method GET` for exactly that reason.
    permissions:
      contents: read
      actions: read
    outputs:
      # The release version, read out of `[workspace.package].version`. Threaded
      # into every image build as `RELEASE_TAG`, used as the ref `release-tag`
      # creates, and named in the Slack report.
      tag: ${{ steps.version.outputs.tag }}
      # The one place the "is this commit a release?" question is answered.
      # Downstream jobs read this instead of each re-deriving it — an ordinary
      # merge carrying no version bump reports false, as does a `kind-ci/**`
      # branch run. An ordinary merge stops after this job. A `kind-ci/**`
      # branch stops after integration. An unset `DEPLOY_EXPECTED_REPOSITORY`
      # is not a fork: `''` matches no repository, so the AND here is false
      # and the proof jobs must not treat the mismatch as "run CI anyway".
      publishable: ${{ steps.version.outputs.publishable == 'true' && vars.DEPLOY_EXPECTED_REPOSITORY != '' && github.repository == vars.DEPLOY_EXPECTED_REPOSITORY }}
      # Whether this version is a semver prerelease. It gates the one place a
      # prerelease must NOT behave like an ordinary release: the GitHub Release
      # is marked as a prerelease, so GitHub stops reporting it as "Latest
      # release".
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # THE TAGS ARE THE ANCHOR, so the checkout has to carry them. `fetch-depth:
      # 0` fetches the full history and every tag; `release-check` also fetches
      # them itself, so a shallower checkout would still work — but the tree is
      # required regardless. The checker reads THIS commit's
      # `[workspace.package].version`, and the fallback below compiles the CLI
      # out of this tree when no published binary can be had.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          fetch-depth: 0
      # A DUPLICATE PUSH EVENT FOR THIS EXACT COMMIT must not repeat the release
      # decision. `main` has, on rare occasions, been pushed twice for the same
      # `head_sha` — run 33969761074 duplicated 33969761152, both created the
      # same second for commit ba9190a8ba77a8766792b7eb5fefb3e40032bd13 — which
      # is GitHub's own delivery, not this repository's automation. The
      # `deploy-release` concurrency group below only serializes DIFFERENT
      # commits; two runs racing for the identical sha can both read the tag
      # list before either has tagged, and both conclude "releasable". Refusing
      # here, before the checker or the compile, is what stops the second run
      # from spending a full build and KIND integration proving a release the
      # first run is already proving. A legitimate "re-run failed jobs" reuses
      # this SAME run rather than creating a new one, so it is never caught by
      # this check.
      - name: refuse a duplicate trigger for this commit
        timeout-minutes: 90
        id: dedup
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          other="$(gh api --method GET "/repos/${REPO}/actions/workflows/deploy.yml/runs" \
              -f head_sha="${GITHUB_SHA}" -f event=push --paginate \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length")"
          if [ "${other}" -gt 0 ]; then
              echo "::notice::${other} other 'deploy' run(s) already target ${GITHUB_SHA}; refusing this duplicate trigger"
              echo "duplicate=true" >> "$GITHUB_OUTPUT"
          else
              echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi
      # ANSWER THE QUESTION WITH A PUBLISHED BINARY RATHER THAN A COMPILE.
      #
      # This job reads one TOML field, compares it against the tag list, and on
      # ~95% of merges answers "no" and skips every downstream job. Compiling
      # the CLI to do that cost 7m54s of pure latency on every merge to `main`
      # (run 32531667235). The published Linux archive is the same code, already
      # built, and unpacks in seconds.
      #
      # NOT A CACHE STEP. Actions caches are scoped per ref and the merge gate
      # runs only on pull requests, so this `main` run cannot read the gate's
      # entry and would write its own into the shared 10 GB Actions quota — the
      # contention that starved the gate's Rust cache before.
      #
      # THE BOOTSTRAP CAVEAT, accepted deliberately: the checker is release
      # N-1's, so a change to `navigator release check` itself governs from the
      # release AFTER the one that lands it. That is tolerable because the
      # decision is a comparison of the manifest against the tags, both of which
      # this run supplies — the binary carries the rule, not the data. `ci.yml`
      # runs the in-tree `navigator release check` on every pull request, so a change
      # to the rule is still proved on the branch that makes it.
      #
      # A change to the COMMAND'S SHAPE (not just its rule) is the sharper case:
      # release N-1's binary may not even parse `navigator release check` — a CLI
      # hierarchy refactor can rename or renest it mid-cycle, same as any other
      # subcommand. The probe below catches that before trusting the binary,
      # and reports `ready=false` so the fallback below compiles the current
      # shape from source instead of handing the job an "unrecognized
      # subcommand" crash.
      #
      # `/releases/latest` is NOT used: it excludes prereleases, every release
      # here is one (`YY.M.D-hotfix.N` carries a semver pre-release segment),
      # and it answers 404. Take the newest release that actually carries the
      # archive instead — a tag whose release assets never uploaded is skipped
      # rather than being read as "no checker".
      - name: install the release-check binary
        timeout-minutes: 90
        id: checker
        # A `kind-ci/**` branch iteration answers `publishable=false` from its
        # ref name without consulting a checker at all, so it fetches nothing.
        # A duplicate trigger for this commit answers `publishable=false` too,
        # from the `dedup` step above, without installing anything.
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.dedup.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # EVERY OUTPUT THE JOBS BELOW READ, named once, space separated.
          # `cli/tests/deploy_workflow.rs` holds this list and the
          # `release-version` job's own `outputs:` block to the same set, so a
          # new output cannot be consumed without being probed for.
          RELEASE_OUTPUTS: "tag publishable prerelease"
        run: |
          set -euo pipefail
          tag="$(gh api "/repos/${REPO}/releases?per_page=20" --jq '
              map(select(.draft | not))
              | map(select([.assets[].name] | any(endswith("-linux.tar.gz"))))
              | first | .tag_name // empty
          ')"
          if [ -z "${tag}" ]; then
              echo "::notice::no published release carries a Linux CLI archive; building the checker from source"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          tmp="$(mktemp -d)"
          # Prefer the Navigator archive. Older releases may carry only a
          # Hudson archive; that binary fails the command probe and the current
          # Navigator CLI is built from source below.
          asset=""
          for bin in navigator hudson navigator-deploy; do
              if gh release download "${tag}" --repo "${REPO}" \
                  --pattern "${bin}-${tag}-linux.tar.gz" --dir "${tmp}" --clobber; then
                  asset="${bin}-${tag}-linux.tar.gz"
                  break
              fi
          done
          if [ -z "${asset}" ]; then
              echo "::notice::${tag} carries no operator CLI archive; building the checker from source"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          tar -xzf "${tmp}/${asset}" -C "${tmp}" "${bin}"
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
          echo "${bin} ${tag} installed: $("${RUNNER_TEMP}/navigator-bin/navigator" --version)"
          if ! "${RUNNER_TEMP}/navigator-bin/navigator" release check --help >/dev/null 2>&1; then
              echo "::notice::navigator ${tag} does not recognize this commit's 'navigator release check' invocation; building the checker from source"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # AND IT MUST WRITE EVERY OUTPUT THE JOBS BELOW READ. `--help` proves
          # the command still parses; it says nothing about the KEYS the step
          # after this one writes, and a key that never gets written is an error
          # nowhere: `needs.release-version.outputs.<name>` for an unwritten key
          # is the empty string, so a downstream `== 'true'` gate reads false
          # and the job it guards SKIPS on a green run.
          #
          # THAT IS NOT HYPOTHETICAL, and it is why this costs a second
          # invocation. `tap_follows` was added on 2026-09-02. `26.9.3` released
          # the next day and the newest release carrying a Linux archive — the
          # binary selected above — was `26.9.2`, which predated the output. The
          # Homebrew hand-off skipped, `brew install` served a version two
          # releases behind for a day, and every job in that run was green. The
          # checker is one release behind the tree BY DESIGN, so this is the
          # normal case for any output the tree adds, not an unlucky one.
          #
          # A NON-ZERO EXIT IS NOT READ AS A VERDICT HERE. `navigator release check`
          # also exits non-zero on a version that REGRESSES below one already
          # published, which must fail the release rather than this probe — so
          # that outcome falls back to the source build, which reaches the same
          # conclusion and fails there, where the message belongs. Output goes
          # to a scratch file rather than `$GITHUB_OUTPUT`: this is a probe, and
          # the step below is what publishes the answer.
          probe="$(mktemp)"
          if ! GITHUB_OUTPUT="${probe}" \
              "${RUNNER_TEMP}/navigator-bin/navigator" release check \
              --github-output --no-fetch >/dev/null 2>&1; then
              echo "::notice::navigator ${tag} could not answer the release question; building the checker from source"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          for key in ${RELEASE_OUTPUTS}; do
              if grep -Eq "^${key}=" "${probe}"; then
                  continue
              fi
              echo "::notice::navigator ${tag} writes no '${key}' output, which the jobs below read; building the checker from source"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
          done

          echo "ready=true" >> "$GITHUB_OUTPUT"
      # THE FALLBACK, and the reason this job still knows how to compile. A
      # release lost because the release API blipped is the exact failure this
      # pipeline has already paid for once, so an unavailable binary falls back
      # to the source of truth in this tree rather than failing the run or —
      # far worse — answering "not a release" by default. It costs the compile
      # only when it actually fires.
      - name: install rust toolchain
        timeout-minutes: 90
        if: >-
          github.event_name == 'push' && github.ref_name == 'main' && steps.dedup.outputs.duplicate != 'true'
          && steps.checker.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      # THE WHOLE RELEASE DECISION, in one step so the job has one place to read
      # its outputs from. `navigator release check` reads
      # `[workspace.package].version`, lists every release tag, and compares them
      # with semver's own ordering — see `deploy/src/release_check.rs` for why the
      # tags are the anchor rather than the previous commit's manifest.
      #
      # It writes `tag`, `publishable`, and `prerelease` to `$GITHUB_OUTPUT`, and
      # it FAILS THE JOB when the manifest names a version OLDER than one already
      # released. That is the one failure re-running cannot fix, and it is caught
      # before any image is built: `ci.yml` runs the same command on every pull
      # request, so a bad bump is normally refused while it is still a branch.
      #
      # Nothing here validates a date. `YY.M.D` is the convention the
      # `cut-release` skill documents; the pipeline's only rule is that a release
      # is newer than every release before it.
      #
      # A `kind-ci/**` branch iteration never asks the question. It exists to
      # prove a change to THIS FILE, its branch name is not a version, and it
      # reports `publishable=false` — with the ref name standing in for a version
      # so progress, job titles and ephemeral image metadata name the tested ref.
      # Every publishing job remains gated on `publishable`.
      - name: is this commit a release?
        timeout-minutes: 90
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CHECKER_READY: ${{ steps.checker.outputs.ready }}
          DUPLICATE: ${{ steps.dedup.outputs.duplicate }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${REF_NAME}" != "main" ]; then
              {
                  echo "tag=${REF_NAME}"
                  echo "publishable=false"
                  echo "prerelease=false"
              } >> "$GITHUB_OUTPUT"
              echo "${EVENT_NAME} on ${REF_NAME}: KIND integration"
              exit 0
          fi

          if [ "${DUPLICATE}" = "true" ]; then
              {
                  echo "tag=${GITHUB_SHA}"
                  echo "publishable=false"
                  echo "prerelease=false"
              } >> "$GITHUB_OUTPUT"
              echo "another 'deploy' run already targets ${GITHUB_SHA}: this duplicate trigger will not repeat the release decision"
              exit 0
          fi

          decision="$(mktemp)"
          real_output="${GITHUB_OUTPUT}"
          export GITHUB_OUTPUT="${decision}"
          if [ "${CHECKER_READY}" = "true" ]; then
              navigator release check --github-output
          else
              cargo run --locked -p cli --quiet -- release check --github-output
          fi
          export GITHUB_OUTPUT="${real_output}"

          # ONLY THE COMMIT THAT BUMPED THE VERSION PUBLISHES IT. An unreleased
          # version stays unreleased while its KIND gate is red, and every later
          # merge used to read it as a release, rebuilding every image and
          # rerunning the suite. 26.11.18 and 26.11.19-rc.1 cost about 25
          # neon-server builds that way. When the first parent already carried
          # this version, the merge is not the bump. Recover by re-running the
          # bump commit's run, or fix forward with a new version.
          version="$(sed -n 's/^tag=//p' "${decision}")"
          parent="$(git show HEAD^1:Cargo.toml 2>/dev/null | awk '
              /^\[workspace\.package\]/ { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' || true)"
          if grep -qx 'publishable=true' "${decision}" && [ -n "${parent}" ] && [ "${parent}" = "${version}" ]; then
              echo "::notice::${version} was bumped by an earlier commit; this merge is not the bump and will not publish. Re-run that commit's deploy run or bump to a new version"
              sed 's/^publishable=true$/publishable=false/' "${decision}" >> "$GITHUB_OUTPUT"
          else
              cat "${decision}" >> "$GITHUB_OUTPUT"
          fi
      # AN UNSET PUBLISHER VARIABLE MUST NOT LOOK LIKE A FORK. `github.repository
      # != vars.DEPLOY_EXPECTED_REPOSITORY` is true for every repository when
      # the variable is empty. Fail here, in seconds, naming the missing
      # variable or secret, instead of running the suite and skipping the tag.
      - name: refuse a release that cannot publish
        timeout-minutes: 5
        if: steps.version.outputs.publishable == 'true'
        env:
          EXPECTED_REPOSITORY: ${{ vars.DEPLOY_EXPECTED_REPOSITORY }}
          IMAGE_REGISTRY: ${{ secrets.NAVIGATOR_IMAGE_REGISTRY }}
          REGISTRY_HOST: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          PUBLISHER_SA: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          PUBLISHER_WIF: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_REPOSITORY}" ]; then
              echo "::error::DEPLOY_EXPECTED_REPOSITORY is unset. This commit is a release, but the job's publishable output stays false when the variable is empty, so tag and publish skip after the suite. Set the repository variable to this repository's owner/name — see docs/release-automation.md."
              exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]; then
              echo "::notice::${GITHUB_REPOSITORY} is not ${EXPECTED_REPOSITORY} — this run will not publish"
              exit 0
          fi
          missing=()
          [ -z "${IMAGE_REGISTRY}" ] && missing+=(NAVIGATOR_IMAGE_REGISTRY)
          [ -z "${REGISTRY_HOST}" ] && missing+=(NAVIGATOR_REGISTRY_HOST)
          [ -z "${PUBLISHER_SA}" ] && missing+=(NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT)
          [ -z "${PUBLISHER_WIF}" ] && missing+=(NAVIGATOR_PUBLISHER_WIF_PROVIDER)
          if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::this commit is a release but ${missing[*]} is unset — refusing to run the suite for a publish that cannot succeed. Set the repository secrets documented in docs/release-automation.md."
              exit 1
          fi
      # THE FIRST LINE #navigator SEES, and it comes after the decision rather
      # than before it. Every merge to `main` starts this workflow, so a post
      # ahead of the answer would narrate the ~95% of merges that publish
      # nothing — two lines each, for a release that is not happening. The
      # narration opens once there is a release to narrate.
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.version.outputs.publishable == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: ${{ steps.version.outputs.tag }}
          stage: "release-version"
          step: "this commit is a release — building"

  # ---------- Stage 0: build both service images in parallel ----------
  # Each image cold-compiles the whole Rust workspace. Building them as a
  # parallel matrix here — instead of sequential `docker build` steps inside
  # `integration` — overlaps those compiles so the wall-clock is ~one build,
  # not three. It also stops `integration` from spending most of its budget
  # building before it can even start the e2e suite (itself only ~6 min),
  # keeping that job under its own 60-min cap even on a cold cache.
  #
  # Each image is built locally under an ephemeral, per-run tag, saved to a
  # tarball, and uploaded as a workflow artifact that `integration` downloads
  # and loads into KIND. These per-commit CI images are NEVER pushed to any
  # registry — they never leave the run, so no registry auth is needed here.
  build:
    name: build ${{ matrix.image }}
    needs: release-version
    # WORK ONLY WHEN THERE IS A RELEASE TO PROVE. Every merge to `main` starts
    # this workflow, and almost none of them carry a version bump — so without
    # this gate an ordinary merge would build the image matrix and run the
    # whole KIND suite to publish nothing. `release-version` answers in seconds
    # and the run stops there.
    #
    # The `kind-ci/**` leg is the exception that has to be spelled out: a branch
    # iteration reports `publishable=false` by design, and building and proving
    # the images is the ENTIRE point of that trigger. It is the only way to test
    # a change to this file.
    #
    # A fork is the other exception, and only when the expected repository is
    # actually configured. An empty variable is true for `!=` against every
    # `github.repository`, so the fork clause must require the variable to be
    # set or every merge to `main` runs this matrix and still publishes nothing.
    if: >-
      needs.release-version.outputs.publishable == 'true'
      || github.event_name == 'schedule'
      || startsWith(github.ref_name, 'kind-ci/')
      || (vars.DEPLOY_EXPECTED_REPOSITORY != '' && github.repository != vars.DEPLOY_EXPECTED_REPOSITORY)
    # Each leg uses the Blacksmith capacity declared below. Runner capacity and disk
    # sizing are selected for the Rust and image-build workload; the small
    # `ubuntu-latest` disk ran out before rustup finished.
    runs-on: ${{ matrix.runner }}
    # Cold workspace compile; cap so a stuck build can't hang the run.
    #
    # 90 and not 45: `neon-server` is the long pole, measured at 24m
    # (warm, main) and 32m (warm, tag) on a hosted runner, and a cold
    # `kind-ci/**` branch build ran straight through the old 45-minute cap
    # (run 30393950030, killed at 45m32s). That kill cost the entire run:
    # `fail-fast` skipped `integration`, so the job the branch existed to
    # exercise never started, and dying mid-step also lost both cache
    # exports — `Post cache cargo` skipped and buildx never reached its
    # `cache-to` — so a retry would have begun just as cold and hit the
    # same wall.
    #
    # The cap is a wedge detector, not a duration budget. A genuinely
    # stuck build hangs forever and is caught just as surely at 90 as at
    # 45, only later; a merely slow cold build now finishes instead of
    # being thrown away. Over-provisioning costs wall-clock solely on runs
    # that were already failing, so the asymmetry favors the larger number.
    # 150 since deploy run 44385191458: the neon-server image finished at
    # 1h29m and died saving it, one minute short of a 90-minute cap.
    timeout-minutes: 150
    strategy:
      # One red build means the e2e can't run — stop the sibling too.
      fail-fast: true
      matrix:
        include:
          # The brand image every deployment actually rolls, and the only
          # Rust-workspace compile in this matrix.
          #
          # `alias` is what `navigator-web` costs now: a second TAG on this
          # leg's image rather than a second leg. The deployed GKE manifests
          # still pull `navigator-web` (see `k8s/base/web/web.yaml`) and flip to
          # `neon-server` with #796's ship targets, and both names have always
          # come from this one Containerfile — so the alias leg was paying a
          # second ~26-minute metered build for bytes it already had. Measured
          # across five days: 263 min of `navigator-web` beside 272 min of
          # `neon-server`, half of this workflow's whole runner bill, for an
          # image that was identical by coincidence rather than by
          # construction. It is identical by construction now.
          #
          # `publish` already made exactly this move for the same pair; see the
          # `alias` note in its matrix.
          #
          # The full application release build requires the larger runner's
          # memory; the four-vCPU runner exhausts memory compiling portal.
          - image: neon-server
            dockerfile: images/Containerfile.neon
            alias: navigator-web
            runner: blacksmith-8vcpu-ubuntu-2404
          #
          # `ci_cache_scope` is deliberately absent from the `neon-server` leg
          # above, and that absence is what keeps this matrix off the Actions
          # cache quota. The key names the scope a leg exports for
          # `publish-service` to read back, and `publish-service` gives
          # `neon-server` no scope on purpose: the `stub public assets for KIND
          # public-host images` step rewrites `server/public` and
          # `.dockerignore`, and `COPY server server` sits above `RUN cargo
          # build`, so the two jobs feed the builder stage different inputs and
          # a lookup could only miss. An export nothing reads is pure quota, and
          # `neon-server` is the expensive one — measured at 3.78 GB of
          # `mode=max` blobs in run 32487939326, 38% of the whole 10 GB
          # repository quota on its own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        timeout-minutes: 90
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "install rust toolchain"
      # `web/public/img/` is gitignored and excluded from normal Docker
      # builds, so the ephemeral KIND image gets generated placeholders at
      # the same paths after the real public GCS origin has been verified.
      # Production still serves images from GCS at runtime.
      #
      # This covers both public-host tags the KIND browser gate serves,
      # because they are now one image: `navigator-web` is an alias tag of the
      # `neon-server` build below. Without the stubs its content-image
      # assertions find the references but only 404 responses at their paths.
      - name: install rust toolchain
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "cache cargo"
      # First-party `actions/cache`: it ships with the runner and needs no
      # GitHub token, so nothing here reaches api.github.com with an
      # enterprise-issued credential.
      - name: cache cargo
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "stub public assets for KIND public-host images"
      - name: stub public assets for KIND public-host images
        timeout-minutes: 90
        if: matrix.image == 'neon-server'
        run: |
          set -euo pipefail
          cargo run -p hudson --quiet -- ops assets stub-referenced --out server/public
          grep -vxF -e 'server/public/img/' \
            -e 'server/public/fonts/gorp-serif/*.woff2' \
            .dockerignore > /tmp/navigator-dockerignore
          mv /tmp/navigator-dockerignore .dockerignore
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "build and load (ephemeral CI tag)"
      - name: build and load (ephemeral CI tag)
        timeout-minutes: 90
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Load into the runner's local docker rather than push to a registry:
          # the per-commit CI image is saved to a tarball and handed to
          # `integration` as a workflow artifact, so it never leaves the run.
          load: true
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          # Bind ephemeral exact-image acceptance to this same source commit.
          build-args: |
            ${{ matrix.image == 'neon-server' && format('RELEASE_TAG={0}', needs.release-version.outputs.tag) || '' }}
            ${{ matrix.image == 'neon-server' && format('GIT_SHA={0}', github.sha) || '' }}
          # EXPORT ONLY WHAT `publish-service` READS BACK. `matrix.ci_cache_scope`
          # is set on exactly the legs whose scope `publish-service` lists as a
          # second `cache-from`, so this export is compiled once per release
          # rather than once here and again there. Where the key is absent — the
          # `neon-server` leg — both lines resolve empty and this leg touches the
          # Actions cache not at all.
          #
          # THE ABSENT LEG IS THE WHOLE POINT. `mode=max` exports every
          # intermediate stage, which for a Rust builder stage is the entire
          # `target` directory, and the 10 GB Actions cache quota is shared with
          # every other cache in the repository. Measured from run 32487939326 by
          # joining each leg's exported layer digests against the cache listing:
          #
          #   neon-server                   3.78 GB   read by nothing
          #   navigator-workflows-service   1.81 GB   read by publish-service
          #
          # Exporting both service caches left no room for `ci.yml`'s ~1.7 GB Rust
          # dependency cache: it uploaded successfully at the end of a `main` run
          # and was evicted before the next PR could restore it, so the gate
          # logged `No cache found.` every time. Dropping the one export with no
          # reader is what buys that back, and it costs nothing — `publish-service`
          # cannot use it, and this job's own `cache-from` could only hit it when
          # nothing under `server/` changed since the previous release.
          #
          # This job stays on the Actions cache rather than moving to Artifact
          # Registry alongside `publish-service`: it holds no registry
          # credentials (no `id-token: write`, no WIF step — see this job's
          # `permissions`, which inherit the workflow's bare `contents: read`)
          # and must not gain any, because its `if:` also admits `kind-ci/**`
          # branch pushes, which no review gates. Reading and writing the
          # Actions cache needs only the runner's own token.
          cache-from: ${{ matrix.ci_cache_scope != '' && format('type=gha,scope={0}', matrix.ci_cache_scope) || '' }}
          # ignore-error: the image is already loaded before the cache export
          # runs, so a `not_found` from the GHA cache backend (a known
          # intermittent failure on `mode=max` exports) must never fail an
          # otherwise-successful build. A missed export only makes the next
          # build colder.
          cache-to: ${{ matrix.ci_cache_scope != '' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.ci_cache_scope) || '' }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "save image tarball"
      # The alias is a `docker tag` over the image this leg just built, not a
      # second build. `integration` loads one tar per image name and retags it
      # to `:dev`, so both names keep arriving in exactly the shape its
      # `for img in ...` loop already expects.
      #
      # In one step rather than three, because `build` is a narrated job:
      # `cli/tests/deploy_slack_progress.rs` requires a #navigator post
      # immediately before every named step, and the alias work does not need
      # three lines in Slack to say what one says.
      - name: save image tarball
        timeout-minutes: 90
        run: |
          set -euo pipefail
          docker save "${{ matrix.image }}:ci-${{ github.sha }}" -o "/tmp/${{ matrix.image }}.tar"
          alias_image="${{ matrix.alias }}"
          if [ -n "${alias_image}" ]; then
              docker tag "${{ matrix.image }}:ci-${{ github.sha }}" "${alias_image}:ci-${{ github.sha }}"
              docker save "${alias_image}:ci-${{ github.sha }}" -o "/tmp/${alias_image}.tar"
              echo "saved ${alias_image} as an alias tag of ${{ matrix.image }}"
          fi
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "upload image artifact"
      - name: upload image artifact
        timeout-minutes: 90
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          retention-days: 1
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.alias != ''
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "build ${{ matrix.image }}"
          step: "upload alias image artifact"
      # Keep a separate alias artifact so integration can load both named
      # image tags and verify that they identify the same image bytes.
      - name: upload alias image artifact
        timeout-minutes: 90
        if: matrix.alias != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-${{ matrix.alias }}
          path: /tmp/${{ matrix.alias }}.tar
          retention-days: 1

  # The lean CLI reads the checked-in glossary without a database fixture.
  # Keep this smoke test on a free public GitHub runner.
  cli-glossary:
    name: CLI glossary (no database)
    needs: [release-version]
    if: >-
      needs.release-version.outputs.publishable == 'true'
      || github.event_name == 'schedule'
      || startsWith(github.ref_name, 'kind-ci/')
      || (vars.DEPLOY_EXPECTED_REPOSITORY != '' && github.repository != vars.DEPLOY_EXPECTED_REPOSITORY)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - name: verify the CLI glossary without SurrealDB
        run: cargo run -p cli --locked --quiet -- glossary show Jurisdiction

  # ---------- Stage 1: KIND end-to-end integration ----------
  integration:
    name: KIND integration (tag ${{ needs.release-version.outputs.tag }})
    needs: [build, release-version]
    # WORK ONLY WHEN THERE IS A RELEASE TO PROVE. Every merge to `main` starts
    # this workflow, and almost none of them carry a version bump — so without
    # this gate an ordinary merge would build the image matrix and run the
    # whole KIND suite to publish nothing. `release-version` answers in seconds
    # and the run stops there.
    #
    # The `kind-ci/**` leg is the exception that has to be spelled out: a branch
    # iteration reports `publishable=false` by design, and building and proving
    # the images is the ENTIRE point of that trigger. It is the only way to test
    # a change to this file. Same empty-variable rule as `build`: a missing
    # publisher coordinate is not a fork.
    if: >-
      needs.release-version.outputs.publishable == 'true'
      || github.event_name == 'schedule'
      || startsWith(github.ref_name, 'kind-ci/')
      || (vars.DEPLOY_EXPECTED_REPOSITORY != '' && github.repository != vars.DEPLOY_EXPECTED_REPOSITORY)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_IMAGE_RELEASE: ${{ needs.release-version.outputs.tag }}
      CHROME_FOR_TESTING_VERSION: 150.0.7871.46
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.0
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "install pinned KIND"
      - name: install pinned KIND
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate-cli
          save-if: false
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "install pinned Nextest"
      - name: install pinned Nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.140
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "install pinned Dioxus CLI"
      - name: Install pinned Dioxus CLI
        run: |
          tools="$(mktemp -d "$RUNNER_TEMP/navigator-dx-0.7.10.XXXXXX")"
          trap 'rm -f "$tools/dx.tar.gz"' EXIT
          curl --fail --show-error --silent --location --retry 5 --retry-delay 2 --retry-all-errors \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            --output "$tools/dx.tar.gz"
          echo '4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7'"  $tools/dx.tar.gz" | sha256sum --check --strict
          python3 - "$tools" <<'PYTHON'
          import pathlib, sys, tarfile
          tools = pathlib.Path(sys.argv[1])
          with tarfile.open(tools / 'dx.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              if len(members) != 1 or members[0].name != 'dx' or not members[0].isfile():
                  raise SystemExit('unexpected Dioxus CLI archive layout')
              with (tools / 'dx').open('xb') as binary:
                  binary.write(archive.extractfile(members[0]).read())
          (tools / 'dx').chmod(0o700)
          PYTHON
          version="$("$tools/dx" --version)"
          test "${version%% (*}" = 'dioxus 0.7.10'
          "$tools/dx" build --help > "$tools/build-help.txt"
          grep -Fq -- '--force-sequential' "$tools/build-help.txt"
          echo "$version"
          sha256sum "$tools/dx"
          echo "$tools" >> "$GITHUB_PATH"
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "build current operator"
      - name: build current operator
        run: |
          df -h / /var/lib/docker
          cargo build --locked -p hudson --bin hudson --quiet
          df -h / /var/lib/docker
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "download web alias image"
      - name: download web alias image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image-navigator-web
          path: /tmp/ci-images
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "download exact Neon image"
      - name: download exact Neon image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image-neon-server
          path: /tmp/ci-images
      - uses: ./.github/actions/slack-progress
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "integration"
          step: "native KIND browser and exact image gate"
      - name: native KIND browser and exact image gate
        run: bash .github/scripts/native-browser-integration.sh
      - name: upload E2E JUnit + diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            target/nextest/ci/junit.xml
            /tmp/navigator-native-browser/quickstart.log
            /tmp/navigator-native-browser/browser.log
            /tmp/navigator-native-browser/native-smoke.log
            /tmp/navigator-native-browser/image.log
            /tmp/navigator-native-browser/image-assets.log
            /tmp/navigator-native-browser/fixture.log
            /tmp/navigator-native-browser/fixture-schema.log
            /tmp/navigator-native-browser/volume-init.log
            /tmp/navigator-native-browser/workloads.log
            /tmp/navigator-native-browser/events.log
            /tmp/navigator-native-browser/pods.log
            /tmp/navigator-native-browser/forwards.log
            /tmp/navigator-native-browser/cleanup.log
            /tmp/navigator-native-browser/resources.log
            /tmp/navigator-native-browser/image-id.txt
            /tmp/navigator-native-browser/container-id.txt
            /tmp/navigator-native-browser/repository-volume.txt
            /tmp/navigator-native-browser/version.json
            /tmp/navigator-screenshots/
          if-no-files-found: ignore

  # ---------- Stage 2: publish every image to Artifact Registry ----------
  # Only runs if integration is green. Publishes the service images — the
  # per-brand hosts (neon-server, neon-server) and
  # navigator-workflows-service, plus the navigator-web alias tag that
  # `neon-server`'s leg points at its own manifest — plus the
  # six CronJob images — all to Artifact Registry under the immutable release tag
  # with the release date + `latest`, so prod pulls every image from one
  # registry fed by CI.
  #
  # Every image is amd64-only. Production runs on GKE Autopilot, which schedules
  # workloads on x86/amd64 nodes (no manifest sets an `arm64` nodeSelector), so
  # a single native amd64 build per image is all prod consumes — no multi-arch
  # manifest list and no arm64 leg under emulation. Demos live on the staging
  # website rather than an Apple-Silicon KIND cluster, so nothing needs a native
  # arm64 pull either.
  # ---------- Stage 1b: create the ref that names this release ----------
  # THE ORDER OF THIS JOB IS THE WHOLE POINT. The tag is immutable the moment it
  # exists — the `release-tags` ruleset restricts deletion, update, and
  # non-fast-forward with no bypass actor — so WHEN it is created decides what a
  # failed release costs.
  #
  # While a person pushed the tag, it existed before a single image was built. A
  # release that then went red had already spent its name, and recovering meant
  # cutting a hotfix under a different version. Creating it here, after
  # `integration` has proved the tree and before anything publishes, means a
  # failure above this line costs nothing but a re-run.
  #
  # It is idempotent by design, because `deploy.yml` must survive being re-run.
  # A tag already pointing at this commit is this run's own tag: the job says so
  # and succeeds. A tag pointing at a DIFFERENT commit is refused rather than
  # forced — that would be someone else's release wearing this version, and the
  # ruleset would refuse the push anyway. `release-check` complements this from
  # the other side: it reports a version whose tag already names this commit as
  # publishable, so re-running the whole workflow republishes instead of
  # skipping every job and reporting success for having done nothing.
  # THE GATE. `release-tag` needs `integration` (the KIND e2e suite,
  # transitively covering both `build` matrix legs) directly rather than
  # through a rubber-stamp job in between, so a failure shows up on
  # `release-tag` itself instead of one hop away.
  release-tag:
    name: tag ${{ needs.release-version.outputs.tag }}
    needs: [integration, cli-glossary, release-version]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    # THE ONLY JOB IN THIS FILE THAT WRITES A GIT REF, and it only ever creates
    # one. `release-cli-publish` also holds `contents: write`, to create
    # the GitHub Release that hangs off this tag. Nothing here can move a ref:
    # the ruleset forbids it, and `git push --force` is not what this does.
    permissions:
      contents: write
    steps:
      # The local `slack-progress` composite action lives in this tree, so it
      # cannot be used before a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: ${{ needs.release-version.outputs.tag }}
          stage: "release-tag"
          step: "create the release tag"
      - name: create the release tag
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-version.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `gh api` exits nonzero on a 404, which is the ORDINARY case here: the
          # tag does not exist yet. Anything else — a rate limit, a network blip —
          # must not be read as "no tag", because that reading walks straight into
          # the create below. So the two are told apart rather than both swallowed.
          status=0
          body="$(gh api "/repos/${REPO}/git/ref/tags/${TAG}" 2>/tmp/ref-read.err)" || status=$?
          if [ "${status}" -eq 0 ]; then
              existing="$(jq -r '.object.sha' <<< "${body}")"
          elif grep -q 'Not Found' /tmp/ref-read.err; then
              existing=""
          else
              echo "::error::could not read refs/tags/${TAG}: $(tr '\n' ' ' < /tmp/ref-read.err). Refusing to create a tag without knowing whether one already exists"
              exit 1
          fi

          if [ -n "${existing}" ]; then
              if [ "${existing}" = "${SHA}" ]; then
                  echo "tag ${TAG} already names ${SHA}: this run's own tag, so this is a re-run"
                  exit 0
              fi
              echo "::error::tag ${TAG} already exists and names ${existing}, not this run's commit ${SHA}. A release tag cannot be moved, so this version belongs to that commit: bump [workspace.package].version past ${TAG} and merge again"
              exit 1
          fi

          # A refused create is retried, and its response is printed: 26.10.15 died
          # on a bare "403 Resource not accessible by integration" that named no
          # cause, and the run had already proved the tree, so a blip must not
          # cost a release. A retry that finds the tag already at this commit
          # (the first POST landed but its reply was lost) counts as created.
          for attempt in 1 2 3 4; do
              if gh api --include --method POST "/repos/${REPO}/git/refs" \
                  -f "ref=refs/tags/${TAG}" \
                  -f "sha=${SHA}" > /tmp/ref-create.out 2>&1; then
                  echo "created refs/tags/${TAG} at ${SHA}"
                  exit 0
              fi
              echo "::warning::attempt ${attempt} to create refs/tags/${TAG} was refused: $(tr '\n' ' ' < /tmp/ref-create.out)"
              landed="$(gh api "/repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
              if [ "${landed}" = "${SHA}" ]; then
                  echo "refs/tags/${TAG} names ${SHA}: the earlier attempt landed"
                  exit 0
              fi
              sleep $((attempt * 15))
          done
          echo "::error::could not create refs/tags/${TAG} at ${SHA} after 4 attempts: $(tr '\n' ' ' < /tmp/ref-create.out)"
          exit 1

  publish-service:
    name: publish ${{ matrix.image }} to Artifact Registry
    needs: [integration, release-version, release-tag]
    # Tag only. A `kind-ci/**` branch run stops after integration — it
    # must never push branch-tagged images to the registry.
    if: needs.release-version.outputs.publishable == 'true'
    # Per-image runner, same as `build`: every leg is on Blacksmith.
    runs-on: ${{ matrix.runner }}
    # `contents: read` to check out, `id-token: write` to federate into the
    # publisher service account that pushes. No other scope is needed.
    permissions:
      contents: read
      id-token: write
      packages: write
    # Cold image build + registry push; cap it so a stuck registry/build can't
    # hang the release indefinitely.
    #
    # 90 and not 45, matching `build`. The 45 assumed a warm rebuild reading the
    # `build` stage's cache, and the `neon-server` leg is the one leg that can
    # never be warm — it carries no `ci_cache_scope` on purpose (see its matrix
    # note), so it compiles the whole workspace cold every release. That made 45
    # a ration rather than a wedge detector. The four releases before
    # 26.8.30-rc.1 landed at 44m35s, 42m49s, 44m56s, and 44m12s — one of them
    # four seconds inside the cap — and then run 33256595378 took 45m23s and was
    # killed 37 seconds into the alias step BELOW, after the build had already
    # succeeded and pushed. So `navigator-web:26.8.30-rc.1` was never created,
    # `navigator-web:latest` kept resolving to the previous release's manifest,
    # and the `test "${src}" = "${dst}"` guard that exists to catch exactly that
    # never got to run.
    #
    # A cap this leg finishes inside by seconds detects nothing. Give it the
    # same room `build` has and let the runner below make it fast.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three per-brand host images (#864 / #974). The binary is the
          # site: `neon-server` runs `/app/neon`, so a deployment
          # cannot be pointed at another legal entity's face by configuration.
          # Each isolated deployment selects its matching brand image;
          # every deployment pulls its own.
          # `navigator-web` is an alias tag for this same site brand
          # image: the deployed GKE manifests still pull `navigator-web` (see
          # `k8s/base/web/web.yaml`), and they flip to `neon-server` with #796's
          # ship targets. It was its own matrix leg building the identical
          # Containerfile, which bought a byte-identical image for a second
          # 21-minute large-runner bill every night. `alias` instead points the
          # extra repository at the manifest this leg just pushed, so the two
          # tags are identical by construction rather than by coincidence.
          #
          # Match the CI image build's memory capacity for the same full
          # application release compilation.
          - image: neon-server
            dockerfile: images/Containerfile.neon
            alias: navigator-web
            runner: blacksmith-8vcpu-ubuntu-2404
          # `ci_cache_scope` names the `build`-stage Actions cache this leg may
          # additionally read, so a tag run compiles these crates once instead
          # of twice. Set it only where the two jobs feed the builder stage
          # byte-identical inputs: same image name, same context, and nothing
          # release-specific above `RUN cargo build`. That holds for these two —
          # `RELEASE_TAG` is declared in the *runtime* stage
          # (`Containerfile.workflows-service:114`), so it does not reach the
          # builder's cache key.
          #
          # The two public-host legs deliberately have no scope. `build` runs a
          # stub-assets step that rewrites `server/public` and `.dockerignore`,
          # and `COPY server server` sits above `RUN cargo build`, so their
          # builder inputs genuinely differ and a lookup could only miss.
          # Sharing those needs `server/public` moved below the compile.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        timeout-minutes: 90
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "authenticate to Artifact Registry"
      # Artifact Registry takes a short-lived access token for the
      # the configured image-publisher identity, minted by exchanging this run's
      # GitHub OIDC token at a Workload Identity provider that trusts this
      # repository alone. The provider's resource name carries the project
      # NUMBER, so it is a secret only for want of a better home: it names no
      # credential. Unset, the exchange fails the job loudly, so this is not a
      # toggle — a missing value stops the release rather than skipping a push.
      - name: authenticate to Artifact Registry
        timeout-minutes: 90
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "log in to the image registry"
      - name: log in to the image registry
        timeout-minutes: 90
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "derive image name"
      - name: derive image name
        timeout-minutes: 90
        id: img
        run: echo "name=${NAVIGATOR_IMAGE_REGISTRY}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "compose registry list"
      # `metadata-action` fans every tag across every image named here, so ONE
      # `build and push` writes the whole list from a single build — a second
      # push step would mean a second 21-minute large-runner compile for
      # identical layers.
      #
      # The list is composed in bash rather than inline because it is a
      # heredoc-delimited multi-line output: an inline expression emitting a
      # stray blank line would hand `metadata-action` an empty image name, and a
      # `kind-ci/**` run never reaches this step, so it would first fail on a
      # live release.
      #
      # The push is UNCONDITIONAL and carries no toggle. The repository is
      # private and every image in it is deleted seven days after push by the
      # repository's cleanup policy, so a tag older than a week cannot be
      # pulled. A registry the release depends on must not be switchable by a
      # repository variable a cleared setting could quietly empty, so
      # `cli/tests/license_of_record.rs` asserts no condition guards it.
      - name: compose registry list
        timeout-minutes: 90
        id: imgs
        run: |
          set -euo pipefail
          {
            printf 'list<<__IMAGES_EOF__\n'
            printf '%s\n' "${{ steps.img.outputs.name }}"
            printf '__IMAGES_EOF__\n'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "image metadata"
      - name: image metadata
        timeout-minutes: 90
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.imgs.outputs.list }}
          # This `latest` is PUBLISHED, not consumed: a convenience pointer we
          # offer on our own images, never a dependency we run from (prod rolls
          # dated tags via `ops ship`). Exempt from the consumed-mutable-tag
          # guard — see docs/gitops.md § "Pin every consumed image, binary, and
          # action".
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-version.outputs.tag }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "compose build-args"
      # Stamp the release into every image. RELEASE_TAG is the registry tag
      # derived above; `telemetry::init` reads it as `service.version` so the worker and
      # the trigger CronJobs self-report their release in logs/traces — the
      # headless counterpart to web's `GET /version`. The web image additionally
      # gets GIT_SHA/BUILD_TIME for the `/version` commit fields (only its
      # Containerfile declares those ARGs).
      - name: compose build-args
        timeout-minutes: 90
        id: ba
        run: |
          {
            printf 'args<<__BUILD_ARGS_EOF__\n'
            printf 'RELEASE_TAG=%s\n' "${{ needs.release-version.outputs.tag }}"
            case "${{ matrix.image }}" in
              neon-server|neon-server)
                printf 'GIT_SHA=%s\n' "${{ github.sha }}"
                printf 'BUILD_TIME=%s\n' "$(git show -s --format=%cI HEAD)"
                ;;
            esac
            printf '__BUILD_ARGS_EOF__\n'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "compose cache sources"
      # Compose `cache-from` here rather than inline, for the same reason
      # `compose build-args` above exists: the value is conditional, and a
      # `kind-ci/**` run cannot exercise it — `publish-service` is gated on a
      # tag ref, so an inline expression that emitted a stray blank entry
      # would first fail on a live release. Building the list in bash keeps
      # the empty case impossible instead of merely unlikely.
      - name: compose cache sources
        timeout-minutes: 90
        id: cf
        run: |
          set -euo pipefail
          {
            printf 'sources<<__CACHE_FROM_EOF__\n'
            printf 'type=registry,ref=%s:buildcache\n' "${{ steps.img.outputs.name }}"
            if [ -n "${{ matrix.ci_cache_scope }}" ]; then
              printf 'type=gha,scope=%s\n' "${{ matrix.ci_cache_scope }}"
            fi
            printf '__CACHE_FROM_EOF__\n'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "build"
      # Compile without pushing. A cold `neon-server` build outlives the
      # registry token (the registry's seven-day cleanup also deletes
      # `:buildcache`), and `build and push` pushes inside the step that
      # compiles, so the push would ride a token minted over an hour before.
      # This builder keeps every layer, so `build and push` below replays
      # them from its local cache and only pushes.
      - name: build
        timeout-minutes: 90
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ steps.ba.outputs.args }}
          push: false
          cache-from: ${{ steps.cf.outputs.sources }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "refresh the registry token"
      # The access token minted before the build lives one hour, and a cold
      # build can outlast it (26.10.21-rc.1's neon-server build ran 62 minutes
      # and `cosign sign` got UNAUTHORIZED; 26.10.27's ran 68 and the push
      # itself got 401). `build` above compiles without the registry, so mint
      # a fresh token here, after it, and log in again: the push, its cache
      # export, signing, mirroring, and the alias tag all ride this one.
      - name: refresh the registry token
        timeout-minutes: 90
        id: gcp-refresh
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "log in to the image registry again"
      - name: log in to the image registry again
        timeout-minutes: 90
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-refresh.outputs.access_token }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "build and push"
      - name: build and push
        timeout-minutes: 90
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ steps.ba.outputs.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache into the image registry, NOT the GitHub Actions cache.
          #
          # `type=gha` writes to a 10 GB per-repository quota that is shared
          # with every other cache in this repo, and `mode=max` on eleven
          # images fills it: 66 of 68 live entries were `buildkit-blob-*` at
          # 9.51 GB, including single blobs of 5.3 GB and 2.64 GB. What that
          # evicted was `ci.yml`'s Rust dependency cache — which runs on EVERY
          # PR push, uploaded 2.19 GB at the end of each run, and was never
          # restored once (zero `v0-rust-*` entries existed). The release
          # pipeline was starving the PR gate.
          #
          # A registry-backed cache has no quota and no LRU eviction, and is
          # not scoped per-branch the way the Actions cache is, so consecutive
          # releases genuinely read each other's layers. `image-manifest` +
          # `oci-mediatypes` make the cache a standard OCI object that the
          # registry stores like any other; without them Artifact Registry rejects
          # buildkit's native cache manifest type.
          #
          # `:buildcache` is a WRITTEN tag, not a consumed one — no deployment
          # ever pulls it, and `ops ship` rolls dated tags. It is a sibling of
          # the published `latest` under the same exemption.
          #
          # The second `cache-from` reads the Actions cache the `build` job
          # exported earlier in THIS run, which is what stops a tag run
          # compiling the same crates twice. That does not reopen the quota
          # incident above: the 9.51 GB came from `cache-to: type=gha,mode=max`
          # — an export. A `cache-from` only issues lookups, creates no cache
          # entry, and consumes no quota, so `cache-to` below stays
          # registry-only.
          #
          # Reading it needs no credential and no WIF: the Actions cache is
          # reachable from any job in the run through the runner's own token.
          # `build` therefore keeps holding no registry credential, which
          # matters because it also runs on `kind-ci/**` branch pushes.
          #
          # Ordering is safe by the needs graph — publish-service needs
          # integration needs build — so the export is long finished. If it
          # silently failed under its own `ignore-error`, this lookup misses
          # and the registry cache above still serves the build.
          cache-from: ${{ steps.cf.outputs.sources }}
          # ignore-error: the release tag exists before this export, so a
          # registry hiccup on the `mode=max` export must not fail the publish
          # after the release image is already in the registry. This is
          # the leg that failed run 29929842056 (navigator-web amd64) purely at
          # cache export, image already pushed.
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "install cosign"
      - name: install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "record published digest"
      - name: record published digest
        id: digest
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST}"
          scripts/cosign-sign.sh "${IMAGE_REF}@${IMAGE_DIGEST}"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "mirror the same digest to public GHCR"
      - name: mirror the same digest to public GHCR
        timeout-minutes: 5
        env:
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}/navigator
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin
          target="${GHCR_REGISTRY}/${{ matrix.image }}"
          for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --prefer-index=false --tag "${target}:${RELEASE_TAG}" --tag "${target}:latest" "${IMAGE_REF}@${IMAGE_DIGEST}" \
                  && source_digest="$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${IMAGE_DIGEST}" | sha256sum | cut -d' ' -f1)" \
                  && target_digest="$(docker buildx imagetools inspect --raw "${target}:${RELEASE_TAG}" | sha256sum | cut -d' ' -f1)" \
                  && [ "${source_digest}" = "${target_digest}" ] \
                  && cosign sign --yes "${target}@sha256:${target_digest}"; then
                  exit 0
              fi
              sleep "$((attempt * 2))"
          done
          echo "::error::GHCR mirror of ${target}:${RELEASE_TAG} failed after retries"
          exit 1
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.alias != ''
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "publish the alias tag"
      # Point `matrix.alias`'s repository at the manifest just pushed, rather
      # than compiling the same Containerfile a second time under a second
      # name. `imagetools create` copies the existing manifest between
      # repositories registry-side — no runner build, no pull, no push of
      # layers — so the alias is the same digest by construction. Both tags
      # this leg published (`latest` and the release tag) are re-pointed, which
      # is what a consumer of `navigator-web` reads.
      #
      # This runs only on the leg that declares an alias; every other leg
      # skips it.
      - name: publish the alias tag
        timeout-minutes: 90
        if: matrix.alias != ''
        run: |
          set -euo pipefail
          registry="${NAVIGATOR_IMAGE_REGISTRY}"
          for tag in latest "${{ needs.release-version.outputs.tag }}"; do
              docker buildx imagetools create \
                  --tag "${registry}/${{ matrix.alias }}:${tag}" \
                  "${registry}/${{ matrix.image }}:${tag}"
          done
          # Prove the alias resolves to the same manifest the source tag does,
          # so a silent no-op cannot ship a stale `navigator-web` to prod.
          # Compare raw manifest bytes rather than `--format`: the buildx
          # version `setup-buildx-action` currently installs (v0.23.0)
          # silently drops `--format` and falls back to the full default text
          # whenever the target is an image index with more than one entry,
          # which every image here is, since a default provenance attestation
          # adds a second manifest. That made `src` and `dst` both the whole
          # text block -- always unequal, because each names its own
          # repository -- so this check failed on every run.
          src="$(docker buildx imagetools inspect --raw \
              "${registry}/${{ matrix.image }}:${{ needs.release-version.outputs.tag }}" | sha256sum)"
          dst="$(docker buildx imagetools inspect --raw \
              "${registry}/${{ matrix.alias }}:${{ needs.release-version.outputs.tag }}" | sha256sum)"
          echo "${{ matrix.image }} -> ${src}"
          echo "${{ matrix.alias }} -> ${dst}"
          test "${src}" = "${dst}"
          scripts/cosign-sign.sh "${registry}/${{ matrix.alias }}@$(docker buildx imagetools inspect --raw "${registry}/${{ matrix.alias }}:${{ needs.release-version.outputs.tag }}" | sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/')"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-service ${{ matrix.image }}"
          step: "publish immutable digest manifest"
      - name: publish immutable digest manifest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          ALIAS: ${{ matrix.alias }}
        run: |
          set -euo pipefail
          # Keys are registry-free image names. The registry is a secret, and
          # GitHub drops any job output or release asset that carries one.
          jq -n --arg image "${IMAGE_NAME}" --arg digest "${IMAGE_DIGEST}" --arg alias "${ALIAS}" \
              --arg alias_digest "${IMAGE_DIGEST}" \
              'if $alias == "" then {($image): $digest} else {($image): $digest, ($alias): $alias_digest} end' > image-digest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest.json
          if-no-files-found: error

  publish-triggers:
    name: publish ${{ matrix.image }} to Artifact Registry
    needs: [integration, release-version, release-tag]
    if: needs.release-version.outputs.publishable == 'true'
    # Per-image runner. A trigger image compiles ONE musl binary out of the
    # workspace — a very different shape from the 209 linked test binaries that
    # make `ci.yml`'s workspace job genuinely disk-bound — so it does not need
    # the 16-core pool, which bills per minute with no included quota.
    #
    # Trigger images retain `blacksmith-4vcpu-ubuntu-2404` pending a measured
    # build on standard public runners (four CPUs, 16 GB RAM, 14 GB SSD).
    # Run 144427521 observed two CPUs while the repository was private;
    # that CPU comparison no longer describes the public runner. Disk, cache,
    # memory, and cold-build timing still need measurement before switching.
    runs-on: ${{ matrix.runner }}
    # `contents: read` to check out, `id-token: write` to federate — the same
    # keyless grant `publish-service` holds.
    permissions:
      contents: read
      id-token: write
      packages: write
    # 90, up from 45: the six downgraded legs trade wall-clock for cost on
    # half the cores, and this cap is a wedge detector rather than a duration
    # budget (see the `build` job's timeout for the same reasoning).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scheduled and operator images share Containerfile.trigger; CRATE
          # and BIN select the executable. Compatibility aliases reuse its digest.
          - image: navigator-ops
            dockerfile: images/Containerfile.trigger
            # Hudson links the portal graph and requires the operator build capacity.
            runner: blacksmith-8vcpu-ubuntu-2404
            build-args: |
              CRATE=hudson
              BIN=hudson
          - image: navigator-nightly-project-update-trigger
            dockerfile: images/Containerfile.trigger
            runner: blacksmith-4vcpu-ubuntu-2404
            build-args: |
              CRATE=workflows-service
              BIN=nightly-project-update-trigger
          - image: navigator-youtube-comments-poll-trigger
            dockerfile: images/Containerfile.trigger
            runner: blacksmith-4vcpu-ubuntu-2404
            build-args: |
              CRATE=workflows-service
              BIN=youtube-comments-poll-trigger
    steps:
      # No disk reclaim: every leg runs on a Blacksmith machine with a ~145 GB
      # root disk, so a docker build has room without a sweep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        timeout-minutes: 90
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "authenticate to Artifact Registry"
      # Artifact Registry takes a short-lived access token for the
      # the configured image-publisher identity, minted by exchanging this run's
      # GitHub OIDC token at a Workload Identity provider that trusts this
      # repository alone. The provider's resource name carries the project
      # NUMBER, so it is a secret only for want of a better home: it names no
      # credential. Unset, the exchange fails the job loudly, so this is not a
      # toggle — a missing value stops the release rather than skipping a push.
      - name: authenticate to Artifact Registry
        timeout-minutes: 90
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "log in to the image registry"
      - name: log in to the image registry
        timeout-minutes: 90
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "derive image name"
      - name: derive image name
        timeout-minutes: 90
        id: img
        run: echo "name=${NAVIGATOR_IMAGE_REGISTRY}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "image metadata"
      - name: image metadata
        timeout-minutes: 90
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-version.outputs.tag }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "compose build-args"
      - name: compose build-args
        timeout-minutes: 90
        id: ba
        run: |
          {
            printf 'args<<__BUILD_ARGS_EOF__\n'
            printf '%s\n' "${{ matrix.build-args }}"
            printf 'RELEASE_TAG=%s\n' "${{ needs.release-version.outputs.tag }}"
            printf '__BUILD_ARGS_EOF__\n'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "build and push"
      - name: build and push
        timeout-minutes: 90
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ steps.ba.outputs.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image registry rather than the Actions cache quota — same
          # reasoning as the service publishes above, and these six images are
          # half of what was filling it.
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          # ignore-error: same contract as the service publishes — the image
          # is pushed before the export, so a registry flake on the `mode=max`
          # export must not fail an already-published image.
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "install cosign"
      - name: install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "refresh the registry token"
      # The access token minted before the build lives one hour, and a cold
      # build can outlast it (26.10.21-rc.1's neon-server build ran 62 minutes
      # and `cosign sign` got UNAUTHORIZED). Mint a fresh one and log in again
      # so signing, mirroring, and the alias tag never ride an expired token.
      - name: refresh the registry token
        timeout-minutes: 90
        id: gcp-refresh
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.NAVIGATOR_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ secrets.NAVIGATOR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "log in to the image registry again"
      - name: log in to the image registry again
        timeout-minutes: 90
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.NAVIGATOR_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-refresh.outputs.access_token }}
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "sign private image digest"
      - name: sign private image digest
        id: digest
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST}"
          scripts/cosign-sign.sh "${IMAGE_REF}@${IMAGE_DIGEST}"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.image == 'navigator-ops'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "verify operator image commands"
      - name: verify operator image commands
        timeout-minutes: 5
        if: matrix.image == 'navigator-ops'
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_REF}@${IMAGE_DIGEST}"
          docker run --rm "$image" --version
          docker run --rm "$image" ops postgres ready --help
          docker run --rm "$image" ops forgejo runner-controller --help
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "mirror the same digest to public GHCR"
      - name: mirror the same digest to public GHCR
        timeout-minutes: 5
        env:
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}/navigator
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin
          target="${GHCR_REGISTRY}/${{ matrix.image }}"
          for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --prefer-index=false --tag "${target}:${RELEASE_TAG}" --tag "${target}:latest" "${IMAGE_REF}@${IMAGE_DIGEST}" \
                  && source_digest="$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${IMAGE_DIGEST}" | sha256sum | cut -d' ' -f1)" \
                  && target_digest="$(docker buildx imagetools inspect --raw "${target}:${RELEASE_TAG}" | sha256sum | cut -d' ' -f1)" \
                  && [ "${source_digest}" = "${target_digest}" ] \
                  && cosign sign --yes "${target}@sha256:${target_digest}"; then
                  exit 0
              fi
              sleep "$((attempt * 2))"
          done
          echo "::error::GHCR mirror of ${target}:${RELEASE_TAG} failed after retries"
          exit 1
      # The retained Source exporter uses an explicit compatibility repository.
      # Copy this build's digest, verify the copied bytes, and sign each registry
      # identity instead of compiling Hudson twice or falling back to an old tag.
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: matrix.alias != ''
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "publish retained Source operator alias"
      - name: publish retained Source operator alias
        timeout-minutes: 5
        if: matrix.alias != ''
        env:
          ALIAS: ${{ matrix.alias }}
          IMAGE_REF: ${{ steps.img.outputs.name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}/navigator
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${ALIAS}"
          for target in "${IMAGE_REF%/*}/${ALIAS}" "${GHCR_REGISTRY}/${ALIAS}"; do
              copied=false
              for attempt in 1 2 3 4 5; do
                  if docker buildx imagetools create --prefer-index=false --tag "${target}:${RELEASE_TAG}" --tag "${target}:latest" "${IMAGE_REF}@${IMAGE_DIGEST}" \
                      && target_digest="$(docker buildx imagetools inspect --raw "${target}:${RELEASE_TAG}" | sha256sum | cut -d' ' -f1)" \
                      && [ "sha256:${target_digest}" = "${IMAGE_DIGEST}" ]; then
                      copied=true
                      break
                  fi
                  sleep "$((attempt * 2))"
              done
              test "${copied}" = true
              scripts/cosign-sign.sh "${target}@${IMAGE_DIGEST}"
          done
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "publish-triggers ${{ matrix.image }}"
          step: "write immutable image digest manifest"
      - name: write immutable image digest manifest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          ALIAS: ${{ matrix.alias }}
        run: |
          jq -n --arg image "${IMAGE_NAME}" --arg digest "${IMAGE_DIGEST}" --arg alias "${ALIAS}" \
            'if $alias == "" then {($image): $digest} else {($image): $digest, ($alias): $digest} end' > image-digest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digest.json
          if-no-files-found: error

  # ---------- Stage 2b: build the CLI release archives ----------
  # The container publishing lanes are Linux/amd64-only because that is what
  # GKE consumes. Navigator is built for Macs and for containers in the cloud,
  # so every release that publishes images builds a macOS and a Linux
  # executable — one job per platform, both attached by one publish job below.
  #
  # THE TWO BUILDS SIT IN STAGE 2 ALONGSIDE THE GHCR PUBLISHES, behind the
  # same `integration` gate those carry. A release ships ONE version across four
  # surfaces — the Artifact Registry image tags, these two archives, `navigator --version`,
  # and the Release page — and nobody reading that version can tell which of
  # those the e2e suite stood behind. So all of them wait for it: the archive a
  # Project runner installs is proven by the same KIND run as the image prod
  # pulls, rather than by the fact that both happened to be cut from one SHA.
  #
  # It also stops occupying runners on releases whose e2e then goes red. They are free on a public repository,
  # so this is not a billing argument: the point is that an archive built for a
  # Release that never gets cut has no consumer at all.
  #
  # These jobs are PEERS of each other and of the publishes, and
  # `release-cli-publish` waits for both so one Release carries
  # every platform. A release that cannot produce its CLI is not a complete
  # release: `.github/actions/gate` — the gate every Project repository runs
  # — downloads these archives, so a missing one breaks Project CI everywhere
  # while this run reports green.
  release-cli-build-linux:
    name: build Linux navigator CLI release archive
    # Same stage as the macOS archive and the Artifact Registry publishes: the e2e gate plus
    # the tag, gated on `publishable`.
    needs: [integration, release-version, release-tag]
    if: needs.release-version.outputs.publishable == 'true'
    # Standard runner. One `--release` build of the lean `navigator` binary
    # alone: every other CLI and the LSP build in jobs of their own, so this
    # graph carries no web client, operator tooling, or Ephemeris stack. Unlike
    # `build` and the publish legs, nothing here runs inside buildx, so the
    # image layers that need Blacksmith's ~145 GB root never touch this disk.
    runs-on: ubuntu-24.04
    # This is the archive CI actually consumes. `.github/actions/gate`
    # derives its download from the runner's platform and asks for
    # `navigator-<tag>-linux.tar.gz`. So without this job the notation gate
    # cannot install the CLI in ANY consuming repository, which is why no
    # content or Project repository has a working `ci` job today.
    #
    # The CLI is a static musl build (ENG-1228). The Forgejo Project gate runs
    # its steps inside the pinned `forgejo/runner` image, which is Alpine, and
    # `navigator project gate` re-executes the pinned `-linux.tar.gz` release
    # from its cache, so a glibc binary exits 127 there with "required file
    # not found". A static-pie binary runs on Alpine and on `ubuntu-latest`
    # alike, and the `FROM scratch` CLI image below needs one too. The
    # operator image uses the same shared static-musl build recipe.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Same ref logic as the macOS build: this job only runs for a tag
      # release, so the tag is the ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        timeout-minutes: 90
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        timeout-minutes: 90
        with:
          shared-key: release-navigator-linux
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-linux"
          step: "build the tagged Navigator CLI"
      - name: build the tagged Navigator CLI
        timeout-minutes: 90
        env:
          NAVIGATOR_RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl -p cli --bin navigator
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-linux"
          step: "prove the CLI runs in the pinned Forgejo runner image"
      - name: prove the CLI runs in the pinned Forgejo runner image
        timeout-minutes: 90
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/navigator
          file "${bin}" | grep -q 'static-pie linked\|statically linked' \
            || { file "${bin}"; echo "::error::the Linux CLI must be statically linked (ENG-1228)"; exit 1; }
          image="$(grep -o 'data\.forgejo\.org/forgejo/runner@sha256:[0-9a-f]\{64\}' deploy/src/devx/forgejo/runner.rs | head -n 1)"
          test -n "${image}" || { echo "::error::no pinned runner image in deploy/src/devx/forgejo/runner.rs"; exit 1; }
          got="$(docker run --rm --entrypoint /b/navigator -v "${PWD}/$(dirname "${bin}"):/b:ro" "${image}" --version)"
          test "${got}" = "navigator ${TAG}" \
            || { echo "::error::${image} ran the CLI as '${got}', not 'navigator ${TAG}'"; exit 1; }
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-linux"
          step: "prove the release workflow is in Navigator"
      - name: prove the release workflow is in Navigator
        timeout-minutes: 10
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/navigator
          "${bin}" github setup --help | grep -qF "[default: ${TAG}]"
          "${bin}" forgejo release mirror --help >/dev/null
          "${bin}" release default-tag --help >/dev/null
          "${bin}" release check --help >/dev/null
          "${bin}" release pins --help >/dev/null
          "${bin}" release version --help >/dev/null
          "${bin}" project repository push --help >/dev/null
          "${bin}" project repository repair-mirror --help >/dev/null
          "${bin}" project repository reconcile --help >/dev/null
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-linux"
          step: "package the Linux CLI"
      - name: package the Linux CLI
        timeout-minutes: 90
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/navigator-linux
          install -m 0755 target/x86_64-unknown-linux-musl/release/navigator dist/navigator-linux/navigator
          # LICENSE and NOTICE travel with the archive: whoever unpacks it
          # holds the binary and not the repository, and the dual MIT /
          # Apache-2.0 grant asks recipients to retain both license texts
          # plus the attribution notices. `.github/actions/gate` extracts
          # only `navigator`, so the extra members cost a CI consumer nothing.
          install -m 0644 LICENSE dist/navigator-linux/LICENSE
          install -m 0644 LICENSE-MIT dist/navigator-linux/LICENSE-MIT
          install -m 0644 LICENSE-APACHE-2 dist/navigator-linux/LICENSE-APACHE-2
          install -m 0644 NOTICE dist/navigator-linux/NOTICE
          # `-C` is load-bearing: the members must sit at the archive ROOT.
          # `.github/actions/gate` unpacks with
          # `tar -xzf "${asset}" -C "${tmp}" navigator`, which matches nothing
          # if the binary carries a `dist/navigator-linux/` prefix.
          tar -czf "dist/navigator-${TAG}-linux.tar.gz" \
              -C dist/navigator-linux navigator LICENSE LICENSE-MIT LICENSE-APACHE-2 NOTICE
          # `.github/actions/navigator-install` and `install.sh` verify this
          # sidecar before extracting the archive it names — the integrity
          # check ENG-671 added once the download moved to one place. The
          # bare filename (no `dist/` prefix) is what `sha256sum -c` expects
          # to find next to it after both are downloaded into the same
          # directory.
          (cd dist && sha256sum "navigator-${TAG}-linux.tar.gz" > "navigator-${TAG}-linux.tar.gz.sha256")
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-linux"
          step: "upload the Linux CLI archive"
      - name: upload the Linux CLI archive
        timeout-minutes: 90
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigator-linux-cli
          path: |
            dist/navigator-${{ needs.release-version.outputs.tag }}-linux.tar.gz
            dist/navigator-${{ needs.release-version.outputs.tag }}-linux.tar.gz.sha256
          if-no-files-found: error
  release-cli-build-macos:
    name: build macOS navigator CLI release archive
    # Same stage as the other two archives: the e2e gate plus the tag, gated on
    # `publishable`.
    needs: [integration, release-version, release-tag]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: macos-latest
    # The third archive, and the one that closes a live hole rather than adding
    # a convenience: `.github/actions/gate` ALREADY maps a macOS runner to
    # `platform=macos` and downloads `navigator-<tag>-macos.tar.gz`. Until this
    # job existed, every Project repository running the notation gate on a
    # macOS runner failed on a download 404 — the same class of breakage the
    # Linux job's comment describes, one platform over.
    #
    # `macos-latest` is arm64, and so is this archive. That is the whole macOS
    # fleet GitHub hosts and every Mac sold since 2020; an Intel Mac needs a
    # `x86_64-apple-darwin` cross-build lipo'd in, which is a second full
    # release compile on the slowest runner class and is deliberately not
    # bought here. State it rather than let someone infer "macOS" means
    # universal.
    #
    # It builds the lean `navigator` alone. A cold release build of the old
    # all-in-one `cli` + `lsp` overran 90 minutes here (run 42957229465), so
    # every other binary now builds in its own job, and this one also builds
    # with LTO off and 16 codegen units (a slightly larger, equally correct
    # binary) and restores a Rust dependency cache from the previous release.
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    permissions:
      contents: read
    steps:
      # Same ref logic as the other two builds: this job only runs for a real
      # release, so the published SHA is the ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        timeout-minutes: 90
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        timeout-minutes: 90
        with:
          shared-key: release-navigator-macos
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "build the tagged Navigator CLI"
      - name: build the tagged Navigator CLI
        timeout-minutes: 140
        env:
          NAVIGATOR_RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: cargo build --locked --release -p cli --bin navigator
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "prove the macOS CLI exposes the release workflow"
      - name: prove the macOS CLI exposes the release workflow
        timeout-minutes: 10
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          bin=target/release/navigator
          "${bin}" github setup --help | grep -qF "[default: ${TAG}]"
          "${bin}" forgejo release mirror --help >/dev/null
          "${bin}" release default-tag --help >/dev/null
          "${bin}" release check --help >/dev/null
          "${bin}" release pins --help >/dev/null
          "${bin}" release version --help >/dev/null
          "${bin}" project repository push --help >/dev/null
          "${bin}" project repository repair-mirror --help >/dev/null
          "${bin}" project repository reconcile --help >/dev/null
      # ENG-115: a Developer ID signing identity, its .p12, and a notarization
      # API key are operator-provisioned secrets that do not exist yet. This
      # step is the only place that inspects them, so every step below reads
      # its one `present` output rather than repeating the secret check.
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "check Apple Developer ID signing secrets"
      - name: check Apple Developer ID signing secrets
        timeout-minutes: 90
        id: apple-signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CERTIFICATE_P12}" ] && [ -n "${CERTIFICATE_PASSWORD}" ] && \
             [ -n "${IDENTITY}" ] && [ -n "${NOTARIZATION_KEY}" ] && \
             [ -n "${NOTARIZATION_KEY_ID}" ] && [ -n "${NOTARIZATION_ISSUER_ID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple Developer ID signing secrets are absent — publishing an unsigned macOS archive and no .pkg."
          fi
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "import the Developer ID certificate"
      - name: import the Developer ID certificate
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/navigator-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 900 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security import "${RUNNER_TEMP}/developer-id.p12" -k "${KEYCHAIN}" \
              -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${RUNNER_TEMP}/developer-id.p12"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "codesign the macOS CLI binary"
      - name: codesign the macOS CLI binary
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: codesign --force --options runtime --timestamp --sign "${IDENTITY}" target/release/navigator
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "package the macOS CLI"
      - name: package the macOS CLI
        timeout-minutes: 90
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/navigator-macos
          install -m 0755 target/release/navigator dist/navigator-macos/navigator
          # LICENSE and NOTICE travel with the archive, for the reason the
          # Linux packaging step gives.
          install -m 0644 LICENSE dist/navigator-macos/LICENSE
          install -m 0644 LICENSE-MIT dist/navigator-macos/LICENSE-MIT
          install -m 0644 LICENSE-APACHE-2 dist/navigator-macos/LICENSE-APACHE-2
          install -m 0644 NOTICE dist/navigator-macos/NOTICE
          # `-C` is load-bearing for the same reason it is on Linux: the
          # validate action unpacks with `tar -xzf "${asset}" -C "${tmp}"
          # navigator`, which matches nothing if the binary carries a
          # `dist/navigator-macos/` prefix.
          tar -czf "dist/navigator-${TAG}-macos.tar.gz" \
              -C dist/navigator-macos navigator LICENSE LICENSE-MIT LICENSE-APACHE-2 NOTICE
          # See the matching Linux step: the sidecar
          # `.github/actions/navigator-install` and `install.sh` verify
          # before extracting.
          (cd dist && shasum -a 256 "navigator-${TAG}-macos.tar.gz" > "navigator-${TAG}-macos.tar.gz.sha256")
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "upload the macOS CLI archive"
      - name: upload the macOS CLI archive
        timeout-minutes: 90
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigator-macos-cli
          path: |
            dist/navigator-${{ needs.release-version.outputs.tag }}-macos.tar.gz
            dist/navigator-${{ needs.release-version.outputs.tag }}-macos.tar.gz.sha256
          if-no-files-found: error
      # A bare Mach-O cannot be stapled — the .pkg installs the already-signed
      # binary to /usr/local/bin and is what Gatekeeper checks offline.
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "build the macOS installer package"
      - name: build the macOS installer package
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/navigator-pkgroot/usr/local/bin
          install -m 0755 target/release/navigator dist/navigator-pkgroot/usr/local/bin/navigator
          pkgbuild --root dist/navigator-pkgroot \
              --identifier com.neonlaw.navigator \
              --version "${TAG}" \
              --install-location / \
              "dist/navigator-${TAG}-macos.pkg"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "notarize the macOS installer package"
      - name: notarize the macOS installer package
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
          NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "${NOTARIZATION_KEY}" | base64 --decode > "${RUNNER_TEMP}/notarization-key.p8"
          xcrun notarytool submit "dist/navigator-${TAG}-macos.pkg" \
              --key "${RUNNER_TEMP}/notarization-key.p8" \
              --key-id "${NOTARIZATION_KEY_ID}" \
              --issuer "${NOTARIZATION_ISSUER_ID}" \
              --wait
          rm -f "${RUNNER_TEMP}/notarization-key.p8"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "staple the notarization ticket"
      - name: staple the notarization ticket
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: xcrun stapler staple "dist/navigator-${TAG}-macos.pkg"
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "upload the macOS installer package"
      - name: upload the macOS installer package
        timeout-minutes: 90
        if: steps.apple-signing.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigator-macos-pkg
          path: dist/navigator-${{ needs.release-version.outputs.tag }}-macos.pkg
          if-no-files-found: error
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        if: always() && steps.apple-signing.outputs.present == 'true'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-cli-build-macos"
          step: "remove the temporary signing keychain"
      - name: remove the temporary signing keychain
        timeout-minutes: 90
        if: always() && steps.apple-signing.outputs.present == 'true'
        run: security delete-keychain "${RUNNER_TEMP}/navigator-signing.keychain-db" || true

  release-lsp-build-linux:
    name: build Linux navigator-lsp release archive
    needs: [integration, release-version, release-tag]
    if: needs.release-version.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    # The editor language server, built apart from every CLI so its archive
    # never waits on a CLI compile. Desktop editors are its only consumer, so
    # the Linux build stays glibc.

  release-deploy-cli-build-linux:
    name: build Linux hudson release archive
    needs: [integration, release-version, release-tag]
    if: needs.release-version.outputs.publishable == 'true'
    # `hudson`: the operator CLI (`dev`, `ops`, site, mail,
    # notation, firm). It links the web client, the cloud SDKs, and the KIND
    # tooling, which is why it builds apart from the lean `navigator` and is
    # never in the Homebrew tap. Compiling `portal` is the release's memory
    # peak: a 16 GB hosted `ubuntu-24.04` runner shut down mid-`portal`, so
    # this job runs on a 32 GB Blacksmith runner.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 90
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        timeout-minutes: 90
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        timeout-minutes: 90
        with:
          shared-key: release-hudson-linux
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-deploy-cli-build-linux"
          step: "build the tagged Hudson CLI"
      - name: build the tagged Hudson CLI
        timeout-minutes: 110
        env:
          NAVIGATOR_RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          # Static musl, like `navigator`: the `navigator-cli` image is
          # `FROM scratch`, and `release-deploy.yml` runs this binary from it.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl -p hudson --bin hudson
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-deploy-cli-build-linux"
          step: "prove the release tag was baked in"
      - name: prove the release tag was baked in
        timeout-minutes: 10
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          # `--version` falls back to the Cargo version, which a release
          # commit stamps to the tag, so it cannot prove the tag was baked.
          # Pinned Project gates compare against the published release, empty
          # unless build.rs saw NAVIGATOR_RELEASE_TAG; `--action-version`
          # defaults to that value. The `cli` library both binaries link is
          # built with the same variable, so this proves it for `navigator`.
          target/x86_64-unknown-linux-musl/release/hudson ops github setup --help \
            | grep -qF "[default: ${TAG}]" \
            || { echo "::error::hudson was built without NAVIGATOR_RELEASE_TAG; its published release is empty"; exit 1; }
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-deploy-cli-build-linux"
          step: "package the Hudson CLI"
      - name: package the Hudson CLI
        timeout-minutes: 90
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/hudson-linux
          install -m 0755 target/x86_64-unknown-linux-musl/release/hudson dist/hudson-linux/hudson
          install -m 0644 LICENSE dist/hudson-linux/LICENSE
          install -m 0644 LICENSE-MIT dist/hudson-linux/LICENSE-MIT
          install -m 0644 LICENSE-APACHE-2 dist/hudson-linux/LICENSE-APACHE-2
          install -m 0644 NOTICE dist/hudson-linux/NOTICE
          tar -czf "dist/hudson-${TAG}-linux.tar.gz" \
              -C dist/hudson-linux hudson LICENSE LICENSE-MIT LICENSE-APACHE-2 NOTICE
          (cd dist && shasum -a 256 "hudson-${TAG}-linux.tar.gz" > "hudson-${TAG}-linux.tar.gz.sha256")
      - uses: ./.github/actions/slack-progress
        timeout-minutes: 90
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          tag: "${{ needs.release-version.outputs.tag }}"
          stage: "release-deploy-cli-build-linux"
          step: "upload the Hudson CLI archive"
      - name: upload the Hudson CLI archive
        timeout-minutes: 90
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hudson-linux
          path: |
            dist/hudson-${{ needs.release-version.outputs.tag }}-linux.tar.gz
            dist/hudson-${{ needs.release-version.outputs.tag }}-linux.tar.gz.sha256
          if-no-files-found: error


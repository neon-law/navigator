name: PostgreSQL image
# Builds `images/postgres`, tests each architecture's candidate, and publishes
# the tested manifests to ghcr.io/<owner>/neon-law-postgres. The Monday run
# rebuilds without cache so Debian security fixes reach a new image every week;
# a change to the recipe publishes on merge. Each publish is then dogfooded:
# `scripts/postgres-image-pin.sh` moves every Navigator pin to the new digest
# and the pull request it opens runs the compatibility and persistence gates
# against exactly what was published.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'images/postgres/**'
      - '.github/workflows/postgres-image.yml'
  pull_request:
    paths:
      - 'images/postgres/**'
      - 'scripts/postgres-image-pin.sh'
      - '.github/workflows/postgres-image.yml'
permissions:
  contents: read
concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/neon-law-postgres
  VERSION: 16.15-age1.6.0-vector0.8.2
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
jobs:
  test:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.98.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/postgres
          file: images/postgres/Containerfile
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: ${{ env.PUBLISH != 'true' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}:candidate-{1}-{2}-{3}', env.REGISTRY, github.run_id, github.run_attempt, matrix.arch) || 'neon-law-postgres:smoke' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
      - name: Test exact candidate
        working-directory: images/postgres
        env:
          IMAGE: ${{ env.PUBLISH == 'true' && format('{0}@{1}', env.REGISTRY, steps.build.outputs.digest) || 'neon-law-postgres:smoke' }}
        run: |
          bash tests/run.sh "$IMAGE" | tee smoke.log
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.arch }}
          path: images/postgres/*.log
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      reference: ${{ steps.promote.outputs.reference }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested manifests without rebuilding
        id: promote
        run: |
          set -euo pipefail
          candidate="$REGISTRY:candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          # The moving tag follows the newest tested build; the dated and
          # commit tags never move. Consumers pin the digest, never a tag.
          docker buildx imagetools create \
            --tag "$REGISTRY:$VERSION" \
            --tag "$REGISTRY:$VERSION-$(date -u +%Y%m%d)" \
            --tag "$REGISTRY:$VERSION-${GITHUB_SHA::12}" \
            "$candidate-amd64" "$candidate-arm64"
          docker buildx imagetools inspect "$REGISTRY:$VERSION-${GITHUB_SHA::12}" | tee release.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' release.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "$REGISTRY@$digest"
          echo "reference=$REGISTRY@$digest" >> "$GITHUB_OUTPUT"
          echo "$REGISTRY@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: published-digest
          path: release.txt
  dogfood:
    needs: publish
    runs-on: ubuntu-24.04
    # The pull request must be opened by the App, not GITHUB_TOKEN: GitHub
    # starts no workflow runs for a pull request the workflow token opens, so
    # the gates that prove the new digest would never run. No App, no PR.
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
      REFERENCE: ${{ needs.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Pin Navigator to the published digest
        id: pin
        run: |
          set -euo pipefail
          scripts/postgres-image-pin.sh "$REFERENCE"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi
      - name: mint app token
        id: app-token
        if: steps.pin.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Open the pin pull request
        if: steps.pin.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          digest="${REFERENCE##*:}"
          branch="postgres-image/$(date -u +%Y%m%d)-${digest::12}"
          base=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" >/dev/null
          # createCommitOnBranch makes a commit GitHub signs, which the
          # `production` ruleset's required signatures accept; a runner's own
          # `git commit` would be unsigned.
          payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" --arg base "$base" \
            --arg headline "build(postgres): pin the weekly neon-law-postgres image" \
            --arg body "Moves every pin to $REFERENCE, published by run $GITHUB_RUN_ID." \
            '{repo: $repo, branch: $branch, base: $base, headline: $headline, body: $body}')
          files='[]'
          while IFS= read -r path; do
            files=$(jq --arg path "$path" --arg contents "$(base64 -w0 < "$path")" \
              '. + [{path: $path, contents: $contents}]' <<<"$files")
          done < <(git diff --name-only)
          jq -n --argjson p "$payload" --argjson files "$files" '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: { input: {
              branch: { repositoryNameWithOwner: $p.repo, branchName: $p.branch },
              expectedHeadOid: $p.base,
              message: { headline: $p.headline, body: $p.body },
              fileChanges: { additions: $files }
            } }
          }' | gh api graphql --input -
          gh pr create --base main --head "$branch" \
            --title "build(postgres): pin the weekly neon-law-postgres image" \
            --body "Dogfoods \`$REFERENCE\`, published and signed by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). PostgreSQL compatibility and PVC persistence run against this digest on this pull request; staging takes it with the next release."

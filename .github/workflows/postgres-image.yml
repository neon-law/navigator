name: PostgreSQL image
# Builds `images/postgres`, tests each architecture's candidate, and publishes
# the tested manifests to ghcr.io/<owner>/navigator/postgres. The Monday run
# rebuilds without cache so Debian security fixes reach a new image every week;
# a change to the recipe publishes on merge. Each publish is then dogfooded:
# `scripts/postgres-image-pin.sh` moves every Navigator pin to the new digest
# and the pull request it opens runs the compatibility and persistence gates
# against exactly what was published.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'images/postgres/**'
      - '.github/workflows/postgres-image.yml'
  pull_request:
    paths:
      - 'images/postgres/**'
      - 'scripts/postgres-image-pin.sh'
      - 'scripts/postgres-image-bump.sh'
      - 'scripts/open-signed-pr.sh'
      - '.github/workflows/postgres-image.yml'
permissions:
  contents: read
concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/navigator/postgres
  VERSION: 16.15-age1.6.0-vector0.8.7
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
jobs:
  test:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/postgres
          file: images/postgres/Containerfile
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: ${{ env.PUBLISH != 'true' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}:candidate-{1}-{2}-{3}', env.REGISTRY, github.run_id, github.run_attempt, matrix.arch) || 'navigator-postgres:smoke' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
      - name: Test exact candidate
        working-directory: images/postgres
        env:
          IMAGE: ${{ env.PUBLISH == 'true' && format('{0}@{1}', env.REGISTRY, steps.build.outputs.digest) || 'navigator-postgres:smoke' }}
        run: |
          bash tests/run.sh "$IMAGE" | tee smoke.log
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.arch }}
          path: images/postgres/*.log
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      reference: ${{ steps.promote.outputs.reference }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested manifests without rebuilding
        id: promote
        run: |
          set -euo pipefail
          candidate="$REGISTRY:candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          # The moving tag follows the newest tested build; the dated and
          # commit tags never move. Consumers pin the digest, never a tag.
          docker buildx imagetools create \
            --tag "$REGISTRY:$VERSION" \
            --tag "$REGISTRY:$VERSION-$(date -u +%Y%m%d)" \
            --tag "$REGISTRY:$VERSION-${GITHUB_SHA::12}" \
            "$candidate-amd64" "$candidate-arm64"
          docker buildx imagetools inspect "$REGISTRY:$VERSION-${GITHUB_SHA::12}" | tee release.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' release.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "$REGISTRY@$digest"
          echo "reference=$REGISTRY@$digest" >> "$GITHUB_OUTPUT"
          echo "$REGISTRY@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-digest
          path: release.txt
  dogfood:
    needs: publish
    runs-on: ubuntu-24.04
    # The pull request must be opened by the App, not GITHUB_TOKEN: GitHub
    # starts no workflow runs for a pull request the workflow token opens, so
    # the gates that prove the new digest would never run. No App, no PR.
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
      REFERENCE: ${{ needs.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Navigator to the published digest
        id: pin
        run: |
          set -euo pipefail
          scripts/postgres-image-pin.sh "$REFERENCE"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi
      - name: mint app token
        id: app-token
        if: steps.pin.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Open the pin pull request
        if: steps.pin.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          digest="${REFERENCE##*:}"
          scripts/open-signed-pr.sh "postgres-image/$(date -u +%Y%m%d)-${digest::12}" \
            "build(postgres): pin the weekly navigator/postgres image" \
            "Dogfoods \`$REFERENCE\`, published and signed by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). PostgreSQL compatibility and PVC persistence run against this digest on this pull request; staging takes it with the next release."
  bump:
    # Dependabot cannot read the recipe's source pins, so the weekly run opens
    # the equivalent pull request: the newest PostgreSQL minor, base digest,
    # Apache AGE, and pgvector for the pinned major. Merging it changes
    # images/postgres, which publishes the bumped image and then dogfoods it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump the recipe to the newest upstream releases
        id: bump
        run: |
          set -euo pipefail
          scripts/postgres-image-bump.sh | tee bump.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(sed 's/^postgres-image-bump: //' bump.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: mint app token
        id: app-token
        if: steps.bump.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Open the bump pull request
        if: steps.bump.outputs.changed == 'true' && env.AUTOMERGE_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          scripts/open-signed-pr.sh "postgres-image/bump-$(date -u +%Y%m%d)" \
            "build(postgres): bump navigator/postgres upstream versions" \
            "Moves images/postgres to $SUMMARY. Each changed source checksum was fetched fresh by scripts/postgres-image-bump.sh; the image workflow builds and tests both architectures on this pull request and publishes on merge."

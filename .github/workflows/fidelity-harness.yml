# The LibreOffice (soffice) DOCX→PDF fidelity harness, run on demand (LAW-313).
#
# `scripts/fidelity_harness.py` renders the repo's pleading and agreement
# fixtures twice — Typst PDF and editable Word — converts the Word copy to PDF
# with headless LibreOffice, and writes the drift report to
# docs/soffice-fidelity-drift-report.md. The report feeds the engine
# recommendation in docs/soffice-engine-recommendation.md; the PDF backend
# itself stays Typst (the locked LAW-313 decision).
#
# Why this runs on `workflow_dispatch` only, and neither on pull requests nor
# on a clock:
#
# - Not a PR gate: the harness installs LibreOffice (~700 MB of apt packages)
#   and builds the CLI a second time in the same merge path the `rust` job
#   already builds once. The `rust` job's test suite is the merge gate; this
#   is an evaluation, and evaluation cadence belongs to the person running it.
# - Not scheduled on purpose. docs/gitops.md and ci.yml record the repository
#   contract that nothing runs on a clock (the lone scheduled workflow,
#   `ghcr-retention.yml`, only prunes the registry). A weekly drift check
#   would read the contract; `workflow_dispatch` keeps the run available
#   without a clock.
#
# Run it from the Actions tab ("Run workflow") on any ref. The drift report is
# uploaded as a workflow artifact; copy it over the committed report when it
# should update in-tree.

name: fidelity-harness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fidelity-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: LibreOffice DOCX→PDF fidelity harness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Match the `rust` job's build shape: no incremental artifacts, no
      # debuginfo, stripped symbols — the harness needs the `navigator`
      # binary, not the instrumented suite.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C strip=symbols"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: install lld, poppler-utils, and LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y lld poppler-utils libreoffice-writer
          ld.lld --version
          pdftotext -v 2>&1 | head -1
          soffice --version
      - name: build the navigator CLI
        run: cargo build -p cli --locked
      - name: run the fidelity harness
        run: scripts/fidelity_harness.py
      - name: upload the drift report
        uses: actions/upload-artifact@ea165f8d65b9e75b540449e92b4886f43607fa02 # v4
        with:
          name: soffice-fidelity-drift-report
          path: docs/soffice-fidelity-drift-report.md

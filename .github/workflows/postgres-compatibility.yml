name: PostgreSQL compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'images/postgres/**'
      - 'scripts/postgres-image-pin.sh'
      - 'k8s/overlays/postgres-spike/**'
      - 'k8s/overlays/kind-postgres-spike/**'
      - 'store/postgres/**'
      - 'store/src/postgres_schema.rs'
      - 'store/src/schema/navigator.surql'
      - 'store/src/lib.rs'
      - 'store/examples/runtime_graph_roles.rs'
      - 'k8s/postgres/access/roles.sql'
      - 'store/examples/postgres_schema.rs'
      - 'store/src/postgres_mirror/**'
      - 'store/tests/firm_journal.rs'
      - 'store/tests/support/firm_journal.rs'
      - 'store/src/journal_startup_migration/**'
      - 'store/src/postgres.rs'
      - 'store/tests/postgres_tooling.rs'
      - 'store/Cargo.toml'
      - 'k8s/kind-postgres-config.yaml'
      - 'workflows-service/**'
      - 'workflows/**'
      - 'archives/**'
      - 'billing-workflows/**'
      - 'billing/**'
      - 'images/Containerfile.workflows-service'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/postgres-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect evidence outside the checkout
        run: mkdir -p "$RUNNER_TEMP/postgres-smoke"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.0'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.0
      - name: Read the same image pin as KIND
        run: |
          kubectl kustomize k8s/overlays/postgres-spike > /tmp/postgres-spike.yaml
          image=$(awk '/^[[:space:]]*image:/ {print $2}' /tmp/postgres-spike.yaml)
          [[ "$image" =~ ^ghcr\.io/[a-z0-9-]+/[a-z0-9/-]+@sha256:[a-f0-9]{64}$ ]]
          echo "POSTGRES_IMAGE=$image" >> "$GITHUB_ENV"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Anonymous pull and pinned SDK recovery smoke
        working-directory: images/postgres
        run: |
          mkdir -p /tmp/postgres-anonymous-docker
          export DOCKER_CONFIG=/tmp/postgres-anonymous-docker
          docker pull "$POSTGRES_IMAGE"
          bash tests/run.sh "$POSTGRES_IMAGE" --allow-pre-postgis 2>&1 | tee "$RUNNER_TEMP/postgres-smoke/navigator-smoke.log"
      - name: Install pinned KIND
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Run the local StatefulSet in KIND
        run: |
          kind create cluster --name postgres-compatibility --config k8s/kind-postgres-config.yaml \
            --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 \
            --kubeconfig /tmp/postgres-kind.config --wait 120s
          export KUBECONFIG=/tmp/postgres-kind.config
          kubectl create namespace navigator
          kubectl apply -k k8s/overlays/postgres-spike
          kubectl -n navigator rollout status statefulset/postgres-spike --timeout=180s
          actual=$(kubectl -n navigator get pod postgres-spike-0 -o jsonpath='{.spec.containers[0].image}')
          [[ "$actual" == "$POSTGRES_IMAGE" ]]
          # The pinned-image smoke matched its versions to the label; empty
          # declarations keep the shipped-version consistency checks here.
          kubectl -n navigator exec -i postgres-spike-0 -- psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            -v server_version_num= -v age= -v vector= \
            < "images/postgres/tests/extensions.sql" 2>&1 | tee "$RUNNER_TEMP/postgres-smoke/kind-extensions.log"
          cargo test -p store postgres_schema::tests --lib
          kubectl -n navigator exec -i postgres-spike-0 -- psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            < store/postgres/schema.sql | tee "$RUNNER_TEMP/postgres-smoke/kind-schema.log"
          kubectl -n navigator exec -i postgres-spike-0 -- psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            < store/postgres/tests/astrocartography_reference.sql
          kubectl -n navigator exec -i postgres-spike-0 -- psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            < store/postgres/tests/synthetic_core_seed.sql | tee "$RUNNER_TEMP/postgres-smoke/kind-synthetic-seed.log"
          before=$(kubectl -n navigator get pod postgres-spike-0 -o jsonpath='{.metadata.uid}')
          kubectl -n navigator rollout restart statefulset/postgres-spike
          kubectl -n navigator rollout status statefulset/postgres-spike --timeout=180s
          after=$(kubectl -n navigator get pod postgres-spike-0 -o jsonpath='{.metadata.uid}')
          [[ "$before" != "$after" ]]
          kubectl -n navigator exec -i postgres-spike-0 -- psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            < "images/postgres/tests/persistence.sql" 2>&1 | tee "$RUNNER_TEMP/postgres-smoke/kind-persistence.log"
      - name: Journal commands and startup migration against PostgreSQL
        env:
          KUBECONFIG: /tmp/postgres-kind.config
          NAVIGATOR_TEST_POSTGRES_PORT: '25432'
          NAVIGATOR_FORBID_SURREAL: '1'
          RUST_TEST_THREADS: '2'
          RUST_MIN_STACK: '33554432'
        run: |
          kubectl -n navigator port-forward service/postgres-spike 25432:5432 > /tmp/journal-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/25432' 2>/dev/null; then break; fi
            sleep 1
          done
          cargo test -p store --lib journal_startup_migration::
          cargo test -p store \
            --test firm_journal --test postgres_tooling --test brand_move_mirror
      - name: Runtime role-proof cleanup refuses changed ownership or mounts
        run: python3 images/postgres/tests/test-runtime-graph-cleanup.py
      - name: Runtime graph writers use genuine native admission and restricted App roles
        env:
          NAVIGATOR_FORBID_SURREAL: '1'
          RUST_MIN_STACK: '33554432'
        run: |
          bash images/postgres/tests/runtime-graph-roles.sh 2>&1 | tee "$RUNNER_TEMP/postgres-smoke/runtime-graph-roles.log"
      - name: JWT health detects optional ambiguity and pins before the first probe
        env:
          NAVIGATOR_FORBID_SURREAL: '1'
        run: |
          cargo test -p workflows-service --features restate-compatibility --features workflows-service/jwt-provider-regression \
            --test crypto_provider_health_check
          cargo test -p workflows-service --features restate-compatibility --features workflows-service/jwt-provider-regression \
            --lib request_identity::tests
      - name: Retained request identity and captured object wire codecs
        env:
          NAVIGATOR_FORBID_SURREAL: '1'
        run: |
          cargo test -p workflows-service --features restate-compatibility --test request_identity_signature
          cargo test -p workflows-service --features restate-compatibility --test object_handover \
            sdk_wire_codec_matches_native_capture_fixture -- --exact
      - name: Retained object discovery and embedded identity admission
        env:
          KUBECONFIG: /tmp/postgres-kind.config
          NAVIGATOR_TEST_POSTGRES_PORT: '25432'
          NAVIGATOR_FORBID_SURREAL: '1'
          RUST_MIN_STACK: '33554432'
        run: |
          kubectl -n navigator port-forward --address 127.0.0.1 service/postgres-spike 25432:5432 > "$RUNNER_TEMP/postgres-smoke/host-mode-port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            kill -0 "$forward_pid"
            if bash -c 'echo > /dev/tcp/127.0.0.1/25432' 2>/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          cargo test -p workflows-service --features restate-compatibility --lib host::host_mode_tests
      - name: Application and DBOS state survive image replacement and dump restore
        env:
          KUBECONFIG: /tmp/postgres-kind.config
        run: |
          cargo build --manifest-path images/postgres/tests/dbos/Cargo.toml --locked
          bash store/postgres/tests/integrated_recovery.sh kind-postgres-compatibility \
            "$PWD/images/postgres/tests/dbos/target/debug/dbos-image-smoke" 25433 \
            2>&1 | tee "$RUNNER_TEMP/postgres-smoke/integrated-recovery.log"
      - name: Recover an in-flight DBOS workflow in a replacement pod
        env:
          KUBECONFIG: /tmp/postgres-kind.config
        run: |
          bash images/postgres/tests/dbos-pod-recovery.sh kind-postgres-compatibility \
            "$PWD/images/postgres/tests/dbos/target/debug/dbos-image-smoke" \
            2>&1 | tee "$RUNNER_TEMP/postgres-smoke/dbos-pod-recovery.log"
      - name: Capture Kubernetes evidence
        if: always()
        run: |
          if [[ -f /tmp/postgres-kind.config ]]; then
            export KUBECONFIG=/tmp/postgres-kind.config
            kubectl -n navigator get pods,pvc,statefulset -o wide > "$RUNNER_TEMP/postgres-smoke/kind-resources.log" 2>&1 || true
            kubectl -n navigator describe pod postgres-spike-0 > "$RUNNER_TEMP/postgres-smoke/kind-pod.log" 2>&1 || true
            kubectl -n navigator logs postgres-spike-0 > "$RUNNER_TEMP/postgres-smoke/kind-postgres.log" 2>&1 || true
          fi
      - name: Remove the CI-owned cluster
        if: always()
        run: kind delete cluster --name postgres-compatibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-compatibility
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/postgres-smoke/*.log

name: automerge

# Arms GitHub auto-merge on a pull request, and only on one a maintainer has
# labelled `automerge`. It is opt-in: an unlabelled pull request is never armed,
# whatever its author. The job lives in its own workflow, on a standard
# GitHub-hosted runner, so adding the label starts this job alone and does not
# restart `ci.yml` or cancel a CI run already in flight.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: automerge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Turn on GitHub auto-merge for a labelled PR on open, ready-for-review, label
  # and every push (`synchronize`). Auto-merge squash-merges the PR the moment its
  # gate is green and every required review thread is resolved. The step is
  # idempotent (it exits early when auto-merge is already on), so re-running on a
  # push is a harmless no-op that also re-arms auto-merge if a push cleared it.
  # To hold a labelled PR, remove the `automerge` label or convert it to draft
  # (the `draft == false` guard below skips drafts).
  # `gh pr merge --auto` only *requests* it; GitHub still holds the PR until the
  # required `ci` check passes and, for everyone but the organization
  # administrator, the code-owner review lands (see the `production` and
  # `production-review` rulesets in `cli/src/devx/github_setup.rs`).
  # The fork guard skips PRs from forks, whose GITHUB_TOKEN is read-only.
  enable-automerge:
    name: enable PR auto-merge
    # Only this job needs write; the test job stays contents:read (above).
    # `enablePullRequestAutoMerge` requires contents:write — pull-requests:write
    # alone returns "Resource not accessible by integration".
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'labeled' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize') &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # The App ID lives in a secret (not a variable) because the repo keeps
    # every workflow credential in GitHub Actions *secrets* —
    # this repo has no Actions *variables*. Hoisted to
    # job-level env so the step `if` below can gate on its presence: the
    # `secrets` context is unavailable in `if`, but `env` is.
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
    steps:
      # Arm auto-merge as a GitHub App, and ONLY as a GitHub App. The App
      # installation token carries the `contents: write` + `pull-requests: write`
      # this needs and arms auto-merge under a stable bot identity.
      #
      # WHICH IDENTITY ARMS IT DECIDES WHETHER THE RELEASE PUBLISHES. GitHub's
      # workflow-recursion guard creates no runs for a push attributed to
      # `GITHUB_TOKEN`, and since the version bump in the merged manifest IS the
      # publish, a merge armed under that token lands on `main` and starts no
      # `deploy` run at all. Nothing goes red; the release is simply never built.
      #
      # So both steps below are gated on the App being configured, and there is
      # NO fallback to the workflow token. An absent secret arms nothing and
      # leaves the PR for a human — visibly waiting, which a lost release is
      # not. A secret that is present but broken fails the mint and arms nothing
      # either. Both are fail-closed on purpose, and
      # `cli/tests/automerge_identity.rs` asserts the fallback stays absent.
      # Forks, which hold no secrets, skip both steps and still pass.
      #
      # Dependabot note: a Dependabot-opened PR runs this job against the
      # separate *Dependabot* secret store, so both secrets exist there as well
      # as in the Actions store. Without them its bumps would arm nothing.
      - name: mint app token
        id: app-token
        if: env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: request auto-merge
        if: env.AUTOMERGE_APP_ID != ''
        env:
          # The App installation token, and nothing else.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `gh` targets github.com unless told otherwise, which is where this
          # repository lives — so the default is right here and was not on the
          # tenant this moved off, where an Actions token sent to api.github.com
          # came back "Bad credentials" (HTTP 401) rather than a permissions
          # error. Derive the API host from the run itself so the same block
          # works on any host.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          auto_merge_enabled="$(
              gh pr view "${PR_URL}" \
                  --json autoMergeRequest \
                  --jq '.autoMergeRequest != null'
          )"
          if [ "${auto_merge_enabled}" = "true" ]; then
              echo "auto-merge already enabled; nothing to do."
              exit 0
          fi
          # The CLI enables auto-merge while required gates are pending, and
          # performs the governed squash merge when they already pass. GitHub
          # rejects enablePullRequestAutoMerge for an immediately mergeable PR,
          # including UNSTABLE when only an optional check failed. The App owns
          # both paths; GitHub still enforces branch policy and the event's head.
          # A defensive soft pass, not the expected path. Arming auto-merge is
          # a mutation on the pull request rather than a write of workflow
          # content, and a PR editing `.github/workflows/*` does arm and merge
          # under this App — #99 did exactly that. An installation whose token
          # lacked the reach would instead see "refusing to allow a GitHub App
          # to create or update workflow ... without `workflows` permission",
          # which no CI change can fix, so that one refusal is reported and
          # passed over. Every other failure is real and fails the job.
          if ! result="$(gh pr merge --auto --squash \
              --match-head-commit "${PR_HEAD_SHA}" "${PR_URL}" 2>&1)"; then
              if printf '%s' "${result}" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
                  echo "::warning::the App was refused for lack of the \`workflows\` permission on a PR that edits workflow files. Merge this PR manually."
                  printf '%s\n' "${result}"
                  exit 0
              fi
              printf '%s\n' "${result}" >&2
              exit 1
          fi
          printf '%s\n' "${result}"

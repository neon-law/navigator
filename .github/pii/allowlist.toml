# What `navigator pii` may find without failing the build.
#
# Each table is a group of `values` that share one `reason`. A synthetic
# fixture name, a public firm fact, a published case caption, or a copyright
# attribution belongs here. A real person's contact data never does: replace it
# with a synthetic one (reserved `.example` / `.test` / `.invalid` domains,
# 555-0100..0199 phone numbers, a zodiac first name). A single line can opt
# out with a `pii-scan: allow` comment when the reason fits on that line.
#
# Matching is case-insensitive. A name is allowed when it is listed whole under
# `names`, when every word of it is a `name_tokens` entry, or when any word of
# it is a `non_name_words` entry (the model calling a font or a product a
# person). An email is allowed on a listed domain or any subdomain of one.

[[paths]]
reason = "Vendored third-party code, generated inventories, and the scanner itself."
values = [
  "cargo.lock",
  "server/public/vendor/*",
  "server/public/swagger-ui/*",
  "server/tests/assets/axe.min.js",
  "k8s/vendor/*",
  "vendor/*",
  "store/postgres/caller-inventory.json",
  "store/postgres/source-call-sites.jsonl",
  ".github/pii/*",
]

[[paths]]
reason = "Generated court registry data and its generator: only published form titles, court addresses, and fee schedules appear here — no personal contact data. (Presidio false-positives: the Latin phrase 'in forma pauperis' as a PERSON, street names, and dollar amounts in fee notes as PHONE_NUMBER.)"
values = [
  "store/seeds/Court.yaml",
  "gen_court.py",
]

[[paths]]
reason = "Copyright attributions the licences require."
values = [
  "third-party-notices.txt",
  "*/ofl.txt",
  "*/license",
  "*/licence",
  "notice",
]


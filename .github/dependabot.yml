# Do not add ignore rules or change this configuration to hide a vulnerable dependency.
# Change schedules or grouping only when explicitly requested by the user.
# Fix incompatible dependency updates in the code or manifest.
#
# Why a Dependabot PR sometimes enables auto-merge but never enters the merge
# queue — and how to fix it (mirror the auto-merge App secrets into the separate
# Dependabot secret store) — is documented in docs/gitops.md.
#
# Dependabot version-updates configuration reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust crates — the whole Cargo workspace (root manifest + members).
  # Minor/patch bumps are grouped into one PR to cut noise; majors come as
  # individual PRs and stay gated behind /council per the workspace rules.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the three CI/deploy workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images for the container builds under images/.
  - package-ecosystem: "docker"
    directories:
      - "/images"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/lsp/vscode-ext"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/word/adapter"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

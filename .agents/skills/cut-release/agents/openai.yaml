interface:
  display_name: "Cut Release"
  short_description: "Cut the next release as a version-bump PR: today's YY.M.D, or tomorrow's YY.M.D-rc.N once today's is published."
  default_prompt: "Use $cut-release to cut the next release. If I name a version, use it; otherwise take ops release-default-tag. Run the preflight, write the version, and open a ready PR. Leave tagging to deploy.yml."
